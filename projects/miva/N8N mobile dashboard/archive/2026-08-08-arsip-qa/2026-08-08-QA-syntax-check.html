}\nif (message === undefined || message === null || String(message).trim() === '') {\n  throw new Error('Kirimi: pesan kosong (Process All.cleanOutput)');\n}\nif (!cfg.user_code || !cfg.secret || !cfg.device_id) {\n  throw new Error('Kirimi: kredensial tidak lengkap (user_code/secret/device_id)');\n}\n\n// ---- 1) KIRIM (dengan retry khusus kegagalan HTTP) ----\nlet responseData = null;\nlet lastErr = null;\n\nfor (let attempt = 1; attempt <= MAX_HTTP_ATTEMPTS; attempt++) {\n  try {\n    responseData = await this.helpers.httpRequest({\n      method: 'POST',\n      url: KIRIMI_URL,\n      body: {\n        user_code: cfg.user_code,\n        secret: cfg.secret,\n        device_id: cfg.device_id,\n        phone: phone,\n        message: message,\n      },\n      json: true,\n      timeout: TIMEOUT_MS,\n    });\n    lastErr = null;\n    break;\n  } catch (e) {\n    lastErr = e;\n    console.log('Kirimi HTTP gagal (percobaan ' + attempt + '/' + MAX_HTTP_ATTEMPTS + '): ' + (e && e.message ? e.message : String(e)));\n    if (attempt < MAX_HTTP_ATTEMPTS) { await sleep(WAIT_MS); }\n  }\n}\n\nif (lastErr) {\n  throw new Error('Kirimi HTTP gagal setelah ' + MAX_HTTP_ATTEMPTS + ' percobaan: ' + (lastErr && lastErr.message ? lastErr.message : String(lastErr)));\n}\n\n// ---- 2) VERIFIKASI ISI RESPONS (logika lama \"Check API Response\") ----\nconst rd = (responseData && typeof responseData === 'object') ? responseData : {};\nconst explicitFail = rd.success === false || rd.status === false;\nconst isSuccess = !explicitFail && (\n  rd.status === true ||\n  rd.success === true ||\n  (rd.data && rd.data.id) ||\n  (rd.message && rd.message !== 'error')\n);\n\nif (!isSuccess) {\n  throw new Error('Kirimi API gagal (HTTP 200 tapi respons menolak): ' + JSON.stringify(responseData));\n}\n\nconsole.log('Kirimi sukses:', JSON.stringify(responseData));\nreturn [{ json: rd }];\n", "PCRv13": "// ============================================================\n// Send WA + Verify (Kirimi)\n// Gabu | message === null || String(message).trim() === '') {\n  throw new Error('Kirimi: pesan kosong (Process All.cleanOutput)');\n}\nif (!cfg.user_code || !cfg.secret || !cfg.device_id) {\n  throw new Error('Kirimi: kredensial tidak lengkap (user_code/secret/device_id)');\n}\n\n// ---- 1) KIRIM (dengan retry khusus kegagalan HTTP) ----\nlet responseData = null;\nlet lastErr = null;\n\nfor (let attempt = 1; attempt <= MAX_HTTP_ATTEMPTS; attempt++) {\n  try {\n    responseData = await this.helpers.httpRequest({\n      method: 'POST',\n      url: KIRIMI_URL,\n      body: {\n        user_code: cfg.user_code,\n        secret: cfg.secret,\n        device_id: cfg.device_id,\n        phone: phone,\n        message: message,\n      },\n      json: true,\n      timeout: TIMEOUT_MS,\n    });\n    lastErr = null;\n    break;\n  } catch (e) {\n    lastErr = e;\n    console.log('Kirimi HTTP gagal (percobaan ' + attempt + '/' + MAX_HTTP_ATTEMPTS + '): ' + (e && e.message ? e.message : String(e)));\n    if (attempt < MAX_HTTP_ATTEMPTS) { await sleep(WAIT_MS); }\n  }\n}\n\nif (lastErr) {\n  throw new Error('Kirimi HTTP gagal setelah ' + MAX_HTTP_ATTEMPTS + ' percobaan: ' + (lastErr && lastErr.message ? lastErr.message : String(lastErr)));\n}\n\n// ---- 2) VERIFIKASI ISI RESPONS (logika lama \"Check API Response\") ----\nconst rd = (responseData && typeof responseData === 'object') ? responseData : {};\nconst explicitFail = rd.success === false || rd.status === false;\nconst isSuccess = !explicitFail && (\n  rd.status === true ||\n  rd.success === true ||\n  (rd.data && rd.data.id) ||\n  (rd.message && rd.message !== 'error')\n);\n\nif (!isSuccess) {\n  throw new Error('Kirimi API gagal (HTTP 200 tapi respons menolak): ' + JSON.stringify(responseData));\n}\n\nconsole.log('Kirimi sukses:', JSON.stringify(responseData));\nreturn [{ json: rd }];\n"};
const ALL = {"V4 :: Chat Counter": "const webhookData = $input.first();\nconst body = webhookData.json.body || {};\n\n// Ambil data dari Kirimi\nconst userMessage = body.message || \"\";\nconst messageType = body.messageType || \"\";\nconst userNumber = body.from || \"unknown\";  // ← TIDAK strip @lid, passthrough as-is\nconst _isLid    = String(userNumber).toLowerCase().includes('@lid');\nconst userLid   = String(body.originLid || (_isLid ? userNumber : '')).replace(/\\D/g, '');// kunci cocok\nconst userPhone = _isLid ? '' : String(userNumber).replace(/\\D/g, '');// utk kolom No WA\nconst userName = body.name || body.pushName || body.notifyName || \"User\";\nconst isFromMe = body.isFromMe === true;\nconst eventType = body.event || \"\";\n\n// Filter: hanya pesan teks yang tidak kosong\nif (messageType !== \"text\" || !userMessage || userMessage.trim() === \"\") {\n    console.log('⛔ STOP: Bukan pesan teks valid');\n    return [];\n}\n\nconsole.log('✅ LANJUT: Pesan teks valid dari user');\nconsole.log('📱 No WA:', userNumber);\n\n// Counter sederhana\nlet counter = $vars.chatCounter || 0;\ncounter++;\n$vars.chatCounter = counter;\n\n// Format tanggal & jam WIB\nconst now = new Date();\nconst formattedDate = now.toLocaleDateString('en-GB', {\n    timeZone: 'Asia/Jakarta',\n    day: '2-digit',\n    month: '2-digit',\n    year: 'numeric'\n});\nconst formattedTime = now.toLocaleTimeString('id-ID', {\n    hour: '2-digit',\n    minute: '2-digit',\n    second: '2-digit',\n    hour12: false,\n    timeZone: 'Asia/Jakarta'\n}).replace(/\\./g, ':');\n\nconst processStartTs = Date.now();\n\nconst aiInputText = `[SYSTEM_DATA]\nCHAT_COUNTER: ${counter}\nUSER_NAME: ${userName}\nUSER_MESSAGE: \"${userMessage}\"\n\n[USER QUERY]\n${userMessage}`;\n\nreturn [{\n    json: {\n        chat_counter: counter,\n        user_wa: userNumber,\n        user_lid: userLid,\n        user_phone: userPhone,\n        user_name: userName,\n        formatted_date: formattedDate,\n        formatted_time: formattedTime,\n        ai_input_text: aiInputText,\n        original_message: userMessage,\n        body: body,\n        message_type: messageType,\n        process_start_ts: processStartTs\n    }\n}];", "V4 :: Process Counter & Merge Data": "// ====================================================================\n// PROCESS COUNTER & MERGE DATA (V4)\n// Fix: (1) matching row No WA primer / lid backup (bukan lid-only),\n//      (2) \"Tanggal Chat Pertama\" dibaca dari kolom yang benar\n//          (dulu baca existingRow.Tanggal yang tidak ada -> tanggal\n//          pertama ter-reset jadi hari ini setiap pesan),\n//      (3) error -> stop (return []) alih-alih menulis row \"ERROR\".\n// ====================================================================\nconst debugLog = [];\n\ntry {\n    const allItems = $input.all();\n    debugLog.push(\"Step 1: Received \" + allItems.length + \" items from Read STATS\");\n\n    const chatCounter = $('Chat Counter').first().json;\n    const resolve = $('Resolve User Row').first().json;\n    const resolvedKey = resolve.resolved_key;\n\n    const userName = chatCounter.user_name || \"User\";\n    const userMessage = chatCounter.original_message || \"\";\n    const digits = v => String(v ?? '').replace(/\\D/g, '');\n    const phone = digits(chatCounter.user_phone);\n    const lid = digits(chatCounter.user_lid);\n\n    if (!resolvedKey) {\n        console.warn(\"resolved_key kosong - skip update STATS\");\n        return [];\n    }\n\n    // Process sheet rows\n    const sheetRows = allItems\n        .filter(item => {\n            const data = item?.json || item;\n            if (!data || Object.keys(data).length === 0) return false;\n            return !!(data['lid'] || data['No WA'] || data.no_wa || data.NoWA);\n        })\n        .map(item => item?.json || item);\n\n    debugLog.push(\"Step 2: Sheet rows found: \" + sheetRows.length);\n\n    // Find existing row: No WA primer, lid backup (konsisten dgn Resolve User Row)\n    let existingRow = null;\n    if (phone) existingRow = sheetRows.find(r => digits(r['No WA']) === phone) || null;\n    if (!existingRow && lid) {\n        existingRow = sheetRows.find(r => digits(r['lid']) === lid)\n                   || sheetRows.find(r => digits(r['No WA']) === lid)\n                   || null;\n    }\n\n    const isNewUser = !existingRow;\n    debugLog.push(\"Step 3: \" + (isNewUser ? \"NEW USER\" : \"EXISTING USER\"));\n\n    let counter, pesanPertama, tanggalPertama, intensitasChat;\n\n    if (existingRow) {\n        counter = parseInt(existingRow.Counter || existingRow.counter || 0) + 1;\n        intensitasChat = parseInt(existingRow['Intensitas Chat'] || existingRow.intensitas_chat || 0) + 1;\n\n        const pesanLama = existingRow['Pesan Pertama'] || existingRow.pesan_pertama;\n        pesanPertama = (pesanLama && String(pesanLama).trim() !== '') ? pesanLama : userMessage;\n\n        // V4 FIX: baca kolom yang benar\n        const tglLama = existingRow['Tanggal Chat Pertama'];\n        tanggalPertama = (tglLama && String(tglLama).trim() !== '') ? tglLama : null;\n    } else {\n        counter = 1;\n        intensitasChat = 1;\n        pesanPertama = userMessage;\n        tanggalPertama = null;\n    }\n\n    if (!tanggalPertama) {\n        tanggalPertama = new Date().toLocaleDateString('en-GB', {\n            timeZone: 'Asia/Jakarta', day: '2-digit', month: '2-digit', year: 'numeric'\n        });\n    }\n\n    const outputData = {\n        \"No WA\": resolvedKey,\n        \"lid\": lid,\n        \"Tanggal\": tanggalPertama,\n        \"TanggalSekarang\": new Date().toLocaleDateString('en-GB', {\n            timeZone: 'Asia/Jakarta', day: '2-digit', month: '2-digit', year: 'numeric'\n        }),\n        \"Nama\": userName,\n        \"Pesan Pertama\": pesanPertama,\n        \"Counter\": counter,\n        \"Intensitas Chat\": intensitasChat\n    };\n\n    return [{ json: outputData }];\n\n} catch (error) {\n    // V4 FIX: jangan menulis row \"ERROR\" ke sheet - cukup log & stop.\n    console.error(\"Process Counter ERROR: \" + error.message, debugLog);\n    return [];\n}\n", "V4 :: Extract & Prepare Data": "const chatCounter = $('Chat Counter').first().json;\n\n// DATA LANGSUNG DARI CHAT COUNTER NODE\nconst userNumber = chatCounter.user_wa;\nconst userName = chatCounter.user_name;\nconst userMessage = chatCounter.original_message;   // ← perbaikan utama\n\n// VALIDASI SEDERHANA\nif (!userNumber) {\n  throw new Error(\"user_wa tidak ditemukan di input!\");\n}\n\nconsole.log(\"✅ Data berhasil di-extract:\");\nconsole.log(\"- No WA:\", userNumber);\nconsole.log(\"- Nama:\", userName);\nconsole.log(\"- Pesan:\", userMessage);\n\nreturn [{\n  json: {\n    search_no_wa: userNumber,\n    user_name: userName,\n    user_message: userMessage,\n    timestamp: chatCounter.formatted_date + ' ' + chatCounter.formatted_time + ' WIB',\n    source: \"chat_counter_node\",\n    is_valid: userNumber !== \"unknown\"\n  }\n}];", "V4 :: Send WA + Verify (Kirimi)": "// ============================================================\n// Send WA + Verify (Kirimi)\n// Gabungan node lama: \"Reply Chat Kirimi\" (HTTP Request) + \"Check API Response\" (Code).\n//\n// KENAPA DIGABUNG:\n// n8n me-retry MULAI DARI node yang gagal (runData node sebelumnya dipertahankan).\n// Kalau validasi berdiri sendiri sebagai node terpisah, klik Retry hanya mengulang\n// validasi dengan respons Kirimi yang lama -> throw lagi -> WA tidak pernah\n// terkirim ulang. Dengan digabung, satu klik Retry benar-benar mengirim ulang.\n//\n// On Error = Stop Workflow (sengaja, jangan diubah): supaya execution jadi merah,\n// Error Notifier jalan, dan execution bisa di-retry dari mobile dashboard.\n//\n// Retry HTTP ditangani DI DALAM kode ini (3x, jeda 5 detik) supaya persis meniru\n// perilaku lama node \"Reply Chat Kirimi\" (retryOnFail: true, waitBetweenTries: 5000).\n// Retry TIDAK berlaku untuk kegagalan \"HTTP 200 tapi status:false\" -- sama seperti\n// node \"Check API Response\" lama yang tidak punya retryOnFail. Ini disengaja:\n// respons status:false berarti Kirimi sudah memproses permintaan, jadi mengirim\n// ulang otomatis berisiko pesan dobel. Kirim ulang untuk kasus itu = keputusan\n// manusia, lewat tombol Retry.\n// ============================================================\n\nconst KIRIMI_URL = 'https://api.kirimi.id/v1/send-message';\nconst TIMEOUT_MS = 60000;\nconst MAX_HTTP_ATTEMPTS = 3;\nconst WAIT_MS = 5000;\n\nconst sleep = (ms) => new Promise((resolve) => {\n  if (typeof setTimeout === 'function') { setTimeout(resolve, ms); } else { resolve(); }\n});\n\n// --- kredensial: literal, sama persis dengan node HTTP lama ---\nconst cfg = {\n  user_code: 'KM40LI0426',\n  secret: 'REDACTED',\n  device_id: 'D-4ZV1F',\n};\n\nconst phone = $('Chat Counter').first().json.user_wa;\nconst message = $('Process All').first().json.cleanOutput;\n\nif (!phone) {\n  throw new Error('Kirimi: nomor tujuan kosong (Chat Counter.user_wa)');\n}\nif (message === undefined || message === null || String(message).trim() === '') {\n  throw new Error('Kirimi: pesan kosong (Process All.cleanOutput)');\n}\nif (!cfg.user_code || !cfg.secret || !cfg.device_id) {\n  throw new Error('Kirimi: kredensial tidak lengkap (user_code/secret/device_id)');\n}\n\n// ---- 1) KIRIM (dengan retry khusus kegagalan HTTP) ----\nlet responseData = null;\nlet lastErr = null;\n\nfor (let attempt = 1; attempt <= MAX_HTTP_ATTEMPTS; attempt++) {\n  try {\n    responseData = await this.helpers.httpRequest({\n      method: 'POST',\n      url: KIRIMI_URL,\n      body: {\n        user_code: cfg.user_code,\n        secret: cfg.secret,\n        device_id: cfg.device_id,\n        phone: phone,\n        message: message,\n      },\n      json: true,\n      timeout: TIMEOUT_MS,\n    });\n    lastErr = null;\n    break;\n  } catch (e) {\n    lastErr = e;\n    console.log('Kirimi HTTP gagal (percobaan ' + attempt + '/' + MAX_HTTP_ATTEMPTS + '): ' + (e && e.message ? e.message : String(e)));\n    if (attempt < MAX_HTTP_ATTEMPTS) { await sleep(WAIT_MS); }\n  }\n}\n\nif (lastErr) {\n  throw new Error('Kirimi HTTP gagal setelah ' + MAX_HTTP_ATTEMPTS + ' percobaan: ' + (lastErr && lastErr.message ? lastErr.message : String(lastErr)));\n}\n\n// ---- 2) VERIFIKASI ISI RESPONS (logika lama \"Check API Response\") ----\nconst rd = (responseData && typeof responseData === 'object') ? responseData : {};\nconst explicitFail = rd.success === false || rd.status === false;\nconst isSuccess = !explicitFail && (\n  rd.status === true ||\n  rd.success === true ||\n  (rd.data && rd.data.id) ||\n  (rd.message && rd.message !== 'error')\n);\n\nif (!isSuccess) {\n  throw new Error('Kirimi API gagal (HTTP 200 tapi respons menolak): ' + JSON.stringify(responseData));\n}\n\nconsole.log('Kirimi sukses:', JSON.stringify(responseData));\nreturn [{ json: rd }];\n", "V4 :: HITL Check": "// ============================================================\n// HUMAN-IN-THE-LOOP CHECK (V4: No WA primer, lid backup)\n// bot_mode = 'OFF' -> Sam handle manual -> stop.\n// ============================================================\nconst cc = $('Chat Counter').first().json;\nconst digits = v => String(v ?? '').replace(/\\D/g, '');\nconst phone = digits(cc.user_phone);\nconst lid = digits(cc.user_lid);\n\nconst statsRows = $('Read STATS for HITL').all()\n  .map(r => r.json)\n  .filter(r => r && Object.keys(r).length > 0);\n\nlet userRow = null;\nif (phone) userRow = statsRows.find(r => digits(r['No WA']) === phone) || null;\nif (!userRow && lid) {\n  userRow = statsRows.find(r => digits(r['lid']) === lid)\n         || statsRows.find(r => digits(r['No WA']) === lid)\n         || null;\n}\n\nconst botMode = userRow ? String(userRow['bot_mode'] || '').trim().toUpperCase() : '';\n\nif (botMode === 'OFF') {\n  console.log(`👨‍💼 HITL AKTIF — Sam sedang handle manual, bot berhenti.`);\n  return [];\n}\n\nconsole.log(`🤖 Bot mode AKTIF (bot_mode=\"${botMode}\") — lanjut.`);\nreturn [$input.first()];\n", "V4 :: Cek_user_status": "// ====================================================================\n// NODE: Cek_user_status (V4)\n// Peran: gate HITL post-debounce + gabung pesan MSG_BUFFER +\n//        siapkan SYSTEM_DATA (intro user baru, kelas tersimpan).\n// Alur status PARENT/STUDENT sudah DIHAPUS (register netral).\n// ====================================================================\nconst cc = $('Chat Counter').first().json;\nconst resolve = $('Resolve User Row').first().json;\nconst resolvedKey = resolve.resolved_key;\n\n// bot_mode dicek ulang SETELAH debounce (Wait 60 detik) —\n// Sam bisa set OFF kapan saja selama bot menunggu.\nconst debounceItem = $('Re-Read STATS Debounce').first();\nconst debounceRow = (debounceItem && debounceItem.json) ? debounceItem.json : {};\nconst botModeNow = String(debounceRow['bot_mode'] || '').trim().toUpperCase();\nif (botModeNow === 'OFF') {\n  console.log('👨‍💼 HITL (post-debounce): bot_mode OFF — berhenti, Sam handle manual.');\n  return [];\n}\n\n// ── Gabung pesan dari MSG_BUFFER (append-only, anti lost-update) ──\n// Konsumsi: ts > buffer_done_ts (watermark) dan ts <= process_start_ts saya.\nconst doneTs = Number(debounceRow['buffer_done_ts'] || 0) || 0;\nconst myTs = Number(cc.process_start_ts) || 0;\nlet bufRows = [];\ntry {\n  bufRows = $('Read MSG_BUFFER').all()\n    .map(i => i.json)\n    .filter(r => r && r.message !== undefined && r.message !== null);\n} catch (e) {\n  console.warn('⚠️ Read MSG_BUFFER tidak terbaca:', e.message);\n}\n// Batas kedaluwarsa: pesan lebih tua dari 30 menit tidak ikut digabung\n// (mis. pesan yang sempat ter-buffer lalu ditangani manual oleh Sam saat bot OFF).\nconst MAX_AGE_MS = 30 * 60 * 1000;\nconst msgs = bufRows\n  .map(r => ({ ts: Number(r.ts) || 0, message: String(r.message ?? '').trim() }))\n  .filter(r => r.ts > doneTs && r.ts <= myTs && (myTs - r.ts) < MAX_AGE_MS && r.message !== '')\n  .sort((a, b) => a.ts - b.ts)\n  .map(r => r.message);\n\n// Fallback aman: kalau buffer kosong (mis. append gagal), pakai pesan asli.\nconst userMessage = msgs.length ? msgs.join('\\n') : (cc.original_message || '');\nconsole.log(`📨 userMessage final ke AI (${msgs.length} pesan digabung):\\n${userMessage}`);\n\n// ── User baru? (greeting_sent belum Y) ──\nconst greetingSent = String(debounceRow['greeting_sent'] || resolve.greeting_sent || '').trim().toUpperCase();\nconst isNewUser = greetingSent !== 'Y';\n\n// ── Fakta persisten (tahan restart n8n / reset memory) ──\n// TTL 60 hari: kelas berubah tiap tahun ajaran, jangan injeksi data basi.\nconst KELAS_TTL_S = 60 * 86400;\nconst kelasTs = Number(debounceRow['kelas_anak_ts'] || resolve.kelas_anak_ts || 0) || 0;\nconst kelasFresh = kelasTs > 0 && (Math.floor(Date.now() / 1000) - kelasTs) <= KELAS_TTL_S;\nconst kelasAnak = kelasFresh ? String(debounceRow['kelas_anak'] || resolve.kelas_anak || '').trim() : '';\nconst programInterest = kelasFresh ? String(debounceRow['program_interest'] || resolve.program_interest || '').trim() : '';\nif (kelasTs && !kelasFresh) console.log('⏳ kelas_anak kedaluwarsa (>60 hari) — tidak diinjeksi.');\n\nconst INTRO = 'Haloo thank you sudah contact TheScholars.id yaa. Saya Sam versi AI yaa, saya siap bantu untuk jawab pertanyaan yang ada mengenai program kita dan scholarships ke Singapore.';\n\nconst aiSystemData = `[SYSTEM_DATA]\nUSER_WA: ${resolvedKey}\nIS_NEW_USER: ${isNewUser}\nKELAS_ANAK: ${kelasAnak || 'UNKNOWN'}\nPROGRAM_INTEREST: ${programInterest || 'UNKNOWN'}\n\nCRITICAL INSTRUCTION:\n${isNewUser\n  ? `USER BARU. Baris pertama balasan WAJIB intro ini PERSIS (jangan diubah/diringkas): \"${INTRO}\" Setelah intro, di pesan yang sama langsung jawab pertanyaan user kalau ada. Kalau user hanya menyapa, cukup intro saja.`\n  : 'User lama. JANGAN kirim intro/perkenalan lagi, lanjutkan percakapan secara natural. Jangan reset percakapan dari awal.'}\n\n[USER QUERY]\n${userMessage}`;\n\nreturn [{\n  json: {\n    ...cc,\n    resolved_key: resolvedKey,\n    ai_input_text: aiSystemData,\n    user_message_final: userMessage,\n    is_new_user: isNewUser,\n    kelas_anak_db: kelasAnak,\n    program_interest_db: programInterest,\n    buffer_done_ts_old: doneTs\n  }\n}];\n", "V4 :: Update STATS - Greeting Flag": "// ====================================================================\n// UPDATE GREETING FLAG (V4 - disederhanakan)\n// Dulu: pattern-matching teks balasan (rapuh, tergantung susunan\n// kalimat). Sekarang: cukup dari flag is_new_user — kalau eksekusi\n// ini mengirim intro ke user baru (reply sudah SUKSES terkirim\n// karena node ini jalan setelah Reply Chat Kirimi), tandai Y.\n// ====================================================================\nconst isNewUser = $('Cek_user_status').first().json.is_new_user === true;\n\nif (isNewUser) {\n  console.log('📝 [GREETING] intro terkirim ke user baru -> greeting_sent = Y');\n}\n\nreturn [{\n  json: {\n    update_needed: isNewUser ? 'true' : 'false',\n    greeting_sent: 'Y'\n  }\n}];\n", "V4 :: Preprocess - Context Detection": "// ============================================\n// PREPROCESS - CONTEXT DETECTION (V4)\n// - Deteksi status PARENT/STUDENT DIHAPUS (register netral).\n// - Deteksi kelas MULTI-VALUE: bisa menangkap >1 kelas dalam satu\n//   pesan (kasus orang tua dengan beberapa anak). Disimpan sebagai\n//   daftar \"SMP 1, SD 6\".\n// - Dukung jenjang Singapura/internasional (Primary/Sec) & angka\n//   Romawi; fallback kelas tersimpan dari DB (kelas_anak, TTL di\n//   Cek_user_status).\n// ============================================\n\nconst json = $input.item.json;\n\n// Get the full message (includes SYSTEM_DATA + user query)\nconst fullMessage = json.message || json.ai_input_text || json.text || json.body || '';\n\n// ============================================\n// 1. EXTRACT USER QUERY\n// ============================================\nlet actualUserMessage = '';\nif (fullMessage.includes('[USER QUERY]')) {\n  const parts = fullMessage.split('[USER QUERY]');\n  actualUserMessage = parts[1] ? parts[1].trim() : '';\n} else {\n  actualUserMessage = fullMessage.trim();\n}\n\n// ============================================\n// 2. PARSE SYSTEM_DATA\n// ============================================\nlet isNewUser = false;\nlet kelasAnakDB = '';\nlet programInterestDB = '';\n\nif (fullMessage.includes('[SYSTEM_DATA]')) {\n  const newUserMatch = fullMessage.match(/IS_NEW_USER:\\s*(\\w+)/i);\n  if (newUserMatch) isNewUser = newUserMatch[1].toLowerCase() === 'true';\n\n  const kelasMatch = fullMessage.match(/KELAS_ANAK:\\s*([^\\n]+)/i);\n  if (kelasMatch) {\n    const v = kelasMatch[1].trim();\n    if (v && v.toUpperCase() !== 'UNKNOWN') kelasAnakDB = v;\n  }\n  const progMatch = fullMessage.match(/PROGRAM_INTEREST:\\s*([^\\n]+)/i);\n  if (progMatch) {\n    const v = progMatch[1].trim();\n    if (v && v.toUpperCase() !== 'UNKNOWN') programInterestDB = v;\n  }\n}\n\n// ============================================\n// 3. PROCESS MESSAGE\n// ============================================\nconst message = actualUserMessage.toLowerCase().replace(/\\bkls\\b/g, 'kelas').replace(/\\bklas\\b/g, 'kelas');\nconst userPhone = json.userPhone || json.from || json.phone || json.user_wa || 'unknown';\n\n// ============================================\n// 4. DETECT GRADE(S) & PROGRAM(S) — MULTI-VALUE\n//    Semua pola discan (bukan berhenti di match pertama) supaya\n//    \">1 anak\" dalam satu pesan tertangkap semua.\n//    Seniors KHUSUS kelas 12. SMA 10/11 -> belum ada program.\n// ============================================\nconst GRADE_PATTERNS = [\n  // Jenjang internasional/Singapura (intl=true)\n  [/\\b(?:primary|pri)\\s*\\.?\\s*6\\b|\\bp6\\b/i,        'SD 6',      'Junior',       true],\n  [/\\b(?:sec|secondary)\\s*\\.?\\s*1\\b/i,             'SMP 1',     'Junior',       true],\n  [/\\b(?:sec|secondary)\\s*\\.?\\s*2\\b/i,             'SMP 2',     'Intermediate', true],\n  [/\\b(?:sec|secondary)\\s*\\.?\\s*3\\b/i,             'SMP 3',     'Intermediate', true],\n  [/\\b(?:sec|secondary)\\s*\\.?\\s*4\\b/i,             'SMA 10/11', '',             true],\n  // Angka Romawi (\\b menjaga 'kelas x' tidak match di 'kelas xii')\n  [/kelas\\s*xii\\b/i,                               'SMA 12',    'Seniors',      false],\n  [/kelas\\s*xi\\b/i,                                'SMA 10/11', '',             false],\n  [/kelas\\s*x\\b/i,                                 'SMA 10/11', '',             false],\n  [/kelas\\s*ix\\b/i,                               'SMP 3',     'Intermediate', false],\n  [/kelas\\s*viii\\b/i,                             'SMP 2',     'Intermediate', false],\n  [/kelas\\s*vii\\b/i,                              'SMP 1',     'Junior',       false],\n  [/kelas\\s*vi\\b/i,                               'SD 6',      'Junior',       false],\n  // Pola Indonesia\n  [/sd 6|kelas 6 sd|kelas 6(?!\\s*smp)/i,           'SD 6',      'Junior',       false],\n  [/smp 1|kelas 1 smp|kelas 7\\b/i,                 'SMP 1',     'Junior',       false],\n  [/smp 2|kelas 2 smp|kelas 8\\b/i,                 'SMP 2',     'Intermediate', false],\n  [/smp 3|kelas 3 smp|kelas 9\\b/i,                 'SMP 3',     'Intermediate', false],\n  [/sma 3|kelas 3 sma|kelas 12\\b/i,                'SMA 12',    'Seniors',      false],\n  [/sma 1|sma 2|kelas 1 sma|kelas 2 sma|kelas 10\\b|kelas 11\\b/i, 'SMA 10/11', '', false],\n];\n\nconst PROGRAM_OF = { 'SD 6': 'Junior', 'SMP 1': 'Junior', 'SMP 2': 'Intermediate', 'SMP 3': 'Intermediate', 'SMA 12': 'Seniors', 'SMA 10/11': '' };\n\nlet grades = [];\nlet intlSystemDetected = false;\nfor (const [re, label, prog, intl] of GRADE_PATTERNS) {\n  if (re.test(message) && !grades.includes(label)) {\n    grades.push(label);\n    if (intl) intlSystemDetected = true;\n  }\n}\n// Fallback generik SMA (kelas belum jelas) hanya kalau tidak ada match lain\nlet smaUnclear = false;\nif (!grades.length && message.match(/sma|kelas.*sma/i)) {\n  smaUnclear = true;\n}\n\n// Fallback: kelas tersimpan dari percakapan sebelumnya (DB, sudah lolos TTL)\nlet gradeFromDB = false;\nif (!grades.length && !smaUnclear && kelasAnakDB) {\n  grades = kelasAnakDB.split(',').map(s => s.trim()).filter(Boolean);\n  gradeFromDB = true;\n}\n\nconst programs = [...new Set(grades.map(g => PROGRAM_OF[g] || '').filter(Boolean))];\nconst noProgramGrades = grades.filter(g => !(PROGRAM_OF[g] || ''));\n\n// String gabungan (dipakai untuk penyimpanan kelas_anak & kompatibilitas)\nconst grade = grades.join(', ');\nconst recommendedProgram = gradeFromDB && programInterestDB ? programInterestDB : programs.join(', ');\n\n// ============================================\n// 5. DETECT REGISTRATION INTENT\n// ============================================\nconst wantsToRegister = message.match(/daftar|mau ikut|tertarik|mau coba|mau daftar|link pendaftaran|link form|minta link/i) !== null;\n\n// ============================================\n// 5b. DETECT OUT-OF-SCOPE USER (di luar jenjang SMP-SMA)\n// ============================================\nlet outOfScope = false;\nif (message.match(/\\b(mahasiswa|semester\\s*\\d+|lagi kuliah|sudah kuliah|udah kuliah|sarjana|magister|fresh graduate|gap year|karyawan|pegawai|sudah lulus|udah lulus|sudah kerja|udah kerja)\\b/i)) {\n  outOfScope = true;\n}\n\n// ============================================\n// 5c. DETECT UNCLEAR / AMBIGUOUS SHORT REPLY (anti-loop)\n// ============================================\nconst isGreetingLike = message.match(/^(hai|halo|hi|pagi|siang|sore|malam|makasih|thanks|terima kasih|ok|oke|sip|baik|👍|🙏)/i) !== null;\nconst unclearReply = (actualUserMessage.trim().length <= 4) && !grades.length && !isGreetingLike && !wantsToRegister;\n\n// ============================================\n// 6. DETECT PERSUASION TRIGGERS\n// ============================================\nlet persuasionMode = '';\nif (message.match(/mau daftar|tertarik|boleh deh|mau coba|mau ikut|oke deh/i)) {\n  persuasionMode = 'INTERESTED';\n} else if (message.match(/nanti|pikir dulu|setelah ujian|belum sekarang|ragu|mikir|lihat dulu/i)) {\n  persuasionMode = 'DEFER';\n} else if (message.match(/\\b(tf|transfer|bayar|mau bayar|sudah bayar|kirim bukti)\\b/i)) {\n  persuasionMode = 'PAYMENT';\n}\n\n// ============================================\n// 7. DETECT TOPICS\n// ============================================\nconst discussingProgram = message.match(/program|junior|intermediate|senior|batch/i) !== null;\nconst askingPrice = message.match(/berapa|biaya|harga|bayar|mahal|murah/i) !== null;\nconst askingBatch = message.match(/batch|kapan|mulai|jadwal|pendaftaran/i) !== null;\n\n// ============================================\n// 8. BUILD AI CONTEXT\n//    HANYA fakta deteksi + pointer, selaras system message.\n// ============================================\nlet aiContext = '';\n\nif (outOfScope) {\n  aiContext += `User kemungkinan di luar jenjang SMP-SMA (mahasiswa/kuliah/kerja). Sampaikan jujur program khusus siswa SMP-SMA, jadi belum ada yang cocok. JANGAN tanya kelas SMP/SMA. `;\n}\n\nif (unclearReply) {\n  aiContext += `Balasan user terlalu singkat/ambigu. JANGAN ulang pertanyaan yang sama. Kalau sebelumnya sudah bertanya hal yang sama, tawarkan bantuan langsung dari Sam: [TALK_TO_SAM]. `;\n}\n\nif (intlSystemDetected) {\n  aiContext += `User menyebut jenjang sistem Singapura/internasional (Primary/Sec). Ini TIDAK berarti calon murid sudah bersekolah di Singapura, banyak sekolah kurikulum internasional di Indonesia. Jangan asumsikan lokasi sekolah, dan JANGAN tanya lokasi kecuali menentukan jawaban. `;\n}\n\nif (!outOfScope && grades.length) {\n  const src = gradeFromDB ? 'SUDAH DIKETAHUI dari percakapan sebelumnya' : 'disebut di pesan ini';\n  if (grades.length === 1) {\n    const g = grades[0];\n    const p = PROGRAM_OF[g] || '';\n    if (p) {\n      aiContext += `Kelas calon murid ${src}: ${g} -> arahkan ke program ${p}. ${gradeFromDB ? 'JANGAN tanya kelas lagi. ' : ''}Catatan: SMP 2 = Intermediate (BUKAN Junior). Sebut HANYA program ${p}, jangan tawarkan tier program lain kecuali user tanya. `;\n    } else if (g === 'SMA 10/11') {\n      aiContext += `Calon murid di SMA kelas 10/11 -> belum ada program yang cocok untuk sekarang (Seniors khusus kelas 12). Sampaikan jujur dan arahkan ke opsi yang ada.${gradeFromDB ? ' Kelas sudah diketahui, JANGAN tanya kelas lagi.' : ''} `;\n    }\n  } else {\n    // Multi-anak: sebutkan pemetaan per kelas\n    const mapText = grades.map(g => `${g} -> ${PROGRAM_OF[g] || 'belum ada program yang cocok (Seniors khusus kelas 12)'}`).join('; ');\n    aiContext += `User menyebut LEBIH DARI SATU kelas calon murid (kemungkinan beberapa anak), ${src}: ${mapText}. JANGAN tanya ulang kelas. Bahas program sesuai kelas masing-masing, ringkas, tanpa membandingkan tier lain di luar itu. Catatan: SMP 2 = Intermediate (BUKAN Junior). `;\n  }\n} else if (smaUnclear) {\n  aiContext += `Calon murid SMA tapi kelas belum jelas -> tanya dulu kelas berapa (Seniors hanya untuk kelas 12). `;\n}\n\nif (wantsToRegister) {\n  aiContext += `User ingin daftar -> siapkan [SEND_GFORM] HANYA jika diizinkan ATURAN BATCH (batch reguler DIBUKA, atau Mock Interview, atau Seniors). Kalau batch belum dibuka, arahkan user menunggu kabar pendaftaran. `;\n}\n\nif (persuasionMode) {\n  if (persuasionMode === 'INTERESTED') {\n    aiContext += `User tertarik daftar. Ikuti ATURAN BATCH. Nada tenang dan netral, langsung ke langkah daftar tanpa berlebihan. `;\n  } else if (persuasionMode === 'DEFER') {\n    aiContext += `User menunda. Validasi singkat dan santai, beri ruang tanpa menekan waktu. `;\n  } else if (persuasionMode === 'PAYMENT') {\n    aiContext += `User konfirmasi pembayaran. Balas singkat & hangat, contoh nada: \"Baik ditunggu yaa, kalau sudah transfer kirim buktinya ke sini.\" `;\n  }\n}\n\n// ============================================\n// 9. BUILD ENHANCED INPUT FOR AI\n// ============================================\n// FIX C1: preserve the [SYSTEM_DATA] block from Cek_user_status so\n// IS_NEW_USER + intro instruction survive to the AI Agent. Detection\n// facts are added as an extra [CONTEXT: ...] block.\nlet systemDataBlock = '';\nif (fullMessage.includes('[USER QUERY]')) {\n  systemDataBlock = fullMessage.split('[USER QUERY]')[0].trim();\n}\nlet enhancedInput = '';\nif (systemDataBlock) enhancedInput += systemDataBlock + `\\n\\n`;\nif (aiContext.trim()) enhancedInput += `[CONTEXT: ${aiContext.trim()}]\\n\\n`;\nenhancedInput += `[USER QUERY]\\n${actualUserMessage}`;\n\n// ============================================\n// OUTPUT\n// ============================================\nreturn {\n  userPhone,\n  actualUserMessage,\n  fullMessage,\n  messageLower: message,\n  isNewUser,\n  kelasAnakDB,\n  programInterestDB,\n  grade,\n  grades,\n  gradeFromDB,\n  intlSystemDetected,\n  recommendedProgram,\n  wantsToRegister,\n  discussingProgram,\n  askingPrice,\n  askingBatch,\n  persuasionMode,\n  outOfScope,\n  unclearReply,\n  aiContext: aiContext.trim(),\n  ai_input_text: enhancedInput\n};\n", "V4 :: FAQ Retrieve": "// ===== CONTEXT RETRIEVE V3 (KONSOLIDASI) =====\n// Single source of truth = tab PROGRAM (superset: harga, batch, status, syarat).\n// + ABOUT_SAM (bio) + LINKS (url) + FAQ. Token-efisien, anti-halu, tanpa tool agent.\ntry {\n  const pre = $('Preprocess - Context Detection').first().json;\n  const query = pre.actualUserMessage || '';\n  const flags = {\n    askingPrice: !!pre.askingPrice,\n    askingBatch: !!pre.askingBatch,\n    discussingProgram: !!pre.discussingProgram,\n    wantsToRegister: !!pre.wantsToRegister,\n  };\n  const askingSyarat = /syarat|persyaratan|kriteria|ketentuan|dokumen|rapor|raport|portofolio|portfolio|requirement|nilai|esai|essay/i.test(query);\n  const askingAboutSam = /\\bsam\\b|founder|pendiri|pengajar|mentor|tutor|guru|ngajar|siapa kak|siapa ini|admin|alumni|lulus|sekolah.*(mana|sg|singap)|kuliah|background|pengalaman|kerja/i.test(query);\n  const askingProgramDetail = flags.discussingProgram || !!pre.grade || /durasi|berapa kali|seminggu|format|online|sesi|materi|isi program|belajar apa/i.test(query);\n\n  const grab = (node) => { try { return $(node).all().map(i => i.json).filter(Boolean); } catch (e) { return []; } };\n  const val = (row, ...keys) => { for (const k of keys) { for (const rk of Object.keys(row)) { if (rk.toLowerCase().trim() === k.toLowerCase().trim() || rk.toLowerCase().startsWith(k.toLowerCase())) { const v = row[rk]; if (v !== undefined && v !== null && String(v).trim() !== '') return String(v).trim(); } } } return ''; };\n  const clip = (s, n) => { s = (s || '').replace(/\\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; };\n\n  const parts = [];\n  const prog = grab('Read PROGRAM Data');\n\n  // STATUS & BATCH (selalu; gating harga & pendaftaran) -- diturunkan dari PROGRAM\n  if (prog.length) {\n    const lines = prog.map(r => {\n      const nm = val(r, 'Nama Program'), st = val(r, 'Status'), batch = val(r, 'Nama Batch');\n      const mulai = val(r, 'Tanggal Mulai'), dl = val(r, 'Deadline Daftar'), kuota = val(r, 'Kuota');\n      const hasBatch = batch && batch !== '-';\n      return `${nm}: Status=${st || 'tidak tertulis'}${hasBatch ? ', ' + batch : ''}${mulai ? ', Mulai ' + mulai : ''}${dl ? ', Deadline daftar ' + dl : ''}${kuota ? ', Kuota ' + kuota : ''}`;\n    });\n    parts.push('STATUS & BATCH (sumber resmi; program/batch yang tidak ada di sini = tidak ada, jangan dikarang):\\n' + lines.join('\\n'));\n  }\n\n  // Pemetaan program -> kelas (selalu, kecil)\n  parts.push('PEMETAAN PROGRAM: Junior=SD6/SMP1 | Intermediate=SMP2/SMP3 | Seniors=SMA kelas 12 | Mock Interview=semua siswa. SMA 10/11 belum ada program.');\n\n  // HARGA (kondisional) -- dari PROGRAM\n  if ((flags.askingPrice || flags.wantsToRegister || askingProgramDetail) && prog.length) {\n    const lines = prog.map(r => `${val(r, 'Nama Program')}: ${val(r, 'Harga') || 'tidak tertulis'}${val(r, 'Pembayaran') ? ' (' + clip(val(r, 'Pembayaran'), 90) + ')' : ''}${val(r, 'Catatan') ? ' - ' + clip(val(r, 'Catatan'), 70) : ''}`);\n    parts.push('HARGA (sebut hanya sesuai ATURAN HARGA di system; ikut status batch):\\n' + lines.join('\\n'));\n  }\n\n  // SYARAT (kondisional) -- dari PROGRAM\n  if (askingSyarat && prog.length) {\n    const lines = prog.map(r => `${val(r, 'Nama Program')}: Syarat: ${clip(val(r, 'Syarat Umum'), 180)}${val(r, 'Dokumen yang Perlu Disiapkan', 'Dokumen') ? ' | Dokumen: ' + clip(val(r, 'Dokumen yang Perlu Disiapkan', 'Dokumen'), 150) : ''}`);\n    parts.push('SYARAT:\\n' + lines.join('\\n'));\n  }\n\n  // PROGRAM detail (kondisional)\n  if (askingProgramDetail && prog.length) {\n    const lines = prog.map(r => `${val(r, 'Nama Program')}: ${clip(val(r, 'Deskripsi'), 170)} | Target: ${clip(val(r, 'Target Peserta'), 90)} | Durasi: ${clip(val(r, 'Durasi'), 60)} | Format: ${clip(val(r, 'Format'), 60)}`);\n    parts.push('PROGRAM (detail):\\n' + lines.join('\\n'));\n  }\n\n  // TENTANG SAM (kondisional) -- dari ABOUT_SAM\n  if (askingAboutSam) {\n    const about = grab('Read ABOUT Data');\n    if (about.length) parts.push('TENTANG SAM & THE SCHOLARS:\\n' + about.map(r => `${val(r, 'Aspek')}: ${clip(val(r, 'Detail'), 160)}`).join('\\n'));\n  }\n\n  // LINK AKTIF (selalu) -- nama saja; URL disisipkan sistem saat [SEND_GFORM]\n  const links = grab('Read LINKS Data');\n  if (links.length) {\n    const activeRows = links.filter(r => /aktif|active|on|ya/i.test(val(r, 'Status')));\n    const active = activeRows.map(r => {\n      const nm = val(r, 'Nama Link');\n      const ds = clip(val(r, 'Deskripsi'), 80);\n      return nm ? (ds ? `${nm} \\u2014 ${ds}` : nm) : '';\n    }).filter(Boolean);\n    if (active.length) {\n      const sample = val(activeRows[0], 'Nama Link') || 'Nama Link';\n      parts.push('LINK AKTIF (saat [SEND_GFORM] WAJIB sebut Nama Link PERSIS, mis. [SEND_GFORM: ' + sample + ']):\\n- ' + active.join('\\n- '));\n    }\n  }\n\n  const data_context = parts.join('\\n\\n');\n\n  // ---------- FAQ lexical retrieval ----------\n  const faq = grab('Read FAQ').filter(r => r.Pertanyaan && r.Jawaban);\n  const STOP = new Set(['yang','untuk','dan','di','ke','dari','itu','ini','apa','apakah','bisa','kah','ya','yaa','kak','min','dong','sih','kok','aja','ada','gimana','bagaimana','saya','aku','nya','kalau','atau','juga','sudah','belum','mau','dengan','pada','adalah','kira','tolong','mohon','halo','hai','permisi','terima','kasih','sama','buat','soal','tentang','nih','ngga','gak','engga','tidak','dll','dsb','ga','ikut','harus','nanti','dimana','banget','seperti','pakai','punya','lagi','deh','yg','utk','sm','jd','udah','blm']);\n  const GROUPS = [\n    ['biaya','harga','bayar','tarif','pembayaran','cicil','cicilan','nyicil','nyicilnya','dicicil','ngecicil','dp','mahal','murah','fee','uang','dibayar','bayarnya','investasi','gratis'],\n    ['daftar','pendaftaran','registrasi','enroll','gabung','join','mendaftar','ndaftar','apply'],\n    ['jadwal','kapan','mulai','periode','angkatan','dibuka'],\n    ['syarat','persyaratan','kriteria','ketentuan','requirement'],\n    ['beasiswa','scholarship','asean','uob','cli','capitaland','moe','funded'],\n    ['program','kelas','junior','intermediate','senior','seniors','jenjang'],\n    ['interview','wawancara','mock'],\n    ['essay','esai','karangan'],\n    ['alumni','lulus','berhasil','diterima','keterima','sukses'],\n    ['anak','anaku','anakku','putra','putri','murid','siswa'],\n    ['singapura','singapore','sg'],\n    ['tinggal','kehidupan','asrama','akomodasi','hidup'],\n    ['kuota','slot','penuh','kursi','sisa'],\n    ['mengajar','pengajar','guru','mentor','tutor','ngajar'],\n  ];\n  const SYN = {}; for (const g of GROUPS) for (const w of g) SYN[w] = g[0];\n  const stem = (t) => { let w = t; for (const s of ['nya','kah','lah','kan','an','i']) if (w.length - s.length >= 4 && w.endsWith(s)) { w = w.slice(0, -s.length); break; } for (const p of ['meng','meny','mem','men','peng','peny','pem','pen','ber','ter','di','se','ke','me','pe']) if (w.length - p.length >= 4 && w.startsWith(p)) { w = w.slice(p.length); break; } return w; };\n  const tok = (s) => (s || '').toLowerCase().replace(/[^\\p{L}\\p{N}\\s]/gu, ' ').split(/\\s+/).filter(Boolean).filter(t => !STOP.has(t)).map(t => { const a = SYN[t]; if (a) return a; const st = stem(t); return SYN[st] || st; }).filter(t => t.length >= 2 && !STOP.has(t));\n  const docs = faq.map(r => ({ row: r, toks: tok(r.Pertanyaan) }));\n  const Nn = docs.length, df = {};\n  for (const dd of docs) for (const t of new Set(dd.toks)) df[t] = (df[t] || 0) + 1;\n  const idf = (t) => Math.log((Nn + 1) / ((df[t] || 0) + 1)) + 1;\n  const boost = {};\n  if (flags.askingPrice || flags.discussingProgram) boost['Program & Biaya'] = 1.25;\n  if (flags.askingBatch) boost['Batch & Jadwal'] = 1.30;\n  if (flags.wantsToRegister) boost['Seleksi & Proses Daftar'] = 1.20;\n  const qToks = [...new Set(tok(query))];\n  let faq_context = '';\n  if (qToks.length && docs.length) {\n    const scored = docs.map(dd => { const dset = new Set(dd.toks); let s = 0, m = 0; for (const t of qToks) if (dset.has(t)) { s += idf(t); m++; } s *= (boost[dd.row.Kategori] || 1.0); return { row: dd.row, score: s, matched: m }; }).sort((a, b) => b.score - a.score);\n    const top = scored[0];\n    const FLOOR = 2.5, needCov = qToks.length >= 3 ? 2 : 1;\n    if (top.score >= FLOOR && top.matched >= needCov) {\n      const kept = scored.filter(x => x.score >= 0.45 * top.score && x.matched >= 1).slice(0, 4);\n      faq_context = kept.map(x => `Q: ${x.row.Pertanyaan}\\nA: ${x.row.Jawaban}`).join('\\n\\n');\n    }\n  }\n\n  return [{ json: { ...pre, faq_context, data_context }, pairedItem: { item: 0 } }];\n} catch (e) {\n  const pre = ($('Preprocess - Context Detection').first() || { json: {} }).json || {};\n  return [{ json: { ...pre, faq_context: '', data_context: '', faq_error: String(e) }, pairedItem: { item: 0 } }];\n}\n", "V4 :: Process All": "const item = $input.first();\n\n// Ambil AI output dari Anthropic Chat Model\nlet aiOutput = '';\nif (item?.json?.content && Array.isArray(item.json.content) && item.json.content.length > 0) {\n  aiOutput = item.json.content[0].text || '';\n} else {\n  aiOutput = item?.json?.output || item?.json?.text || '';\n}\n\nconsole.log('AI Output preview:', aiOutput.substring(0, 300));\n\n// Ambil data konteks dari node Chat Counter dan Preprocess\nconst chatCounter = $('Chat Counter').first().json;\nconst preprocess = $('Preprocess - Context Detection').first().json;\n\n// Context data\nconst originalMessage = chatCounter.original_message || '';\nconst isNewUser = preprocess?.isNewUser || false;\n\n// ── TAG: [SEND_GFORM: Nama Link] ──────────────────────────────\nlet gformLinkName = '';\nlet isSendGForm = false;\nconst gformMatch = aiOutput.match(/\\[\\s*SEND_GFORM\\s*(?::\\s*([^\\]]*))?\\]/i);\nif (gformMatch) {\n  isSendGForm = true;\n  gformLinkName = (gformMatch[1] || '').trim();\n  console.log('📋 SEND_GFORM tag detected. linkName=', gformLinkName || '(kosong)');\n}\n\nif (!isSendGForm) {\n  const outputLower = aiOutput.toLowerCase();\n  const hasFormsUrl = aiOutput.includes('forms.gle');\n  const forgotTagPatterns = [\n    'link pendaftaran sudah saya kirim',\n    'link pendaftaran mock interview sudah saya kirim',\n    'silakan isi formnya',\n    'form sudah saya kirim',\n    'link pendaftarannya',\n    'link pendaftaran',\n    'ini linknya',\n    'silakan diisi',\n    'link pendaftaran mock',\n    'ini link mock',\n  ];\n  const mentionedSendingForm = forgotTagPatterns.some(pattern =>\n    outputLower.includes(pattern)\n  );\n  if (hasFormsUrl || mentionedSendingForm) {\n    isSendGForm = true;\n    const reason = hasFormsUrl ? 'forms.gle URL detected' : 'phrase pattern matched';\n    console.log(`⚠️ FALLBACK: AI forgot [SEND_GFORM] tag - auto-correcting (${reason})`);\n  }\n}\n\n// ── TAG: [TALK_TO_SAM] ─────────────────────────────────────────\nlet isTalkToSam = aiOutput.includes('[TALK_TO_SAM]');\n\nif (!isTalkToSam) {\n  const outputLower = aiOutput.toLowerCase();\n  const talkToSamPatterns = [\n    'sampaikan ke sam',\n    'saya sampaikan ke sam',\n    'dibalas langsung sama dia',\n    'dibales langsung sama dia',\n    'kalau dia sudah ada waktu',\n  ];\n  if (talkToSamPatterns.some(p => outputLower.includes(p))) {\n    isTalkToSam = true;\n    console.log('⚠️ FALLBACK: AI forgot [TALK_TO_SAM] tag - auto-correcting');\n  }\n}\n\n// ── TAG: [MOCK_INTERVIEW_BOOKING] ─────────────────────────────\nlet isMockBooking = false;\nlet mockBookingData = {};\nconst mockMatch = aiOutput.match(/\\[MOCK_INTERVIEW_BOOKING\\](.*?)\\[\\/MOCK_INTERVIEW_BOOKING\\]/s);\nif (mockMatch && mockMatch[1]) {\n  isMockBooking = true;\n  const c = mockMatch[1];\n  const namaM    = c.match(/Nama:([^|]+)/);\n  const sesiM    = c.match(/Sesi:([^|]+)/);\n  const noWaM    = c.match(/NoWA:([^|\\\\]]+)/);\n  mockBookingData = {\n    nama:  namaM ? namaM[1].trim() : '',\n    sesi:  sesiM ? sesiM[1].trim() : '',\n    noWA:  noWaM ? noWaM[1].trim() : '',\n  };\n}\n\n// ── TAG: [UNKNOWN] ────────────────────────────────────────────\nlet isUnknown = aiOutput.includes('[UNKNOWN]');\n\n// ── TAG: [FACTS kelas=\"...\"] + MERGE kelas_anak (union, anti-overwrite) ──\n// AI (yang paham \"kls 12\"/\"kls vii\") mengekstrak kelas; digabung dgn deteksi\n// regex (cadangan) + nilai lama DB (TTL-aware dari Cek_user_status). Union +\n// dedup -> tidak menimpa anak lain. Program DITURUNKAN dari kelas (bukan AI).\nconst KELAS_WL   = ['SD 1','SD 2','SD 3','SD 4','SD 5','SD 6','SMP 1','SMP 2','SMP 3','SMA 10/11','SMA 12'];\nconst KELAS_PROG = { 'SD 1':'','SD 2':'','SD 3':'','SD 4':'','SD 5':'','SD 6':'Junior','SMP 1':'Junior','SMP 2':'Intermediate','SMP 3':'Intermediate','SMA 12':'Seniors','SMA 10/11':'' };\nconst PROG_ORDER = ['Junior','Intermediate','Seniors'];\nconst toLabel = (s) => {\n  const t = String(s || '').toUpperCase().replace(/\\s+/g, ' ').trim();\n  return KELAS_WL.find(w => w.toUpperCase() === t) || null;\n};\n\nlet aiFactsKelas = [];\nconst factsMatch = aiOutput.match(/\\[\\s*FACTS\\b[^\\]]*\\bkelas\\s*=\\s*\"([^\"]*)\"[^\\]]*\\]/i);\nif (factsMatch && factsMatch[1]) {\n  aiFactsKelas = factsMatch[1].split(',').map(s => s.trim()).filter(Boolean);\n  console.log('🏷️ FACTS kelas dari AI:', aiFactsKelas);\n}\n\nconst regexGrades = Array.isArray(preprocess && preprocess.grades) ? preprocess.grades : [];\nlet existingFreshRaw = '';\ntry { existingFreshRaw = String($('Cek_user_status').first().json.kelas_anak_db || ''); } catch (e) {}\nconst existingFresh = existingFreshRaw.split(',').map(s => s.trim()).filter(Boolean);\n\nconst mergedSet = [];\nfor (const c of [...aiFactsKelas, ...regexGrades, ...existingFresh]) {\n  const lab = toLabel(c);\n  if (lab && !mergedSet.includes(lab)) mergedSet.push(lab);\n}\nconst mergedArr     = KELAS_WL.filter(w => mergedSet.includes(w)); // urut kanonik\nconst mergedKelas   = mergedArr.join(', ');\nconst progSet       = [...new Set(mergedArr.map(g => KELAS_PROG[g]).filter(Boolean))];\nconst mergedProgram = PROG_ORDER.filter(p => progSet.includes(p)).join(', ');\nconst existingCanon = KELAS_WL.filter(w => existingFresh.map(toLabel).includes(w)).join(', ');\nconst kelasChanged  = mergedKelas !== '' && mergedKelas !== existingCanon;\nif (kelasChanged) console.log(`📝 kelas_anak: \"${existingCanon}\" -> \"${mergedKelas}\" | program: \"${mergedProgram}\"`);\n\n\n// ── TAG: [PENDAFTARAN] (backward compat) ──────────────────────\nlet isPendaftaran = false;\nlet pendaftaranData = {};\nconst pendMatch = aiOutput.match(/\\[PENDAFTARAN\\](.*?)\\[\\/PENDAFTARAN\\]/s);\nif (pendMatch && pendMatch[1]) {\n  isPendaftaran = true;\n  const c = pendMatch[1];\n  const namaM    = c.match(/Nama:([^|]+)/);\n  const programM = c.match(/Program:([^|]+)/);\n  const batchM   = c.match(/Batch:([^|]+)/);\n  const asalM    = c.match(/Asal:([^|\\\\]]+)/);\n  pendaftaranData = {\n    nama:    namaM    ? namaM[1].trim()    : '',\n    program: programM ? programM[1].trim() : '',\n    batch:   batchM   ? batchM[1].trim()   : '',\n    asal:    asalM    ? asalM[1].trim()    : '',\n  };\n}\n\n// ── DATA_COMPLETE ──────────────────────────────────────────────\nlet isDataComplete = false;\nlet dataComplete = {};\nconst dcMatch = aiOutput.match(/\\[DATA_COMPLETE\\](.*?)\\[\\/DATA_COMPLETE\\]/s);\nif (dcMatch && dcMatch[1]) {\n  isDataComplete = true;\n  const c = dcMatch[1];\n  const namaM    = c.match(/Nama:([^|]+)/);\n  const noWaM    = c.match(/NoWA:([^|]+)/);\n  const programM = c.match(/Program:([^|\\\\]]+)/);\n  dataComplete = {\n    nama:    namaM    ? namaM[1].trim() : '',\n    noWA:    noWaM    ? noWaM[1].trim() : '',\n    program: programM ? programM[1].trim() : '',\n  };\n}\n\n// ── CLEAN OUTPUT (hapus semua tag sistem) ──────────────────────\nlet cleanOutput = aiOutput\n  .replace(/\\[\\s*SEND_GFORM\\s*(?::[^\\]]*)?\\]/gi, '')\n  .replace(/\\[MOCK_INTERVIEW_BOOKING\\].*?\\[\\/MOCK_INTERVIEW_BOOKING\\]/gs, '')\n  .replace(/\\[PENDAFTARAN\\].*?\\[\\/PENDAFTARAN\\]/gs, '')\n  .replace(/\\[DATA_COMPLETE\\].*?\\[\\/DATA_COMPLETE\\]/gs, '')\n  .replace(/\\[UNKNOWN\\]/g, '')\n  .replace(/\\[\\s*USER[_\\s]?STATUS\\s*:\\s*[^\\]]*\\]/gi, '')\n  .replace(/\\[\\s*FACTS\\b[^\\]]*\\]/gi, '')\n  .replace(/\\[TALK_TO_SAM\\]/g, '');\n\n// ── SIMPAN VERSI SEBELUM FILTER INTERNAL (guard anti-kosong) ──\nconst preInternalStrip = cleanOutput;\n\n// ── HAPUS KALIMAT PROSES INTERNAL ───────────────────────────\n// V4 FIX: daftar keyword DIPERSEMPIT ke frasa yang benar-benar\n// membocorkan proses internal (selalu menyebut sumber data).\n// Frasa percakapan normal (\"saya cek\", \"saya lihat\", \"dari data\")\n// DIHAPUS dari daftar — dulu menyebabkan balasan valid 1 kalimat\n// terhapus habis dan user menerima \"Maaf, terjadi kesalahan\".\nconst internalKeywords = [\n  'berdasarkan faq',\n  'berdasarkan data',\n  'menurut data',\n  'dari faq',\n  'dari sheet',\n  'dari referensi',\n  'data terverifikasi',\n  'faq relevan',\n  'faq yang tersedia',\n  'data yang tersedia',\n  'saya cek data',\n  'saya cek faq',\n  'saya cek sheet',\n  'saya cek di',\n  'cek di sheet',\n  'cek di database',\n  'ambil data dari',\n];\nconst keywordPattern = internalKeywords.join('|');\nconst internalRegex = new RegExp(`^\\\\s*([^.!?]*?(${keywordPattern})[^.!?]*[.!?]\\\\s*)`, 'i');\ncleanOutput = cleanOutput.replace(internalRegex, '');\n\n// Hapus juga kalimat yang diawali dengan kata-kata tersebut (tanpa titik)\nconst startPattern = new RegExp(`^\\\\s*(${keywordPattern}).*?(\\\\n|\\\\.|$)`, 'i');\ncleanOutput = cleanOutput.replace(startPattern, '');\n\n// Jaga-jaga: buang baris pertama jika terindikasi\nconst lines = cleanOutput.split('\\n');\nif (lines.length > 1) {\n  const firstLine = lines[0].toLowerCase();\n  if (internalKeywords.some(kw => firstLine.includes(kw))) {\n    lines.shift();\n    cleanOutput = lines.join('\\n');\n  }\n}\n\n// Kalimat pembuka \"Berdasarkan/Menurut/Dari + data/faq/sheet/referensi ...\"\ncleanOutput = cleanOutput.replace(/^\\s*(Berdasarkan|Menurut|Dari)\\s+(data|faq|sheet|referensi)[^.!?]*[.!?]\\s*/i, '');\n\n// Potong teks sebelum \": \" — hanya jika kalimat DIAWALI frasa proses internal\nconst colonMatch = cleanOutput.match(/^\\s*(Berdasarkan|Menurut|Dari)\\s+(data|faq|sheet|referensi)[^:]*:\\s*(.+)/is);\nif (colonMatch && colonMatch[3] && colonMatch[3].trim().length > 0) {\n  cleanOutput = colonMatch[3].trim();\n}\n\n// ── V4 GUARD ANTI-KOSONG ──────────────────────────────────────\n// Kalau filter internal menghapus SEMUA teks padahal AI punya\n// jawaban, kembalikan versi sebelum filter. Pesan error hanya\n// untuk kasus AI benar-benar tidak menghasilkan output.\nif (!cleanOutput.trim() && preInternalStrip.trim()) {\n  // Coba selamatkan isi setelah titik dua (\"Berdasarkan FAQ ...: <isi>\")\n  const rescue = preInternalStrip.match(/^\\s*[^:.!?\\n]{0,80}(?:data|faq|sheet|referensi)[^:.!?\\n]{0,80}:\\s*(.+)/is);\n  if (rescue && rescue[1] && rescue[1].trim()) {\n    console.warn('🛡️ GUARD: ambil isi setelah frasa internal.');\n    cleanOutput = rescue[1].trim();\n  } else {\n    console.warn('🛡️ GUARD: filter internal mengosongkan output — pakai versi asli.');\n    cleanOutput = preInternalStrip;\n  }\n}\n\ncleanOutput = cleanOutput.trim();\n\n// ── CLEAN MARKDOWN ──────────────────────────────────────────\nconst urlRegex = /https?:\\/\\/[^\\s)]+/g;\nconst maskedUrls = [];\ncleanOutput = cleanOutput.replace(urlRegex, (match) => {\n  maskedUrls.push(match);\n  return `\\x00URL${maskedUrls.length - 1}\\x00`;\n});\n\ncleanOutput = cleanOutput\n  .replace(/\\*\\*([^*]+)\\*\\*/g, '$1')\n  .replace(/\\*([^*]+)\\*/g, '$1')\n  .replace(/_([^_]+)_/g, '$1')\n  .replace(/~~([^~]+)~~/g, '$1')\n  .replace(/`([^`]+)`/g, '$1')\n  .replace(/[\\*_~`]/g, '');\n\ncleanOutput = cleanOutput\n  .replace(/(\\d)\\s*[—–]\\s*(\\d)/g, '$1-$2')\n  .replace(/\\s*[—–]\\s*/g, ', ')\n  .replace(/\\s*;\\s*/g, ', ')\n  .replace(/\\s{2,}/g, ' ')\n  .replace(/\\s+([,.])/g, '$1')\n  .replace(/,\\s*,/g, ',')\n  .trim();\n\ncleanOutput = cleanOutput.replace(\n  /\\x00URL(\\d+)\\x00/g,\n  (_, idx) => maskedUrls[parseInt(idx)]\n);\n\n// Safety net register netral: buang vokatif yang lolos dari prompt\ncleanOutput = cleanOutput\n  .replace(/(^|\\n)\\s*(Om\\s*\\/?\\s*Tante|Bapak\\s*\\/?\\s*Ibu|Pak\\s*\\/?\\s*Bu|Ayah\\s*\\/?\\s*Bunda)\\s*,\\s*/gi, '$1')\n  .replace(/\\s*\\b(Om\\s*\\/?\\s*Tante|Bapak\\s*\\/?\\s*Ibu|Pak\\s*\\/?\\s*Bu|Ayah\\s*\\/?\\s*Bunda)\\b\\s*/gi, ' ')\n  .replace(/\\s{2,}/g, ' ')\n  .replace(/\\s+,/g, ',')\n  .replace(/,\\s*,/g, ',')\n  .replace(/(^|\\n)\\s*,\\s*/g, '$1')\n  .trim();\n\ncleanOutput = cleanOutput.replace(/(^|\\n)([a-z])/g, (m, p1, p2) => p1 + p2.toUpperCase());\n\n// ── FALLBACK: jika cleanOutput tetap kosong (AI tidak menghasilkan output) ──\nif (!cleanOutput || cleanOutput.trim() === '') {\n  console.warn('⚠️ cleanOutput kosong! Menggunakan fallback.');\n  if (isUnknown) {\n    cleanOutput = 'Maaf yaa, untuk pertanyaan ini saya belum punya jawabannya. Nanti saya cari tahu dan kabari lewat sini ya!';\n  } else {\n    cleanOutput = 'Maaf, terjadi kesalahan. Coba tanyakan ulang yaa.';\n  }\n}\n\n// ── RESOLVE & INJECT GFORM LINK (inline, data-driven) ───────────\nif (isSendGForm) {\n  let linkRows = [];\n  try {\n    linkRows = $('Read LINKS Data').all().map(i => i.json);\n  } catch (e) {\n    console.warn('⚠️ Tidak bisa baca node Read LINKS Data:', e.message);\n  }\n\n  const normL = s => String(s || '').toLowerCase().replace(/\\s+/g, ' ').trim();\n  const activeRows = linkRows.filter(r => /aktif|active|on|ya/i.test(String(r['Status'] || '')));\n\n  let match = null;\n  const rq = normL(gformLinkName);\n  if (rq) {\n    match = activeRows.find(r => normL(r['Nama Link']) === rq)\n         || activeRows.find(r => { const n = normL(r['Nama Link']); return n && (n.includes(rq) || rq.includes(n)); });\n  }\n  // AI tidak menyebut nama link -> default ke pendaftaran batch reguler\n  if (!match && !rq) {\n    match = activeRows.find(r => /pendaftaran batch/i.test(String(r['Nama Link'] || '')))\n         || activeRows.find(r => /gform|pendaftaran/i.test(String(r['Nama Link'] || '')));\n  }\n\n  if (match && match['URL']) {\n    gformLinkName = match['Nama Link'];\n    const url = String(match['URL']).trim();\n\n    const linkMeta = `${match['Nama Link'] || ''} ${match['Deskripsi'] || ''}`.toLowerCase();\n    const isWaChannel =\n      /whatsapp\\.com\\/channel\\//i.test(url) ||\n      /chat\\.whatsapp\\.com\\//i.test(url) ||\n      /channel|komunitas|wa\\s*channel/i.test(linkMeta);\n\n    if (!cleanOutput.includes(url)) {\n      cleanOutput = isWaChannel\n        ? `${cleanOutput}\\n\\n👉 ${url}`\n        : `${cleanOutput}\\n\\n👉 ${url}\\n\\nKalau ada yang masih kurang jelas, bisa ngobrol langsung sama Sam yaa. tinggal ketik \"mau ngomong sama Sam\".`;\n    }\n    console.log('✅ Link injected inline:', match['Nama Link'], url, isWaChannel ? '(WA channel - tanpa imbuhan)' : '');\n  } else {\n    console.warn('⚠️ SEND_GFORM aktif tapi link tidak ditemukan di LINKS. linkName=', gformLinkName || '(kosong)');\n  }\n}\n\n// ── LOGGING ───────────────────────────────────────────────────\nif (isSendGForm)   console.log('📋 SEND_GFORM tag detected');\nif (isMockBooking) console.log('📅 MOCK_INTERVIEW_BOOKING detected:', JSON.stringify(mockBookingData));\nif (isUnknown)     console.log('❓ UNKNOWN tag detected');\n\n// ── RETURN ──────────────────────────────────────────────────\nreturn [{\n  json: {\n    ...chatCounter,\n    ...preprocess,\n    ...item.json, // overwrite dengan data terbaru jika ada konflik\n    cleanOutput,\n    isSendGForm,\n    gformLinkName,\n    isMockBooking,\n    mockBookingData,\n    isUnknown,\n    isPendaftaran,\n    pendaftaranData,\n    isDataComplete,\n    dataComplete,\n    isTalkToSam,\n    nama:    pendaftaranData.nama    || dataComplete.nama    || mockBookingData.nama || '',\n    program: pendaftaranData.program || dataComplete.program || 'Mock Interview',\n    needs_unknown: isUnknown ? 'true' : 'false',\n    can_record_to_sheet: isMockBooking || isPendaftaran || isDataComplete,\n    original_message: originalMessage,\n    is_new_user: isNewUser,\n    kelas_anak_merged: mergedKelas,\n    program_interest_merged: mergedProgram,\n    kelas_changed: kelasChanged,\n  }\n}];\n", "V4 :: Pick GForm Link": "// Pilih link GForm dari sheet LINKS sesuai nama yang diminta AI (data-driven)\nconst rows = $('Query LINKS for GForm').all().map(i => i.json);\nconst proc = $('Process All').first().json;\nconst phone = $('Chat Counter').first().json.user_wa || proc.user_wa || '';\nconst requested = String(proc.gformLinkName || '').trim();\n\nconst norm = s => String(s || '').toLowerCase().replace(/\\s+/g, ' ').trim();\nconst activeRows = rows.filter(r => /aktif|active|on|ya/i.test(String(r['Status'] || '')));\n\nlet match = null;\nif (requested) {\n  const rq = norm(requested);\n  match = activeRows.find(r => norm(r['Nama Link']) === rq)\n       || activeRows.find(r => { const n = norm(r['Nama Link']); return n && (n.includes(rq) || rq.includes(n)); });\n}\n\nif (match && match['URL']) {\n  const desc = String(match['Deskripsi'] || '').trim();\n  const intro = desc\n    ? `Berikut ${desc.charAt(0).toLowerCase() + desc.slice(1)}`\n    : `Berikut link ${match['Nama Link']}`;\n  const message = `Haii! 😊 ${intro} ya:\\n\\n👉 ${match['URL']}\\n\\nSilakan diisi yaa, nanti tim kami follow up setelah form terisi. Ada yang mau ditanyain dulu sebelum isi? Santai aja tanya ke sini! 🙌`;\n  console.log('✅ GForm link resolved:', match['Nama Link']);\n  return [{ json: { ...proc, gformResolved: true, gformUrl: match['URL'], gformLinkName: match['Nama Link'], gformDesc: desc, phone, message } }];\n}\n\n// ── FALLBACK: nama kosong / tidak cocok -> tanya ulang link mana ──\nconst formRows = activeRows.filter(r => /gform|pendaftaran|mock/i.test(String(r['Nama Link'] || '')));\nconst listRows = formRows.length ? formRows : activeRows;\nconst opts = listRows.map(r => {\n  const dsc = String(r['Deskripsi'] || '').trim();\n  return dsc ? `• ${r['Nama Link']} (${dsc})` : `• ${r['Nama Link']}`;\n}).join('\\n');\nconst reason = requested ? `nama link \"${requested}\" tidak ketemu di LINKS` : 'AI tidak menyertakan nama link';\nconsole.warn('⚠️ Pick GForm Link fallback (tanya ulang):', reason);\nconst message = opts\n  ? `Boleh dibantu kirim link-nya 😊 Yang dimaksud yang mana ya:\\n${opts}\\n\\nTinggal sebut salah satu, nanti langsung saya kirimkan.`\n  : 'Boleh dibantu, link mana yang mau dikirim ya? Sebutkan program/keperluannya, nanti saya kirimkan.';\nreturn [{ json: { ...proc, gformResolved: false, gformUrl: '', gformLinkName: requested, phone, message } }];\n", "V4 :: Rate Limiter LID": "\n// Rate Limiter: cegah spam (maks 5 pesan per menit per user)\nconst input = $input.first().json;\nconst userWa = $('Resolve User Row').first().json.resolved_key;\nconst now = Date.now();\n\n// Global store menggunakan $workflow static data\nconst staticData = $getWorkflowStaticData('global');\nconst rateLimits = staticData.rateLimits || {};\n\nconst userKey = `rl_${userWa}`;\nconst windowMs = 60000; // 1 menit\nconst maxMessages = 5;\n\nif (!rateLimits[userKey]) {\n  rateLimits[userKey] = { count: 1, windowStart: now };\n} else {\n  const elapsed = now - rateLimits[userKey].windowStart;\n  if (elapsed > windowMs) {\n    // Reset window baru\n    rateLimits[userKey] = { count: 1, windowStart: now };\n  } else {\n    rateLimits[userKey].count++;\n  }\n}\n\nstaticData.rateLimits = rateLimits;\n\nconst isRateLimited = rateLimits[userKey].count > maxMessages;\n\nif (isRateLimited) {\n  console.log(`⛔ RATE LIMITED: ${userWa} sudah ${rateLimits[userKey].count} pesan dalam 1 menit`);\n  return [];\n}\n\nconsole.log(`✅ RATE OK: ${userWa} pesan ke-${rateLimits[userKey].count}`);\nreturn [$input.first()];", "V4 :: Resolve User Row": "// ====================================================================\n// NODE: Resolve User Row (BARU di V4)\n// Identitas user: No WA (phone) = kunci PRIMER, lid = backup.\n// Menghilangkan bug fallback rows[0] / match dengan kunci kosong\n// yang menyebabkan data user tertukar antar row (kasus Vivipoh/DSS).\n// ====================================================================\nconst cc = $('Chat Counter').first().json;\nconst digits = v => String(v ?? '').replace(/\\D/g, '');\nconst phone = digits(cc.user_phone);\nconst lid = digits(cc.user_lid);\n\nif (!phone && !lid) {\n  // throw agar tertangkap Error Workflow (VIRA Error Notifier) -> admin dapat notif,\n  // bukan silent drop.\n  throw new Error('Identitas user kosong (phone & lid tidak ada) - payload webhook tidak dikenal: ' + JSON.stringify(cc.body?.from ?? null));\n}\n\nlet rows = [];\ntry {\n  rows = $('Read User STATS').all()\n    .map(i => i.json)\n    .filter(r => r && Object.keys(r).length > 0);\n} catch (e) {\n  console.warn('⚠️ Read User STATS tidak terbaca:', e.message);\n}\n\n// Primer: No WA == phone. Backup: kolom lid == lid.\n// Terakhir: No WA == lid (row lama yang tersimpan pakai identitas lid).\nlet row = null;\nif (phone) {\n  row = rows.find(r => digits(r['No WA']) === phone) || null;\n}\nif (!row && lid) {\n  row = rows.find(r => digits(r['lid']) === lid)\n     || rows.find(r => digits(r['No WA']) === lid)\n     || null;\n}\n// PENTING: tidak ada fallback rows[0]. Tidak ketemu = user baru.\n\nconst resolvedKey = row ? String(row['No WA']).trim() : (phone || lid);\nconst greetingSent = row ? String(row['greeting_sent'] || '').trim().toUpperCase() : '';\n\nconsole.log(`🔑 resolved_key=${resolvedKey} | row_found=${!!row} | greeting=${greetingSent}`);\n\nreturn [{\n  json: {\n    ...cc,\n    resolved_key: resolvedKey,\n    row_found: !!row,\n    bot_mode: row ? String(row['bot_mode'] || '').trim().toUpperCase() : '',\n    greeting_sent: greetingSent,\n    is_new_user: !row || greetingSent !== 'Y',\n    buffer_done_ts: Number(row ? (row['buffer_done_ts'] || 0) : 0) || 0,\n    kelas_anak: row ? String(row['kelas_anak'] || '').trim() : '',\n    kelas_anak_ts: Number(row ? (row['kelas_anak_ts'] || 0) : 0) || 0,\n    program_interest: row ? String(row['program_interest'] || '').trim() : '',\n    counter_db: Number(row ? (row['Counter'] || 0) : 0) || 0\n  }\n}];\n", "PCRv13 :: Bootstrap Config": "// ============================================================\n// BOOTSTRAP CONFIG\n// Ganti SHEET_ID ke Sheet ID spreadsheet \"Persada_Cisoka_Database\".\n// ============================================================\nconst SHEET_ID = '1dJWq7iq5PRGRguW6GRAgtclgvhSqppa-D6tSNrAo1PU';   // <-- EDIT INI\nconst wh = $input.first() ? $input.first().json : {};\nreturn [{ json: { ...wh, sheet_id: SHEET_ID } }];\n", "PCRv13 :: Parse Config": "// ============================================================\n// PARSE CONFIG (ENGINE) — baca tab CONFIG (key|value) jadi objek config.\n// Nilai list/JSON ditulis sbg JSON string di sel value.\n// Perubahan 2026-07-17: default bot_name 'VIRA' -> 'Vira'.\n// ============================================================\nconst rows = $('Read CONFIG').all().map(i => i.json);\nconst sheetId = $('Bootstrap Config').first().json.sheet_id || '';\nconst raw = {};\nfor (const r of rows) {\n  const k = String(r.key ?? r.Key ?? r.KEY ?? '').trim();\n  if (!k) continue;\n  raw[k] = (r.value ?? r.Value ?? r.VALUE ?? '');\n}\nconst str = (k, def='') => { const v = raw[k]; return (v===undefined||v===null||String(v).trim()==='') ? def : String(v).trim(); };\nconst num = (k, def) => { const s = str(k,''); if (s==='') return def; const n = Number(s); return Number.isFinite(n)?n:def; };\nconst bool = (k, def=false) => { const v = str(k,'').toLowerCase(); if (v==='') return def; return ['true','yes','y','on','1','aktif','ya'].includes(v); };\nconst jsonArr = (k) => { try { const v = str(k,''); if (!v) return []; const p = JSON.parse(v); return Array.isArray(p) ? p : []; } catch(e){ return []; } };\n\nconst config = {\n  sheet_id: sheetId,\n  client_name: str('client_name', 'Persada Cisoka Residence'),\n  bot_name: str('bot_name', 'Vira'),\n  bot_language: str('bot_language', 'id'),\n  system_prompt: str('system_prompt', ''),\n  admin_phone: str('admin_phone', ''),\n  admin_phone_display: str('admin_phone_display', ''),\n  field_team_phone: (() => {\n    const a = jsonArr('field_team_phone');\n    if (a.length) return a.map(x => String(x).replace(/\\D/g,'')).filter(Boolean);\n    const s = str('field_team_phone','');\n    return s ? [s.replace(/\\D/g,'')].filter(Boolean) : [];\n  })(),\n  media_team_phone: (() => {\n    const a = jsonArr('media_team_phone');\n    if (a.length) return a.map(x => String(x).replace(/\\D/g,'')).filter(Boolean);\n    const s = str('media_team_phone','');\n    return s ? [s.replace(/\\D/g,'')].filter(Boolean) : [];\n  })(),\n  brochure_url: str('brochure_url', ''),\n  media_catalog: jsonArr('media_catalog'),\n  survey_slots: jsonArr('survey_slots'),\n  survey_open_hour: num('survey_open_hour', 8),\n  survey_close_hour: num('survey_close_hour', 17),\n  followup_max: num('followup_max', 3),\n  followup_interval_hours: num('followup_interval_hours', 24),\n  followup_open_hour: num('followup_open_hour', 9),\n  followup_close_hour: num('followup_close_hour', 18),\n  followup_templates: jsonArr('followup_templates'),\n  lead_source_map: jsonArr('lead_source_map'),\n  whitelist_enabled: bool('whitelist_enabled', false),\n  whitelist_numbers: jsonArr('whitelist_numbers').map(x => String(x).replace(/\\D/g,'')),\n  rate_limit_max: num('rate_limit_max', 5),\n  rate_limit_window_sec: num('rate_limit_window_sec', 60),\n  debounce_seconds: num('debounce_seconds', 60),\n  // Kredensial Kirimi utk endpoint multipart send-message-file (upload binary).\n  // Custom-auth n8n TIDAK reliabel meng-inject body ke multipart/form-data,\n  // jadi user_code/secret/device_id di-supply sbg field form via CONFIG sheet.\n  // Node teks (JSON body) tetap pakai credential httpCustomAuth.\n  kirimi_user_code: str('kirimi_user_code', ''),\n  kirimi_secret: str('kirimi_secret', ''),\n  kirimi_device_id: str('kirimi_device_id', ''),\n};\nconst passthrough = $('Bootstrap Config').first() ? $('Bootstrap Config').first().json : {};\nreturn [{ json: { ...passthrough, config } }];", "PCRv13 :: Whitelist Gate": "// ============================================================\n// WHITELIST GATE  (ENGINE) — config-driven, anti-bug LID\n// whitelist_enabled=false -> semua user lewat (mode produksi publik).\n// whitelist_enabled=true  -> hanya nomor di whitelist_numbers (uji).\n// Pencocokan tahan format: bandingkan digit dari `from` DAN `originLid`.\n// ============================================================\nconst cfg = $('Parse Config').first().json.config || {};\nconst body = ($input.first().json.body) || ($('Parse Config').first().json.body) || {};\n\nif (!cfg.whitelist_enabled) {\n  return [$input.first()];\n}\n\nconst list = (cfg.whitelist_numbers || []).map(x => String(x).replace(/\\D/g, '')).filter(Boolean);\nconst fromDigits = String(body.from || '').replace(/\\D/g, '');\nconst lidDigits  = String(body.originLid || '').replace(/\\D/g, '');\n\nconst allowed = list.some(w => w && (w === fromDigits || w === lidDigits ||\n  (fromDigits && fromDigits.endsWith(w)) || (w.endsWith(fromDigits) && fromDigits.length >= 6)));\n\nif (!allowed) {\n  console.log(`⛔ WHITELIST: ${fromDigits || lidDigits || 'unknown'} tidak di whitelist — stop.`);\n  return [];\n}\nconsole.log(`✅ WHITELIST OK: ${fromDigits || lidDigits}`);\nreturn [$input.first()];\n", "PCRv13 :: Chat Counter": "const webhookData = $input.first();\nconst body = webhookData.json.body || {};\n\n// Ambil data dari Kirimi\nconst userMessage = body.message || \"\";\nconst messageType = body.messageType || \"\";\nconst userNumber = body.from || \"unknown\";  // ← TIDAK strip @lid, passthrough as-is\nconst _isLid    = String(userNumber).toLowerCase().includes('@lid');\nconst userLid   = String(body.originLid || (_isLid ? userNumber : '')).replace(/\\D/g, '');// kunci cocok\nconst userPhone = _isLid ? '' : String(userNumber).replace(/\\D/g, '');// utk kolom No WA\nconst userName = body.name || body.pushName || body.notifyName || \"User\";\nconst isFromMe = body.isFromMe === true;\nconst eventType = body.event || \"\";\n\n// Filter: hanya pesan teks yang tidak kosong\nif (messageType !== \"text\" || !userMessage || userMessage.trim() === \"\") {\n    console.log('⛔ STOP: Bukan pesan teks valid');\n    return [];\n}\n\nconsole.log('✅ LANJUT: Pesan teks valid dari user');\nconsole.log('📱 No WA:', userNumber);\n\n// Counter sederhana\nlet counter = $vars.chatCounter || 0;\ncounter++;\n$vars.chatCounter = counter;\n\n// Format tanggal & jam WIB\nconst now = new Date();\nconst formattedDate = now.toLocaleDateString('en-GB', {\n    timeZone: 'Asia/Jakarta',\n    day: '2-digit',\n    month: '2-digit',\n    year: 'numeric'\n});\nconst formattedTime = now.toLocaleTimeString('id-ID', {\n    hour: '2-digit',\n    minute: '2-digit',\n    second: '2-digit',\n    hour12: false,\n    timeZone: 'Asia/Jakarta'\n}).replace(/\\./g, ':');\n\nconst processStartTs = Date.now();\n\nconst aiInputText = `[SYSTEM_DATA]\nCHAT_COUNTER: ${counter}\nUSER_NAME: ${userName}\nUSER_MESSAGE: \"${userMessage}\"\n\n[USER QUERY]\n${userMessage}`;\n\nreturn [{\n    json: {\n        chat_counter: counter,\n        user_wa: userNumber,\n        user_lid: userLid,\n        user_phone: userPhone,\n        user_name: userName,\n        formatted_date: formattedDate,\n        formatted_time: formattedTime,\n        ai_input_text: aiInputText,\n        original_message: userMessage,\n        body: body,\n        message_type: messageType,\n        process_start_ts: processStartTs\n    }\n}];", "PCRv13 :: Resolve User Row": "// ====================================================================\n// RESOLVE USER ROW (fondasi identitas)\n// No WA = kunci PRIMER, lid = backup. TIDAK PERNAH fallback rows[0].\n// ====================================================================\nconst cc = $('Chat Counter').first().json;\nconst digits = v => String(v ?? '').replace(/\\D/g, '');\nconst phone = digits(cc.user_phone);\nconst lid = digits(cc.user_lid);\n\nif (!phone && !lid) {\n  throw new Error('Identitas user kosong (phone & lid tidak ada) - payload webhook tidak dikenal: ' + JSON.stringify(cc.body?.from ?? null));\n}\n\nlet rows = [];\ntry {\n  rows = $('Read User STATS').all().map(i => i.json).filter(r => r && Object.keys(r).length > 0);\n} catch (e) { console.warn('Read User STATS tidak terbaca:', e.message); }\n\nlet row = null;\nif (phone) row = rows.find(r => digits(r['No WA']) === phone) || null;\nif (!row && lid) {\n  row = rows.find(r => digits(r['lid']) === lid) || rows.find(r => digits(r['No WA']) === lid) || null;\n}\n\nconst resolvedKey = row ? String(row['No WA']).trim() : (phone || lid);\nconst greetingSent = row ? String(row['greeting_sent'] || '').trim().toUpperCase() : '';\nconsole.log('resolved_key=' + resolvedKey + ' | row_found=' + (!!row));\n\nreturn [{\n  json: {\n    ...cc,\n    resolved_key: resolvedKey,\n    row_found: !!row,\n    bot_mode: row ? String(row['bot_mode'] || '').trim().toUpperCase() : '',\n    greeting_sent: greetingSent,\n    is_new_user: !row || greetingSent !== 'Y',\n    buffer_done_ts: Number(row ? (row['buffer_done_ts'] || 0) : 0) || 0,\n    unit_interest: row ? String(row['unit_interest'] || '').trim() : '',\n    unit_interest_ts: Number(row ? (row['unit_interest_ts'] || 0) : 0) || 0,\n    budget_range: row ? String(row['budget_range'] || '').trim() : '',\n    budget_range_ts: Number(row ? (row['budget_range_ts'] || 0) : 0) || 0,\n    nama_lengkap: row ? String(row['nama_lengkap'] || '').trim() : '',\n    nama_lengkap_ts: Number(row ? (row['nama_lengkap_ts'] || 0) : 0) || 0,\n    lokasi_kerja: row ? String(row['lokasi_kerja'] || '').trim() : '',\nlokasi_kerja_ts: Number(row ? (row['lokasi_kerja_ts'] || 0) : 0) || 0,\n    pending_survey_tanggal: row ? String(row['pending_survey_tanggal'] || '').trim() : '',\n    pending_survey_jam: row ? String(row['pending_survey_jam'] || '').trim() : '',\n    pending_survey_unit: row ? String(row['pending_survey_unit'] || '').trim() : '',\n    pending_survey_ts: Number(row ? (row['pending_survey_ts'] || 0) : 0) || 0,\n    lead_source_db: row ? String(row['lead_source'] || '').trim() : '',\n    counter_db: Number(row ? (row['Counter'] || 0) : 0) || 0\n  }\n}];", "PCRv13 :: Rate Limiter LID": "\n// Rate Limiter: cegah spam (maks 5 pesan per menit per user)\nconst input = $input.first().json;\nconst userWa = $('Resolve User Row').first().json.resolved_key;\nconst now = Date.now();\n\n// Global store menggunakan $workflow static data\nconst staticData = $getWorkflowStaticData('global');\nconst rateLimits = staticData.rateLimits || {};\n\nconst userKey = `rl_${userWa}`;\nconst windowMs = 60000; // 1 menit\nconst maxMessages = 5;\n\nif (!rateLimits[userKey]) {\n  rateLimits[userKey] = { count: 1, windowStart: now };\n} else {\n  const elapsed = now - rateLimits[userKey].windowStart;\n  if (elapsed > windowMs) {\n    // Reset window baru\n    rateLimits[userKey] = { count: 1, windowStart: now };\n  } else {\n    rateLimits[userKey].count++;\n  }\n}\n\nstaticData.rateLimits = rateLimits;\n\nconst isRateLimited = rateLimits[userKey].count > maxMessages;\n\nif (isRateLimited) {\n  console.log(`⛔ RATE LIMITED: ${userWa} sudah ${rateLimits[userKey].count} pesan dalam 1 menit`);\n  return [];\n}\n\nconsole.log(`✅ RATE OK: ${userWa} pesan ke-${rateLimits[userKey].count}`);\nreturn [$input.first()];", "PCRv13 :: HITL Check": "// ============================================================\n// HUMAN-IN-THE-LOOP CHECK (V4: No WA primer, lid backup)\n// bot_mode = 'OFF' -> Admin handle manual -> stop.\n// ============================================================\nconst cc = $('Chat Counter').first().json;\nconst digits = v => String(v ?? '').replace(/\\D/g, '');\nconst phone = digits(cc.user_phone);\nconst lid = digits(cc.user_lid);\n\nconst statsRows = $('Read STATS for HITL').all()\n  .map(r => r.json)\n  .filter(r => r && Object.keys(r).length > 0);\n\nlet userRow = null;\nif (phone) userRow = statsRows.find(r => digits(r['No WA']) === phone) || null;\nif (!userRow && lid) {\n  userRow = statsRows.find(r => digits(r['lid']) === lid)\n         || statsRows.find(r => digits(r['No WA']) === lid)\n         || null;\n}\n\nconst botMode = userRow ? String(userRow['bot_mode'] || '').trim().toUpperCase() : '';\n\nif (botMode === 'OFF') {\n  console.log(`👨‍💼 HITL AKTIF — Admin sedang handle manual, bot berhenti.`);\n  return [];\n}\n\nconsole.log(`🤖 Bot mode AKTIF (bot_mode=\"${botMode}\") — lanjut.`);\nreturn [$input.first()];\n", "PCRv13 :: Cek_user_status": "// ====================================================================\n// CEK_USER_STATUS — gate HITL post-debounce + gabung MSG_BUFFER +\n// siapkan SYSTEM_DATA (intro user baru, unit/budget tersimpan).\n// Perubahan 2026-07-17: (1) INTRO \"Saya VIRA\" -> \"Saya Vira\",\n// (2) inject TANGGAL_SEKARANG (WIB) ke [SYSTEM_DATA] — system prompt\n//     # SURVEY versi baru merujuk field ini utk hitung tanggal survey,\n//     mencegah halusinasi tanggal (\"senin depan\" tanpa tahu hari ini).\n// ====================================================================\nconst cc = $('Chat Counter').first().json;\nconst resolve = $('Resolve User Row').first().json;\nconst resolvedKey = resolve.resolved_key;\n\nconst debounceItem = $('Re-Read STATS Debounce').first();\nconst debounceRow = (debounceItem && debounceItem.json) ? debounceItem.json : {};\nconst botModeNow = String(debounceRow['bot_mode'] || '').trim().toUpperCase();\nif (botModeNow === 'OFF') {\n  console.log('HITL (post-debounce): bot_mode OFF — berhenti, admin handle manual.');\n  return [];\n}\n\nconst doneTs = Number(debounceRow['buffer_done_ts'] || 0) || 0;\nconst myTs = Number(cc.process_start_ts) || 0;\nlet bufRows = [];\ntry {\n  bufRows = $('Read MSG_BUFFER').all().map(i => i.json).filter(r => r && r.message !== undefined && r.message !== null);\n} catch (e) { console.warn('Read MSG_BUFFER tidak terbaca:', e.message); }\n\nconst MAX_AGE_MS = 30 * 60 * 1000;\nconst msgs = bufRows\n  .map(r => ({ ts: Number(r.ts) || 0, message: String(r.message ?? '').trim() }))\n  .filter(r => r.ts > doneTs && r.ts <= myTs && (myTs - r.ts) < MAX_AGE_MS && r.message !== '')\n  .sort((a, b) => a.ts - b.ts)\n  .map(r => r.message);\n\nconst userMessage = msgs.length ? msgs.join('\\n') : (cc.original_message || '');\n\nconst greetingSent = String(debounceRow['greeting_sent'] || resolve.greeting_sent || '').trim().toUpperCase();\nconst isNewUser = greetingSent !== 'Y';\n\nconst TTL_S = 60 * 86400;\nconst nowS = Math.floor(Date.now() / 1000);\nconst uiTs = Number(debounceRow['unit_interest_ts'] || resolve.unit_interest_ts || 0) || 0;\nconst uiFresh = uiTs > 0 && (nowS - uiTs) <= TTL_S;\nconst unitInterest = uiFresh ? String(debounceRow['unit_interest'] || resolve.unit_interest || '').trim() : '';\nconst brTs = Number(debounceRow['budget_range_ts'] || resolve.budget_range_ts || 0) || 0;\nconst brFresh = brTs > 0 && (nowS - brTs) <= TTL_S;\nconst budgetRange = brFresh ? String(debounceRow['budget_range'] || resolve.budget_range || '').trim() : '';\n\n// PROFIL USER (nama lengkap + lokasi_kerja)\nconst namaLengkap = String(debounceRow['nama_lengkap'] || resolve.nama_lengkap || '').trim();\nconst lokasi_kerja     = String(debounceRow['lokasi_kerja']     || resolve.lokasi_kerja     || '').trim();\nconst needName     = !namaLengkap;\nconst needDomicile = !lokasi_kerja;\n// diminta HANYA di pesan intro (user baru); greeting_sent otomatis jadi penanda \"sudah pernah diminta\"\nconst askProfileNow = isNewUser && (needName || needDomicile);\nconst askProfileTarget = !askProfileNow ? 'NO'\n  : (needName && needDomicile) ? 'nama+lokasi_kerja'\n  : (needName ? 'nama' : 'lokasi_kerja');\nconst needUnit = !unitInterest || unitInterest === 'UNKNOWN';\nconst askUnitNow = isNewUser && needUnit;\nconst askUnitTarget = askUnitNow ? 'tipe unit (subsidi/komersial)' : 'NO';\n\n// PENDING SURVEY (register #1) — slot survey lintas giliran dari STATS, TTL 48 jam.\n// Slot lebih tua dari TTL dianggap hangus (jangan tawarkan \"Senin\" yang sudah lewat 3 minggu).\nconst PENDING_TTL_S = 48 * 3600;\nconst psTs = Number(debounceRow['pending_survey_ts'] || resolve.pending_survey_ts || 0) || 0;\nconst psFresh = psTs > 0 && (nowS - psTs) <= PENDING_TTL_S;\nconst psTgl = psFresh ? String(debounceRow['pending_survey_tanggal'] || resolve.pending_survey_tanggal || '').trim() : '';\nconst psJam = psFresh ? String(debounceRow['pending_survey_jam'] || resolve.pending_survey_jam || '').trim() : '';\nconst psUnit = psFresh ? String(debounceRow['pending_survey_unit'] || resolve.pending_survey_unit || '').trim() : '';\nconst hasPendingSurvey = !!(psTgl || psJam || psUnit);\n\n// Tanggal & jam sekarang dlm WIB — sumber kebenaran tanggal utk AI.\n// Format sama dgn yang divalidasi Process All (validateSurveySlot).\nconst nowWIB = ne
