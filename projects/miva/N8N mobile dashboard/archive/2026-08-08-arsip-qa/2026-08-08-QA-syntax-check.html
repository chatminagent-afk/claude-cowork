 Admin sedang handle manual, bot berhenti.`);\n  return [];\n}\n\nconsole.log(`🤖 Bot mode AKTIF (bot_mode=\"${botMode}\") — lanjut.`);\nreturn [$input.first()];\n", "PCRv21 :: Cek_user_status": "// NODE: Cek_user_status\n// ====================================================================\n// CEK_USER_STATUS - gate HITL post-debounce + gabung MSG_BUFFER +\n// siapkan SYSTEM_DATA (intro user baru, unit/budget tersimpan).\n// Perubahan 2026-07-17: (1) INTRO \"Saya VIRA\" -> \"Saya Vira\",\n// (2) inject TANGGAL_SEKARANG (WIB) ke [SYSTEM_DATA].\n// [V2 - VISION] 2026-08-07: baris MSG_BUFFER yang isinya HANYA media\n// (message kosong) TIDAK lagi dibuang. URL gambar dalam window debounce\n// dikumpulkan ke `vision_images` untuk dianalisa Claude Haiku.\n// ====================================================================\nconst cc = $('Chat Counter').first().json;\nconst resolve = $('Resolve User Row').first().json;\nconst resolvedKey = resolve.resolved_key;\nconst cfg = (() => { try { return $('Parse Config').first().json.config || {}; } catch (e) { return {}; } })();\n\nconst debounceItem = $('Re-Read STATS Debounce').first();\nconst debounceRow = (debounceItem && debounceItem.json) ? debounceItem.json : {};\nconst botModeNow = String(debounceRow['bot_mode'] || '').trim().toUpperCase();\nif (botModeNow === 'OFF') {\n  console.log('HITL (post-debounce): bot_mode OFF - berhenti, admin handle manual.');\n  return [];\n}\n\nconst doneTs = Number(debounceRow['buffer_done_ts'] || 0) || 0;\nconst myTs = Number(cc.process_start_ts) || 0;\nlet bufRows = [];\ntry {\n  bufRows = $('Read MSG_BUFFER').all().map(i => i.json).filter(r => !!r);\n} catch (e) { console.warn('Read MSG_BUFFER tidak terbaca:', e.message); }\n\nconst MAX_AGE_MS = 30 * 60 * 1000;\n// [V2] baris dianggap valid kalau punya teks ATAU punya media.\nlet msgs = bufRows\n  .map(r => ({\n    ts: Number(r.ts) || 0,\n    message: String(r.message ?? '').trim(),\n    media_url: String(r.media_url ?? '').trim(),\n    media_type: String(r.media_type ?? '').trim().toLowerCase()\n  }))\n  .filter(r => r.ts > doneTs && r.ts <= myTs && (myTs - r.ts) < MAX_AGE_MS)\n  .filter(r => r.message !== '' || (r.media_url !== '' && r.media_type === 'image') || r.media_type === 'other')\n  .sort((a, b) => a.ts - b.ts);\n\n// Fallback: buffer gagal dibaca / kolom media belum ada -> pakai pesan ini saja.\nif (!msgs.length) {\n  const fb = {\n    ts: myTs,\n    message: String(cc.original_message || '').trim(),\n    media_url: String(cc.media_url || '').trim(),\n    media_type: String(cc.media_kind || 'none')\n  };\n  if (fb.message !== '' || fb.media_url !== '' || fb.media_type === 'other') msgs = [fb];\n}\n\nconst userMessage = msgs.map(r => r.message).filter(Boolean).join('\\n');\n\n// [V2] kumpulkan gambar dalam window ini (dedup URL, ambil yang terbaru)\nconst maxImg = Math.max(1, Number(cfg.vision_max_images ?? 3) || 3);\nconst seenUrl = new Set();\nconst allImages = [];\nfor (const r of msgs) {\n  if (r.media_type === 'image' && r.media_url && !seenUrl.has(r.media_url)) {\n    seenUrl.add(r.media_url);\n    allImages.push({ url: r.media_url, ts: r.ts });\n  }\n}\nconst visionImages = allImages.slice(-maxImg);\nconst imagesDropped = Math.max(0, allImages.length - visionImages.length);\nconst otherMediaCount = msgs.filter(r => r.media_type === 'other').length;\nconst hasImage = visionImages.length > 0;\n// [V2.1] hanya mode 'full' yang memanggil Claude. 'ack'/'off' = nol biaya.\nconst visionMode = String(cfg.vision_mode || 'full').toLowerCase();\nconst visionOn = hasImage && visionMode === 'full';\n\n// Teks yang dilihat AI di [USER QUERY]. Kalau user cuma kirim lampiran tanpa\n// caption, JANGAN pakai kata \"gambar\"/\"foto\" di sini - regex wantsMedia di\n// Preprocess akan kena dan Vira malah kirim brosur.\nconst userQueryText = userMessage !== ''\n  ? userMessage\n  : ((hasImage || otherMediaCount > 0) ? '(user mengirim lampiran tanpa teks)' : '');\n\nconst greetingSent = String(debounceRow['greeting_sent'] || resolve.greeting_sent || '').trim().toUpperCase();\nconst isNewUser = greetingSent !== 'Y';\n\nconst TTL_S = 60 * 86400;\nconst nowS = Math.floor(Date.now() / 1000);\nconst uiTs = Number(debounceRow['unit_interest_ts'] || resolve.unit_interest_ts || 0) || 0;\nconst uiFresh = uiTs > 0 && (nowS - uiTs) <= TTL_S;\nconst unitInterest = uiFresh ? String(debounceRow['unit_interest'] || resolve.unit_interest || '').trim() : '';\nconst brTs = Number(debounceRow['budget_range_ts'] || resolve.budget_range_ts || 0) || 0;\nconst brFresh = brTs > 0 && (nowS - brTs) <= TTL_S;\nconst budgetRange = brFresh ? String(debounceRow['budget_range'] || resolve.budget_range || '').trim() : '';\n\n// PROFIL USER (nama lengkap + lokasi_kerja)\nconst namaLengkap = String(debounceRow['nama_lengkap'] || resolve.nama_lengkap || '').trim();\nconst lokasi_kerja     = String(debounceRow['lokasi_kerja']     || resolve.lokasi_kerja     || '').trim();\nconst needName     = !namaLengkap;\nconst needDomicile = !lokasi_kerja;\nconst askProfileNow = isNewUser && (needName || needDomicile);\nconst askProfileTarget = !askProfileNow ? 'NO'\n  : (needName && needDomicile) ? 'nama+lokasi_kerja'\n  : (needName ? 'nama' : 'lokasi_kerja');\nconst needUnit = !unitInterest || unitInterest === 'UNKNOWN';\nconst askUnitNow = isNewUser && needUnit;\nconst askUnitTarget = askUnitNow ? 'tipe unit (subsidi/komersial)' : 'NO';\n\n// PENDING SURVEY (register #1) - slot survey lintas giliran dari STATS, TTL 48 jam.\nconst PENDING_TTL_S = 48 * 3600;\nconst psTs = Number(debounceRow['pending_survey_ts'] || resolve.pending_survey_ts || 0) || 0;\nconst psFresh = psTs > 0 && (nowS - psTs) <= PENDING_TTL_S;\nconst psTgl = psFresh ? String(debounceRow['pending_survey_tanggal'] || resolve.pending_survey_tanggal || '').trim() : '';\nconst psJam = psFresh ? String(debounceRow['pending_survey_jam'] || resolve.pending_survey_jam || '').trim() : '';\nconst psUnit = psFresh ? String(debounceRow['pending_survey_unit'] || resolve.pending_survey_unit || '').trim() : '';\nconst hasPendingSurvey = !!(psTgl || psJam || psUnit);\n\n// Tanggal & jam sekarang dlm WIB - sumber kebenaran tanggal utk AI.\nconst nowWIB = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Jakarta' }));\nconst pad2 = n => String(n).padStart(2, '0');\nconst HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];\nconst tanggalSekarang = `${nowWIB.getFullYear()}-${pad2(nowWIB.getMonth() + 1)}-${pad2(nowWIB.getDate())}`;\nconst hariSekarang = HARI[nowWIB.getDay()];\nconst jamSekarang = `${pad2(nowWIB.getHours())}:${pad2(nowWIB.getMinutes())}`;\n\nconst INTRO = 'Haloo, terima kasih sudah menghubungi Persada Cisoka Residence yaa. Saya Vira, siap bantu info seputar unit, harga, dan syarat KPR.';\n\nconst aiSystemData = `[SYSTEM_DATA]\nUSER_WA: ${resolvedKey}\nIS_NEW_USER: ${isNewUser}\nNAMA_LENGKAP: ${namaLengkap || 'UNKNOWN'}\nLOKASI_KERJA: ${lokasi_kerja || 'UNKNOWN'}\nASK_PROFILE: ${askProfileTarget}\nASK_UNIT: ${askUnitTarget}\nUNIT_INTEREST: ${unitInterest || 'UNKNOWN'}\nBUDGET_RANGE: ${budgetRange || 'UNKNOWN'}\nPENDING_SURVEY: ${hasPendingSurvey ? `tanggal=${psTgl || '-'} | jam=${psJam || '-'} | unit=${psUnit || '-'}` : '-'}\nTANGGAL_SEKARANG: ${tanggalSekarang} (${hariSekarang}) ${jamSekarang} WIB\n\nCRITICAL INSTRUCTION:\n${isNewUser\n  ? `USER BARU. Baris pertama balasan WAJIB intro ini PERSIS (jangan diubah/diringkas): \"${INTRO}\" Setelah intro, di pesan yang sama langsung jawab pertanyaan user kalau ada. Kalau user hanya menyapa, cukup intro saja.`\n  : 'User lama. JANGAN kirim intro/perkenalan lagi, lanjutkan percakapan secara natural.'}${\n  askProfileNow\n  ? `\\nMINTA DATA: user ini belum melengkapi ${askProfileTarget === 'nama+lokasi_kerja' ? 'nama lengkap dan lokasi_kerja' : (askProfileTarget === 'nama' ? 'nama lengkap' : 'lokasi_kerja')}. Di pesan yang SAMA, minta data itu sekali secara natural dan ramah (lihat # PROFIL USER). JANGAN memaksa, JANGAN menahan jawaban atas pertanyaan user, dan minta HANYA yang belum ada. Begitu user menyebutkannya, catat lewat tag [FACTS ...].`\n  : ''}${\n  askUnitNow\n  ? `\\nTANYA UNIT: user belum menyebut unit yang dicari. Di pesan yang SAMA, tanyakan SEKALI secara ramah apakah user mencari unit SUBSIDI atau KOMERSIAL (lihat # UNIT INTEREST). Tidak mandatory. Begitu user menyebut, catat lewat tag [FACTS unit=\"...\"].`\n  : ''}\n\n[USER QUERY]\n${userQueryText}`;\n\nreturn [{\n  json: {\n    ...cc,\n    resolved_key: resolvedKey,\n    ai_input_text: aiSystemData,\n    user_message_final: userMessage,\n    is_new_user: isNewUser,\n    unit_interest_db: unitInterest,\n    budget_range_db: budgetRange,\n    nama_lengkap_db: namaLengkap,\n    lokasi_kerja_db: lokasi_kerja,\n    pending_survey_tanggal_db: psTgl,\n    pending_survey_jam_db: psJam,\n    pending_survey_unit_db: psUnit,\n    ask_profile: askProfileTarget,\n    buffer_done_ts_old: doneTs,\n    // ---- [V2 VISION] ----\n    vision_images: visionImages,\n    vision_images_dropped: imagesDropped,\n    has_image: hasImage,\n    vision_on: visionOn,\n    other_media_count: otherMediaCount,\n    user_query_text: userQueryText,\n    vision_mode: visionMode\n  }\n}];", "PCRv21 :: Detect Lead Source": "// ====================================================================\n// DETECT LEAD SOURCE (BARU) — deteksi sumber traffic dari pesan pertama.\n// Rule-based murah; default \"Organik\". Tulis sekali (preserve first-touch).\n// ====================================================================\n// [V2 VISION] baca dari INPUT, bukan langsung dari Cek_user_status.\n// Node 'Rakit Konteks Gambar' menyisipkan deskripsi gambar ke ai_input_text;\n// kalau di sini masih ambil dari Cek_user_status, sisipan itu ketimpa.\nconst pre = $input.first().json;\nconst resolve = $('Resolve User Row').first().json;\nconst cfg = (() => { try { return $('Parse Config').first().json.config || {}; } catch(e){ return {}; } })();\nconst firstMsg = String(pre.user_message_final || pre.original_message || '').toLowerCase();\n\nconst DEFAULT_MAP = [\n  { source:'Instagram', keywords:['instagram','ig','insta','dari ig','lihat di ig','story ig'] },\n  { source:'Facebook',  keywords:['facebook','fb','dari fb','lihat di fb','marketplace'] },\n  { source:'Google',    keywords:['google','search','nyari di google','gmaps','maps'] },\n  { source:'TikTok',    keywords:['tiktok','tt','dari tiktok'] },\n  { source:'WhatsApp',  keywords:['broadcast','wa blast','katalog wa'] },\n];\nconst MAP = (Array.isArray(cfg.lead_source_map) && cfg.lead_source_map.length) ? cfg.lead_source_map : DEFAULT_MAP;\n\nlet detected = '';\nfor (const m of MAP) {\n  const kws = (m.keywords || []);\n  if (kws.some(k => firstMsg.includes(String(k).toLowerCase()))) { detected = m.source; break; }\n}\nif (!detected) detected = 'Organik';\n\nconst existing = String(resolve.lead_source_db || '').trim();\nconst finalSource = existing || detected;   // preserve sumber pertama\n\nreturn [{ json: { ...pre, lead_source_detected: detected, lead_source_final: finalSource } }];\n", "PCRv21 :: Preprocess - Context Detection": "// ============================================\n// PREPROCESS - CONTEXT DETECTION (domain properti PCR)\n// Deteksi tipe unit, budget, intent + INJECT KALENDER WIB ke AI.\n// Mekanisme dipertahankan: [SYSTEM_DATA] + [CONTEXT] + [USER QUERY]\n// ============================================\nconst json = $input.item.json;\nconst fullMessage = json.ai_input_text || json.message || json.text || '';\n\nconst cfg = (() => { try { return $('Parse Config').first().json.config || {}; } catch (e) { return {}; } })();\n\n// ── KALENDER WIB (anti-halusinasi tanggal) ──\n// LLM buruk berhitung kalender -> jangan suruh hitung, kasih tabelnya.\nconst DAY_ID = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];\nconst pad = n => String(n).padStart(2, '0');\nconst fmtISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;\nconst nowWIB = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Jakarta' }));\n\nconst openH = Number(cfg.survey_open_hour ?? 8);\nconst closeH = Number(cfg.survey_close_hour ?? 17);\n// 🔶 Hari tutup survey. Default: Minggu (0). Ubah ke [] kalau buka tiap hari.\nconst closedDays = Array.isArray(cfg.survey_closed_days) ? cfg.survey_closed_days.map(Number) : [];\n\nconst calendarLines = [];\nfor (let i = 1; i <= 7; i++) {\n  const d = new Date(nowWIB.getFullYear(), nowWIB.getMonth(), nowWIB.getDate() + i);\n  const rel = i === 1 ? ' (besok)' : (i === 2 ? ' (lusa)' : '');\n  const tutup = closedDays.includes(d.getDay()) ? ' [TUTUP - jangan tawarkan]' : '';\n  calendarLines.push(`  ${DAY_ID[d.getDay()]}${rel} = ${fmtISO(d)}${tutup}`);\n}\n\nconst calendarBlock =\n  `TODAY: ${fmtISO(nowWIB)} (${DAY_ID[nowWIB.getDay()]})\\n` +\n  `NOW_WIB: ${pad(nowWIB.getHours())}:${pad(nowWIB.getMinutes())}\\n` +\n  `JAM_OPERASIONAL_SURVEY: ${pad(openH)}:00-${pad(closeH)}:00\\n` +\n  `HARI_KE_TANGGAL (WAJIB pakai daftar ini, DILARANG menghitung/menebak tanggal sendiri):\\n` +\n  calendarLines.join('\\n');\n\n// ── PARSE INPUT ──\nlet actualUserMessage = '';\nif (fullMessage.includes('[USER QUERY]')) {\n  actualUserMessage = (fullMessage.split('[USER QUERY]')[1] || '').trim();\n} else {\n  actualUserMessage = String(fullMessage).trim();\n}\n\nlet isNewUser = false, unitInterestDB = '', budgetRangeDB = '';\nif (fullMessage.includes('[SYSTEM_DATA]')) {\n  const m = fullMessage.match(/IS_NEW_USER:\\s*(\\w+)/i); if (m) isNewUser = m[1].toLowerCase() === 'true';\n  const u = fullMessage.match(/UNIT_INTEREST:\\s*([^\\n]+)/i); if (u) { const v = u[1].trim(); if (v && v.toUpperCase() !== 'UNKNOWN') unitInterestDB = v; }\n  const b = fullMessage.match(/BUDGET_RANGE:\\s*([^\\n]+)/i); if (b) { const v = b[1].trim(); if (v && v.toUpperCase() !== 'UNKNOWN') budgetRangeDB = v; }\n}\n\nconst message = actualUserMessage.toLowerCase();\nconst userPhone = json.user_wa || json.from || 'unknown';\n\n// deteksi tipe unit — WAJIB lengkap \"NN/NN\". Semua tipe PCR punya slash,\n// jadi \"tipe 36\" tanpa slash = TIDAK VALID (ini akar bug memori \"Tipe 36\").\nconst canonType = (s) => { const m = String(s).match(/(\\d{2,3})\\s*\\/\\s*(\\d{2,3})/); return m ? `Tipe ${m[1]}/${m[2]}` : null; };\nconst addUnit = (arr, s) => { const c = canonType(s); if (c && !arr.includes(c)) arr.push(c); };\n\nlet units = [];\nconst typeRe = /tipe\\s*(\\d{2,3})\\s*\\/\\s*(\\d{2,3})/gi; // slash WAJIB (dulu opsional -> \"tipe 36\" ketangkep)\nlet tm;\nwhile ((tm = typeRe.exec(message)) !== null) addUnit(units, `${tm[1]}/${tm[2]}`);\n\n// fallback dari DB: saring lewat canonType supaya nilai lama yang korup (\"Tipe 36\") tidak ikut\nif (!units.length && unitInterestDB) { for (const s of unitInterestDB.split(',')) addUnit(units, s); }\n\n// budget mention (mis. \"500 juta\", \"1.2 M\")\nlet budgetMention = '';\nconst bmatch = message.match(/(\\d+(?:[.,]\\d+)?)\\s*(jt|juta|m\\b|miliar|milyar)/i);\nif (bmatch) budgetMention = bmatch[0].trim();\n\nconst askingPrice = /harga|biaya|berapa|nyicil|cicil|angsuran|\\bdp\\b|kpr|bayar|murah|mahal|promo/i.test(message);\nconst askingKPR = /kpr|cicil|angsuran|\\bdp\\b|tenor|bunga|bank|simulasi|subsidi/i.test(message);\nconst askingLokasi = /lokasi|alamat|dimana|di mana|maps|arah|jalan|akses|tol|dekat|deket|stasiun/i.test(message);\nconst askingLegalitas = /shm|hgb|sertifikat|legalitas|imb|pbb|surat|akad|notaris|balik nama/i.test(message);\nconst askingFasilitas = /fasilitas|keamanan|cctv|masjid|taman|kolam|security|one gate|cluster/i.test(message);\nconst wantsSurvey = /survey|survei|kunjungan|lihat lokasi|liat lokasi|liat unit|lihat unit|ke lokasi|datang|show ?unit|kunjung/i.test(message);\nconst wantsMedia = /brosur|siteplan|site plan|denah|katalog|gambar|foto|price ?list/i.test(message);\nconst discussingUnit = /unit|tipe|rumah|cluster|kavling|hook|ready|indent/i.test(message) || units.length > 0;\n\n// User membalas slot (\"jam 10 pagi bs\", \"senin aja\") -> wantsSurvey regex TIDAK kena,\n// padahal ini lanjutan penjadwalan. Deteksi terpisah supaya CONTEXT tetap terpasang.\nconst mentionsDateTime = /\\b(senin|selasa|rabu|kamis|jumat|jum'at|sabtu|minggu|besok|lusa|hari ini|akhir pekan|weekend)\\b/i.test(message)\n  || /\\bjam\\s*\\d{1,2}|\\d{1,2}[:.]\\d{2}|\\b\\d{1,2}\\s*(pagi|siang|sore|malam)\\b/i.test(message)\n  || /\\b\\d{1,2}[\\/\\-]\\d{1,2}(?:[\\/\\-]\\d{2,4})?\\b/.test(message);\n\nlet aiContext = '';\nif (units.length) aiContext += `Unit yang diminati user: ${units.join(', ')}. Fokus rekomendasi ke tipe itu. `;\nelse if (budgetMention) aiContext += `User menyebut kisaran budget ${budgetMention}. Arahkan ke tipe yang sesuai budget dari DATA. `;\nif (askingKPR) aiContext += `User menanyakan KPR/cicilan. Jawab dari DATA (Skema KPR), jangan mengarang nominal/bank. `;\nif (wantsSurvey || mentionsDateTime) {\n  aiContext += `Konteks penjadwalan survey. Slot WAJIB lengkap: tanggal + jam + tipe unit. `;\n  aiContext += `Yang belum diketahui, tanya SATU per pesan. WAJIB pasang [SCHEDULE_SURVEY tanggal=\"YYYY-MM-DD\" jam=\"HH:MM\" unit=\"...\"] SETIAP KALI user menyebut slot walau baru sebagian — slot yang belum diketahui isi string kosong (mis. unit=\"\"). Sistem yang menentukan lengkap atau belum, bukan kamu. `;\n  aiContext += `Selama belum lengkap, DILARANG bilang sudah dicatat/dijadwalkan. `;\n  aiContext += `Tanggal ambil dari HARI_KE_TANGGAL di [SYSTEM_DATA], jangan hitung sendiri. `;\n  if (units.length) aiContext += `Tipe unit sudah diketahui (${units.join(', ')}), jangan tanya ulang. `;\n}\nif (wantsMedia) aiContext += `User minta media (brosur/foto/video/denah). Kalau tipe unit sudah jelas atau cuma 1 yang cocok di katalog, pasang [SEND_MEDIA: <key>] dengan key kanonik. Kalau ambigu (belum sebut tipe & ada >1 pilihan), tanya dulu tipe mana yang dimaksud, JANGAN pasang tag. `;\nif (askingLegalitas) aiContext += `Pertanyaan legalitas: jawab hanya yang tertulis di DATA, selebihnya eskalasi atau [UNKNOWN]. `;\n\n// ── RAKIT INPUT AI ──\nlet systemDataBlock = '';\nif (fullMessage.includes('[USER QUERY]')) systemDataBlock = fullMessage.split('[USER QUERY]')[0].trim();\n\nlet enhancedInput = '';\nif (systemDataBlock) {\n  // sisipkan kalender ke dalam blok [SYSTEM_DATA], sebelum CRITICAL INSTRUCTION\n  if (systemDataBlock.includes('CRITICAL INSTRUCTION')) {\n    enhancedInput += systemDataBlock.replace('CRITICAL INSTRUCTION', calendarBlock + '\\n\\nCRITICAL INSTRUCTION') + `\\n\\n`;\n  } else {\n    enhancedInput += systemDataBlock + `\\n` + calendarBlock + `\\n\\n`;\n  }\n} else {\n  enhancedInput += `[SYSTEM_DATA]\\n` + calendarBlock + `\\n\\n`;\n}\nif (aiContext.trim()) enhancedInput += `[CONTEXT: ${aiContext.trim()}]\\n\\n`;\nenhancedInput += `[USER QUERY]\\n${actualUserMessage}`;\n\nreturn {\n  userPhone,\n  actualUserMessage,\n  fullMessage,\n  messageLower: message,\n  isNewUser,\n  unitInterestDB,\n  budgetRangeDB,\n  units,\n  budgetMention,\n  askingPrice,\n  askingKPR,\n  askingLokasi,\n  askingLegalitas,\n  askingFasilitas,\n  wantsSurvey,\n  wantsMedia,\n  mentionsDateTime,\n  discussingUnit,\n  today_wib: fmtISO(nowWIB),\n  now_wib_ts: nowWIB.getTime(),\n  aiContext: aiContext.trim(),\n  ai_input_text: enhancedInput\n};", "PCRv21 :: FAQ Retrieve": "// ===== CONTEXT RETRIEVE (PCR) =====\n// data_context dari PRODUK (unit/harga/KPR) + LINKS. FAQ lexical.\n// CHANGELOG 2026-07-18 (disambiguasi media):\n//   - HAPUS blok $('Read LINGKUNGAN Data') (referensi mati; data lingkungan sudah\n//     dipindah ke FAQ). Node itu tidak ada di workflow live -> grab() selalu [].\n//   - Serialisasi LINK/MEDIA AKTIF kini menyertakan Tipe, Tipe Unit, dan Keyword\n//     (kolom baru sheet LINKS) supaya AI bisa menyebut opsi per tipe dengan akurat\n//     saat permintaan media ambigu.\n// CHANGELOG 2026-07-20 (efisiensi token — data_context kondisional):\n//   - PRODUK: serialisasi generik \"semua kolom, selalu\" diganti 3 ember kondisional\n//     (CORE / MONEY / SPEK). Sebelumnya 1.698 tok dikirim tiap giliran termasuk saat\n//     user cuma menyapa. Sekarang 341-1.662 tok tergantung intent. Pola ini menyalin\n//     FAQ Retrieve VIRA V4 thescholars yang memang kondisional sejak awal.\n//   - Kolom yang TIDAK dikenal masuk ember SPEK (bukan dibuang) -> tetap robust\n//     terhadap restrukturisasi skema; kolom baru otomatis ikut saat user bahas unit.\n//   - Kolom 'Catatan' masuk DROP: isinya catatan internal (\"Sumber: pricelist resmi\n//     (foto)\") yang tidak pernah dipakai AI dan berisiko bocor sebagai proses internal.\n//   - LINKS: Keyword & Deskripsi hanya dikirim saat pre.wantsMedia. Nama key + Tipe +\n//     Tipe Unit tetap selalu dikirim supaya AI selalu tahu isi katalognya.\n//   - flags kini menyertakan wantsMedia.\n// CHANGELOG 2026-07-22 (maps/website salah masuk jalur SEND_MEDIA/attachment):\n//   - LINKS dipecah 2 blok berdasar Tipe: image/video -> tetap \"LINK/MEDIA AKTIF\"\n//     (instruksi [SEND_MEDIA]); location/website -> blok baru \"LINK INFORMASI\"\n//     yang membawa URL LANGSUNG dan instruksi \"jawab sebagai teks, JANGAN SEND_MEDIA\".\n//     Row maps/website TIDAK LAGI muncul di daftar key kanonik SEND_MEDIA.\ntry {\n  const pre = $('Preprocess - Context Detection').first().json;\n  const query = pre.actualUserMessage || '';\n  const flags = {\n    askingPrice: !!pre.askingPrice, askingKPR: !!pre.askingKPR, askingLokasi: !!pre.askingLokasi,\n    askingFasilitas: !!pre.askingFasilitas, askingLegalitas: !!pre.askingLegalitas,\n    discussingUnit: !!pre.discussingUnit, wantsSurvey: !!pre.wantsSurvey,\n    wantsMedia: !!pre.wantsMedia,\n  };\n  const grab = (node) => { try { return $(node).all().map(i => i.json).filter(Boolean); } catch (e) { return []; } };\n  const val = (row, ...keys) => { for (const k of keys) { for (const rk of Object.keys(row)) { if (rk.toLowerCase().trim() === k.toLowerCase().trim() || rk.toLowerCase().startsWith(k.toLowerCase())) { const v = row[rk]; if (v !== undefined && v !== null && String(v).trim() !== '') return String(v).trim(); } } } return ''; };\n  const clip = (s, n) => { s = (s || '').replace(/\\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; };\n\n  const parts = [];\n  const prod = grab('Read PRODUK Data');\n  if (prod.length) {\n    // Serialisasi KONDISIONAL per intent. Nama kolom dinormalisasi (lowercase, spasi\n    // dirapatkan, spasi di sekitar '/' dibuang) supaya \"Booking Fee / DP\",\n    // \"Booking Fee/DP\", dan \"booking fee /dp\" sama-sama kena.\n    const norm = (k) => String(k).toLowerCase().replace(/\\s*\\/\\s*/g, '/').replace(/\\s+/g, ' ').trim();\n    const DROP  = new Set(['no', 'row_number', 'last update', 'last_update', 'catatan']);\n    const LABEL = new Set(['tipe unit', 'tipe']);                       // sudah jadi label baris\n    const CORE  = new Set(['kategori', 'harga normal', 'status stok']); // selalu dikirim\n    const MONEY = new Set(['harga promo', 'batas tanggal promo', 'booking fee/dp',\n                           'skema cicilan', 'bank/skema kpr', 'promo berlaku']);\n\n    const wantMoney = flags.askingPrice || flags.askingKPR || flags.wantsSurvey || flags.discussingUnit;\n    const wantSpek  = flags.discussingUnit || flags.askingFasilitas || flags.askingLegalitas;\n\n    const lines = prod.map(r => {\n      const name = val(r, 'Tipe Unit', 'Tipe') || '(unit tanpa nama)';\n      const fields = [];\n      for (const k of Object.keys(r)) {\n        const kl = norm(k);\n        if (DROP.has(kl) || LABEL.has(kl)) continue;\n        const raw = r[k];\n        if (raw === undefined || raw === null || String(raw).trim() === '') continue;\n        // Kolom tak dikenal -> ember SPEK (aman: ikut saat user bahas unit, bukan dibuang).\n        const bucket = CORE.has(kl) ? 'core' : (MONEY.has(kl) ? 'money' : 'spek');\n        if (bucket === 'money' && !wantMoney) continue;\n        if (bucket === 'spek' && !wantSpek) continue;\n        fields.push(`${k}=${clip(String(raw), 220)}`);\n      }\n      return `${name} → ${fields.join(' | ')}`;\n    });\n    parts.push('UNIT / HARGA / KPR / SPESIFIKASI (data resmi; tipe, harga, cicilan, skema, atau promo yang TIDAK tertulis di sini = jangan dikarang):\\n' + lines.join('\\n'));\n  }\n  const links = grab('Read LINKS Data');\n  if (links.length) {\n    const wantMediaMeta = flags.wantsMedia;\n    const activeRows = links.filter(r => /^\\s*(aktif|active|on|ya)\\s*$/i.test(val(r, 'Status')));\n    // Tipe image/video = file beneran -> lewat SEND_MEDIA. Tipe lain (location, website,\n    // dst) = sekadar URL/teks -> TIDAK boleh lewat SEND_MEDIA (lihat blok LINK INFORMASI).\n    const FILE_TIPE = new Set(['image', 'video']);\n    const fileRows = activeRows.filter(r => FILE_TIPE.has(val(r, 'Tipe').toLowerCase()));\n    const infoRows = activeRows.filter(r => !FILE_TIPE.has(val(r, 'Tipe').toLowerCase()));\n\n    const active = fileRows.map(r => {\n      const nm = val(r, 'Nama Link');\n      if (!nm) return '';\n      const tipe = val(r, 'Tipe');\n      const tu = val(r, 'Tipe Unit');\n      const meta = [];\n      if (tipe) meta.push(tipe);\n      if (tu) meta.push('tipe ' + tu);\n      if (wantMediaMeta) {\n        const kw = val(r, 'Keyword');\n        if (kw) meta.push('kata kunci: ' + kw);\n      }\n      let line = nm;\n      if (meta.length) line += ' [' + meta.join(', ') + ']';\n      if (wantMediaMeta) {\n        const ds = clip(val(r, 'Deskripsi'), 60);\n        if (ds) line += ' - ' + ds;\n      }\n      return line;\n    }).filter(Boolean);\n    if (active.length) {\n      const sample = val(fileRows[0], 'Nama Link') || 'brosur';\n      parts.push('LINK/MEDIA AKTIF (saat [SEND_MEDIA] sebut key PERSIS dari kolom pertama, mis. [SEND_MEDIA: ' + sample + ']; kalau user minta foto/video tanpa sebut tipe dan ada >1 pilihan, tanya dulu tipe mana):\\n- ' + active.join('\\n- '));\n    }\n\n    const info = infoRows.map(r => {\n      const nm = val(r, 'Nama Link');\n      const url = val(r, 'URL');\n      if (!nm || !url) return '';\n      const ds = clip(val(r, 'Caption') || val(r, 'Deskripsi'), 80);\n      return `${nm}: ${url}${ds ? ' - ' + ds : ''}`;\n    }).filter(Boolean);\n    if (info.length) {\n      parts.push('LINK INFORMASI (BUKAN media/attachment - kalau relevan, sebut URL-nya apa adanya sebagai teks di balasan, JANGAN pakai tag [SEND_MEDIA] untuk ini):\\n- ' + info.join('\\n- '));\n    }\n  }\n  const data_context = parts.join('\\n\\n');\n\n  // FAQ lexical retrieval\n  const faq = grab('Read FAQ').filter(r => r.Pertanyaan && r.Jawaban);\n  const STOP = new Set(['yang','untuk','dan','di','ke','dari','itu','ini','apa','apakah','bisa','kah','ya','yaa','kak','min','dong','sih','kok','aja','ada','gimana','bagaimana','saya','aku','nya','kalau','atau','juga','sudah','belum','mau','dengan','pada','adalah','tolong','mohon','halo','hai','permisi','terima','kasih','sama','buat','soal','tentang','nih','ga','gak','engga','tidak','dll','yg','utk']);\n  const GROUPS = [\n    ['harga','biaya','bayar','cicil','cicilan','angsuran','dp','kpr','tenor','bunga','subsidi','promo','murah','mahal'],\n    ['unit','tipe','rumah','kavling','cluster','hook','bangunan'],\n    ['luas','tanah','bangunan','ukuran'],\n    ['survey','survei','kunjungan','datang'],\n    ['lokasi','alamat','maps','akses','tol','jalan','stasiun','dekat'],\n    ['legalitas','shm','hgb','sertifikat','imb','pbb','akad','notaris'],\n    ['fasilitas','keamanan','cctv','masjid','taman','kolam','security','gate'],\n    ['ready','indent','stok','tersedia','sisa'],\n    ['bank','kredit','approve','pengajuan','simulasi'],\n    ['brosur','siteplan','denah','katalog','gambar','foto'],\n  ];\n  const SYN = {}; for (const g of GROUPS) for (const w of g) SYN[w] = g[0];\n  const stem = (t) => { let w = t; for (const s of ['nya','kah','lah','kan','an','i']) if (w.length - s.length >= 4 && w.endsWith(s)) { w = w.slice(0, -s.length); break; } for (const p of ['meng','meny','mem','men','peng','peny','pem','pen','ber','ter','di','se','ke','me','pe']) if (w.length - p.length >= 4 && w.startsWith(p)) { w = w.slice(p.length); break; } return w; };\n  const tok = (s) => (s || '').toLowerCase().replace(/[^\\p{L}\\p{N}\\s]/gu, ' ').split(/\\s+/).filter(Boolean).filter(t => !STOP.has(t)).map(t => { const a = SYN[t]; if (a) return a; const st = stem(t); return SYN[st] || st; }).filter(t => t.length >= 2 && !STOP.has(t));\n  const docs = faq.map(r => ({ row: r, toks: tok(r.Pertanyaan) }));\n  const Nn = docs.length, df = {};\n  for (const dd of docs) for (const t of new Set(dd.toks)) df[t] = (df[t] || 0) + 1;\n  const idf = (t) => Math.log((Nn + 1) / ((df[t] || 0) + 1)) + 1;\n  const boost = {};\n  if (flags.askingPrice || flags.askingKPR) boost['Harga & KPR'] = 1.25;\n  if (flags.askingLokasi) boost['Lokasi'] = 1.2;\n  if (flags.wantsSurvey) boost['Survey'] = 1.2;\n  const qToks = [...new Set(tok(query))];\n  let faq_context = '';\n  if (qToks.length && docs.length) {\n    const scored = docs.map(dd => { const dset = new Set(dd.toks); let s = 0, m = 0; for (const t of qToks) if (dset.has(t)) { s += idf(t); m++; } s *= (boost[dd.row.Kategori] || 1.0); return { row: dd.row, score: s, matched: m }; }).sort((a, b) => b.score - a.score);\n    const top = scored[0];\n    const FLOOR = 2.5, needCov = qToks.length >= 3 ? 2 : 1;\n    if (top.score >= FLOOR && top.matched >= needCov) {\n      const kept = scored.filter(x => x.score >= 0.45 * top.score && x.matched >= 1).slice(0, 4);\n      faq_context = kept.map(x => `Q: ${x.row.Pertanyaan}\\nA: ${x.row.Jawaban}`).join('\\n\\n');\n    }\n  }\n\n  return [{ json: { ...pre, faq_context, data_context }, pairedItem: { item: 0 } }];\n} catch (e) {\n  const pre = ($('Preprocess - Context Detection').first() || { json: {} }).json || {};\n  return [{ json: { ...pre, faq_context: '', data_context: '', faq_error: String(e) }, pairedItem: { item: 0 } }];\n}", "PCRv21 :: Process All": "const item = $input.first();\nlet aiOutput = '';\nif (item?.json?.content && Array.isArray(item.json.content) && item.json.content.length > 0) {\n  aiOutput = item.json.content[0].text || '';\n} else {\n  aiOutput = item?.json?.output || item?.json?.text || '';\n}\nconsole.log('AI Output preview:', aiOutput.substring(0, 300));\n\nconst chatCounter = $('Chat Counter').first().json;\nconst preprocess = $('Preprocess - Context Detection').first().json;\nconst cfg = (() => { try { return $('Parse Config').first().json.config || {}; } catch(e){ return {}; } })();\nconst originalMessage = chatCounter.original_message || '';\nconst isNewUser = preprocess?.isNewUser || false;\n\n// ── HELPER TANGGAL WIB ──\nconst DAY_ID = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];\nconst BULAN_ID = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];\nconst pad = n => String(n).padStart(2, '0');\nconst nowWIB = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Jakarta' }));\nconst tglDisplay = iso => { const m = String(iso).match(/^(\\d{4})-(\\d{2})-(\\d{2})$/); if (!m) return String(iso); const d = new Date(+m[1], +m[2]-1, +m[3]); return `${DAY_ID[d.getDay()]} ${+m[3]} ${BULAN_ID[+m[2]-1]}`; };\nconst contohTanggal = (() => { const d = new Date(nowWIB.getFullYear(), nowWIB.getMonth(), nowWIB.getDate() + 1); return `${DAY_ID[d.getDay()]} ${d.getDate()} ${BULAN_ID[d.getMonth()]}`; })();\n\n// ── VALIDASI SLOT SURVEY (deterministik di Code node) ──\nconst openH = Number(cfg.survey_open_hour ?? 8);\nconst closeH = Number(cfg.survey_close_hour ?? 17);\n// 🔶 harus SAMA dengan closedDays di node Preprocess\nconst closedDays = Array.isArray(cfg.survey_closed_days) ? cfg.survey_closed_days.map(Number) : [];\n\nfunction validateSurveySlot(tglRaw, jamRaw) {\n  let d = null;\n  const iso = String(tglRaw).match(/^(\\d{4})-(\\d{2})-(\\d{2})$/);\n  const dmy = String(tglRaw).match(/^(\\d{1,2})[\\/\\-](\\d{1,2})(?:[\\/\\-](\\d{2,4}))?$/);\n  if (iso) d = new Date(+iso[1], +iso[2] - 1, +iso[3]);\n  else if (dmy) d = new Date(dmy[3] ? (dmy[3].length === 2 ? 2000 + +dmy[3] : +dmy[3]) : nowWIB.getFullYear(), +dmy[2] - 1, +dmy[1]);\n  if (!d || isNaN(d)) return { ok: false, reason: 'tanggal tidak terbaca' };\n\n  const jm = String(jamRaw).match(/(\\d{1,2})[:.](\\d{2})/);\n  if (!jm) return { ok: false, reason: 'jam tidak terbaca' };\n  const hh = +jm[1], mm = +jm[2];\n  if (hh > 23 || mm > 59) return { ok: false, reason: 'jam tidak valid' };\n  d.setHours(hh, mm, 0, 0);\n\n  // bandingkan ke WAKTU SEKARANG WIB, bukan tengah malam.\n  // (bug lama: jam yang sudah lewat hari ini tetap lolos)\n  if (d.getTime() <= nowWIB.getTime()) return { ok: false, reason: 'tanggal/jam sudah lewat' };\n  // jaga-jaga halusinasi tahun (mis. AI keluarkan 2025 padahal 2026)\n  if (d.getFullYear() < nowWIB.getFullYear()) return { ok: false, reason: 'tahun tidak valid' };\n  if (closedDays.includes(d.getDay())) return { ok: false, reason: 'hari ' + DAY_ID[d.getDay()] + ' tutup' };\n  if (hh < openH || hh >= closeH) return { ok: false, reason: 'di luar jam operasional' };\n\n  return { ok: true, tanggal: `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`, jam: `${pad(hh)}:${pad(mm)}` };\n}\n\n// ── TAG: [SCHEDULE_SURVEY] (parse dulu, validasi setelah unit di-merge) ──\nlet isScheduleSurvey = false, surveyData = {};\nlet isSurveyIncomplete = false, missingSlots = [], surveyRejectReason = '';\nlet svTagFound = false, svTgl = '', svJam = '', svUnit = '';\nconst svMatch = aiOutput.match(/\\[\\s*SCHEDULE_SURVEY\\b([^\\]]*)\\]/i);\nif (svMatch && svMatch[1]) {\n  svTagFound = true;\n  const c = svMatch[1];\n  svTgl = ((c.match(/tanggal\\s*=\\s*\"([^\"]*)\"/i) || [])[1] || '').trim();\n  svJam = ((c.match(/jam\\s*=\\s*\"([^\"]*)\"/i) || [])[1] || '').trim();\n  svUnit = ((c.match(/unit\\s*=\\s*\"([^\"]*)\"/i) || [])[1] || '').trim();\n}\n\n// ── TAG: [REQUEST_CALL] ──\nlet isRequestCall = aiOutput.includes('[REQUEST_CALL]');\nif (!isRequestCall) {\n  const low = aiOutput.toLowerCase();\n  const callPatterns = ['nomor yang bisa dihubungi','bisa ditelpon','bisa ditelepon','nomor telepon admin','hubungi langsung','minta nomornya','nomor cs','nomor marketing'];\n  if (callPatterns.some(p => low.includes(p))) isRequestCall = true;\n}\n\n// ── TAG: [TALK_TO_ADMIN] ── (tag-only; fallback frasa dihapus 2026-07-23 — bikin false-handover tiap Vira menawarkan eskalasi)\nlet isTalkToAdmin = aiOutput.includes('[TALK_TO_ADMIN]');\n\n// ── TAG: [SEND_MEDIA: key] ──\nlet isSendMedia = false, mediaKey = '';\n// #3 multi-media: tangkap SEMUA tag SEND_MEDIA (bukan cuma pertama). matchAll + flag /g.\nconst mediaKeysAll = [...new Set(\n  [...aiOutput.matchAll(/\\[\\s*SEND_MEDIA\\s*(?::\\s*([^\\]]*))?\\]/gi)]\n    .map(m => (m[1] || 'brosur').trim().toLowerCase())\n    .filter(Boolean)\n)];\nif (mediaKeysAll.length) { isSendMedia = true; mediaKey = mediaKeysAll[0]; }\nif (!isSendMedia) {\n  const low = aiOutput.toLowerCase();\n  const patt = ['kirim brosur','saya kirimkan brosur','ini brosurnya','brosurnya saya kirim','saya kirim siteplan','denahnya saya kirim','saya kirim denah','ini siteplannya'];\n  if (patt.some(p => low.includes(p))) { isSendMedia = true; mediaKey = 'brosur'; }\n}\n\n// ── TAG: [UNKNOWN] ──\nlet isUnknown = aiOutput.includes('[UNKNOWN]');\n\n// ── TAG: [FACTS unit=\"...\" budget=\"...\"] + merge persist ──\nlet factUnit = '', factBudget = '';\nconst factsMatch = aiOutput.match(/\\[\\s*FACTS\\b([^\\]]*)\\]/i);\nif (factsMatch && factsMatch[1]) {\n  factUnit = (factsMatch[1].match(/unit\\s*=\\s*\"([^\"]*)\"/i) || [])[1] || '';\n  factBudget = (factsMatch[1].match(/budget\\s*=\\s*\"([^\"]*)\"/i) || [])[1] || '';\n}\nlet factNama = '', factLokasiKerja = '';\nif (factsMatch && factsMatch[1]) {\n  factNama        = (factsMatch[1].match(/nama\\s*=\\s*\"([^\"]*)\"/i) || [])[1] || '';\n  factLokasiKerja = (factsMatch[1].match(/lokasi_kerja\\s*=\\s*\"([^\"]*)\"/i) || [])[1] || '';\n}\nlet existingUnit = ''; try { existingUnit = String($('Cek_user_status').first().json.unit_interest_db || ''); } catch (e) {}\nlet existingBudget = ''; try { existingBudget = String($('Cek_user_status').first().json.budget_range_db || ''); } catch (e) {}\nlet existingNama = '';     try { existingNama = String($('Cek_user_status').first().json.nama_lengkap_db || ''); } catch (e) {}\nlet existingLokasiKerja = ''; try { existingLokasiKerja = String($('Cek_user_status').first().json.lokasi_kerja_db || ''); } catch (e) {}\n// sanitasi ringan: buang karakter kontrol (charCode < 32) tanpa escape unicode, rapikan spasi, batasi panjang.\nconst cleanProfile = s => String(s || '').split('').filter(ch => ch.charCodeAt(0) >= 32).join('').replace(/\\s+/g, ' ').trim().slice(0, 60);\nconst namaMerged        = cleanProfile(factNama)        || existingNama;\nconst lokasiKerjaMerged = cleanProfile(factLokasiKerja) || existingLokasiKerja;\nconst namaChanged        = namaMerged !== ''        && namaMerged !== existingNama;\nconst lokasiKerjaChanged = lokasiKerjaMerged !== '' && lokasiKerjaMerged !== existingLokasiKerja;\n// kanonikalisasi tipe saat merge — buang entri tak valid (mis. \"Tipe 36\" tanpa slash).\n// Ini yang membersihkan STATS yang sudah terlanjur korup: nilai bersih ditulis ulang,\n// dan \"Tipe 36\" tidak pernah re-propagate dari existingUnit.\nconst canonType = (s) => { const t = String(s); const m = t.match(/(\\d{2,3})\\s*\\/\\s*(\\d{2,3})/); if (m) return `Tipe ${m[1]}/${m[2]}`; if (/komersil|komersial/i.test(t)) return 'Komersial'; if (/subsidi/i.test(t)) return 'Subsidi'; return null; };\nconst regexUnits = Array.isArray(preprocess && preprocess.units) ? preprocess.units : [];\nconst unitSet = [];\nfor (const raw of [factUnit, ...regexUnits, existingUnit].join(',').split(',')) {\n  const c = canonType(raw);\n  if (c && !unitSet.includes(c)) unitSet.push(c);\n}\nconst unitMerged = unitSet.join(', ');\nconst budgetMerged = (factBudget || (preprocess && preprocess.budgetMention) || existingBudget || '').trim();\nconst unitChanged = unitMerged !== '' && unitMerged !== existingUnit;\nconst budgetChanged = budgetMerged !== '' && budgetMerged !== existingBudget;\n\n// PENDING SURVEY (register #1) — slot cadangan dari STATS.\n// TTL sudah diterapkan di Cek_user_status; di sini tinggal pakai.\nlet pendingSv = { tanggal: '', jam: '', unit: '' };\ntry {\n  const cus = $('Cek_user_status').first().json;\n  pendingSv = {\n    tanggal: String(cus.pending_survey_tanggal_db || '').trim(),\n    jam: String(cus.pending_survey_jam_db || '').trim(),\n    unit: String(cus.pending_survey_unit_db || '').trim()\n  };\n} catch (e) {}\n\n// ── GUARD: TAG SURVEY HALUSINASI ──\n// AI kadang memasang [SCHEDULE_SURVEY] padahal user tidak menyinggung survey/tanggal/jam\n// sama sekali (mis. cuma minta foto taman). Tag setengah-isi begitu tidak boleh sampai\n// masuk gate kelengkapan, karena FAIL LOUD di bawah akan menimpa balasan AI yang sudah benar.\n// Sengaja TIDAK melihat pendingSv: slot nyangkut dari giliran sebelumnya justru yang\n// bikin tag hantu ini berulang tiap turn.\nlet svHallucinated = false;\nconst svIntentTurn = !!(preprocess && (preprocess.wantsSurvey || preprocess.mentionsDateTime));\nconst svSlotsAI = [svTgl, svJam, svUnit].filter(Boolean).length;\nif (svTagFound && !svIntentTurn && svSlotsAI < 3) {\n  svHallucinated = true;\n  svTagFound = false;\n  svTgl = ''; svJam = ''; svUnit = '';\n  console.warn('SCHEDULE_SURVEY diabaikan: tag hantu (user tidak minta survey, slot terisi=' + svSlotsAI + ')');\n}\n\n// ── GATE KELENGKAPAN SURVEY ──\n// Write SURVEY hanya boleh jalan kalau tanggal + jam + unit LENGKAP dan valid.\nif (svTagFound) {\n  // register #1: slot giliran sebelumnya jadi cadangan kalau AI tidak menyebut ulang — tag AI menang\n  if (!svTgl && pendingSv.tanggal) svTgl = pendingSv.tanggal;\n  if (!svJam && pendingSv.jam) svJam = pendingSv.jam;\n  if (!svUnit && pendingSv.unit) svUnit = pendingSv.unit;\n\n  // unit: resolusi berjenjang, jangan tanya ulang kalau sudah diketahui sistem\n  const unitResolved = svUnit || unitMerged || '';\n\n  if (!svTgl) missingSlots.push('tanggal');\n  if (!svJam) missingSlots.push('jam');\n  if (!unitResolved) missingSlots.push('unit');\n\n  if (missingSlots.length) {\n    isSurveyIncomplete = true;\n    surveyRejectReason = 'slot belum lengkap: ' + missingSlots.join(', ');\n    console.warn('SCHEDULE_SURVEY ditolak:', surveyRejectReason);\n  } else {\n    const v = validateSurveySlot(svTgl, svJam);\n    if (v.ok) {\n      isScheduleSurvey = true;\n      surveyData = { tanggal: v.tanggal, jam: v.jam, unit: unitResolved };\n      console.log('SCHEDULE_SURVEY valid', JSON.stringify(surveyData));\n    } else {\n      isSurveyIncomplete = true;\n      surveyRejectReason = v.reason;\n      surveyData = { tanggal: svTgl, jam: svJam, unit: unitResolved };\n      console.warn('SCHEDULE_SURVEY ditolak validasi:', v.reason);\n    }\n  }\n}\n\n// ── CLEAN OUTPUT (buang semua tag) ──\nlet cleanOutput = aiOutput\n  .replace(/\\[\\s*SEND_MEDIA\\s*(?::[^\\]]*)?\\]/gi, '')\n  .replace(/\\[\\s*SCHEDULE_SURVEY\\b[^\\]]*\\]/gi, '')\n  .replace(/\\[REQUEST_CALL\\]/gi, '')\n  .replace(/\\[TALK_TO_ADMIN\\]/gi, '')\n  .replace(/\\[UNKNOWN\\]/gi, '')\n  .replace(/\\[\\s*FACTS\\b[^\\]]*\\]/gi, '');\n\nconst preInternalStrip = cleanOutput;\nconst internalKeywords = ['berdasarkan faq','berdasarkan data','menurut data','dari faq','dari sheet','data terverifikasi','faq relevan','data yang tersedia','saya cek data','saya cek faq','saya cek sheet','cek di sheet','cek di database'];\nconst keywordPattern = internalKeywords.join('|');\ncleanOutput = cleanOutput.replace(new RegExp(`^\\\\s*([^.!?]*?(${keywordPattern})[^.!?]*[.!?]\\\\s*)`, 'i'), '');\ncleanOutput = cleanOutput.replace(new RegExp(`^\\\\s*(${keywordPattern}).*?(\\\\n|\\\\.|$)`, 'i'), '');\ncleanOutput = cleanOutput.replace(/^\\s*(Berdasarkan|Menurut|Dari)\\s+(data|faq|sheet|referensi)[^.!?]*[.!?]\\s*/i, '');\nif (!cleanOutput.trim() && preInternalStrip.trim()) cleanOutput = preInternalStrip;\ncleanOutput = cleanOutput.trim();\n\n// clean markdown (mask url dulu)\nconst urlRegex = /https?:\\/\\/[^\\s)]+/g;\nconst maskedUrls = [];\ncleanOutput = cleanOutput.replace(urlRegex, (m) => { maskedUrls.push(m); return `\\x00URL${maskedUrls.length - 1}\\x00`; });\ncleanOutput = cleanOutput\n  .replace(/\\*\\*([^*]+)\\*\\*/g, '$1').replace(/\\*([^*]+)\\*/g, '$1').replace(/_([^_]+)_/g, '$1')\n  .replace(/~~([^~]+)~~/g, '$1').replace(/`([^`]+)`/g, '$1').replace(/[\\*_~`]/g, '');\ncleanOutput = cleanOutput\n  .replace(/(\\d)\\s*[—–]\\s*(\\d)/g, '$1-$2').replace(/\\s*[—–]\\s*/g, ', ').replace(/\\s*;\\s*/g, ', ')\n  .replace(/\\s{2,}/g, ' ').replace(/\\s+([,.])/g, '$1').replace(/,\\s*,/g, ',').trim();\ncleanOutput = cleanOutput.replace(/\\x00URL(\\d+)\\x00/g, (_, idx) => maskedUrls[parseInt(idx)]);\ncleanOutput = cleanOutput.replace(/(^|\\n)([a-z])/g, (m, p1, p2) => p1 + p2.toUpperCase());\n\nif (!cleanOutput || cleanOutput.trim() === '') {\n  cleanOutput = isUnknown\n    ? 'Maaf yaa, untuk yang ini saya belum ada infonya. Nanti saya cek dulu dan kabari lagi yaa.'\n    : 'Maaf, ada kendala sebentar. Boleh diketik ulang yaa.';\n}\n\n// ── FAIL LOUD: tag survey ditolak -> JANGAN kirim konfirmasi palsu ──\n// Setiap tag yang ditolak sistem harus MENGUBAH balasan, bukan cuma dibuang.\nif (isSurveyIncomplete) {\n  const tglOk = svTgl && !missingSlots.includes('tanggal');\n  const jamOk = svJam && !missingSlots.includes('jam');\n  if (missingSlots.includes('tanggal') && missingSlots.includes('jam')) {\n    cleanOutput = `Boleh Kak, survey-nya enaknya kapan yaa? Misal ${contohTanggal} jam 10 pagi.`;\n  } else if (missingSlots.includes('tanggal')) {\n    cleanOutput = `Baik Kak, jam ${svJam} noted. Mau tanggal berapa yaa? Misal ${contohTanggal}.`;\n  } else if (missingSlots.includes('jam')) {\n    cleanOutput = `Baik Kak, untuk ${tglDisplay(svTgl)}. Jam berapa enaknya? Kami buka jam ${pad(openH)}.00 sampai ${pad(closeH)}.00 yaa.`;\n  } else if (missingSlots.includes('unit')) {\n    cleanOutput = `Baik Kak, untuk ${tglOk ? tglDisplay(svTgl) : 'jadwal itu'}${jamOk ? ' jam ' + svJam : ''}. Kira-kira mau lihat tipe unit yang mana yaa?`;\n  } else if (/lewat|tahun/.test(surveyRejectReason)) {\n    cleanOutput = `Boleh dikonfirmasi lagi tanggalnya Kak? Kalau ${contohTanggal} jam 10 pagi gimana?`;\n  } else if (/tutup/.test(surveyRejectReason)) {\n    cleanOutput = `Maaf Kak, di hari itu kami tutup. Boleh pilih hari lain? Misal ${contohTanggal} yaa.`;\n  } else if (/jam operasional|jam tidak/.test(surveyRejectReason)) {\n    cleanOutput = `Untuk jam segitu kami belum buka Kak. Survey bisa jam ${pad(openH)}.00 sampai ${pad(closeH)}.00 yaa, enaknya jam berapa?`;\n  } else {\n    cleanOutput = `Boleh dikonfirmasi lagi tanggal dan jamnya Kak? Misal ${contohTanggal} jam 10 pagi.`;\n  }\n  // survey belum jadi -> jangan biarkan aksi lain nyangkut di balasan yang sudah diganti\n  isSendMedia = false;\n  mediaKey = '';\n}\n\n// ── REQUEST_CALL: sisipkan admin_phone_display ──\nif (isRequestCall) {\n  const disp = (cfg.admin_phone_display) || '';\n  if (disp && !cleanOutput.includes(disp)) cleanOutput = `${cleanOutput}\\n\\nBisa langsung telepon/WA ke ${disp} yaa.`;\n}\n\n// ── RESOLVE MEDIA URL + caption dari LINKS ──\n// CHANGELOG 2026-07-18 (disambiguasi media, planning §Langkah 3):\n//   Dulu: exact match -> substring .find() (ambil match PERTAMA) -> asal kirim baris teratas.\n//   Sekarang: exact match tetap kirim; kalau exact gagal, kumpulkan SEMUA kandidat aktif\n//   (substring Nama Link + kolom Keyword, lalu dipersempit kolom Tipe Unit bila key\n//   mengandung pola tipe), dedup by URL, dan:\n//     1 kandidat unik  -> kirim (seperti dulu)\n//     >1 kandidat unik -> isMediaAmbiguous: override cleanOutput dengan pertanyaan pilihan\n//                         (pola gate SURVEY — tag ditolak = balasan berubah), TIDAK kirim media,\n//                         TIDAK notif tim (isSendMedia=false, isMediaManual=false)\n//     0 kandidat       -> isMediaManual=true (jalur eskalasi existing, TIDAK berubah)\n//   Field baru di return: isMediaAmbiguous, mediaCandidates. Field lama tidak diubah.\n//   Konvensi: pakai $('Read LINKS Data').all() (Run Once for All Items), bukan .item.\n// CHANGELOG 2026-07-22 (maps/website salah masuk jalur download+attach):\n//   Row LINKS Tipe 'location'/'website' (mis. key \"maps\", \"website\") BUKAN file, cuma\n//   URL. resolveRow() sekarang cek Tipe: kalau location/website -> JANGAN isi\n//   mediaUrl/mediaCaption (supaya IF Send Media tidak trigger Download Media/Send Media\n//   Kirimi), tempel URL-nya langsung sebagai teks ke cleanOutput, isSendMedia=false.\nlet mediaUrl = '', mediaCaption = '';\nlet isMediaManual = false, mediaRequestSummary = '';\nlet isMediaAmbiguous = false, mediaCandidates = [];\nif (isSendMedia) {\n  let linkRows = [];\n  try { linkRows = $('Read LINKS Data').all().map(i => i.json); } catch (e) {}\n  const norm = s => String(s || '').toLowerCase().replace(/\\s+/g, ' ').trim();\n  const digitsOf = s => String(s || '').replace(/\\D/g, '');\n  const active = linkRows.filter(r => /^\\s*(aktif|active|on|ya)\\s*$/i.test(String(r['Status'] || '')));\n\n  const resolveRow = (row) => {\n    const tipeRow = norm(row['Tipe']);\n    if (tipeRow === 'location' || tipeRow === 'website') {\n      // Bukan file media, cuma URL -> jangan lewat Download Media/Send Media Kirimi.\n      // Tempel sebagai teks biasa ke balasan yang sudah ada.\n      isSendMedia = false;\n      const url = String(row['URL'] || '').trim();\n      const label = String(row['Caption'] || row['Deskripsi'] || '').trim();\n      if (url) {\n        const line = label ? `${label} ${url}` : url;\n        cleanOutput = cleanOutput.trim() ? `${cleanOutput}\\n\\n${line}` : line;\n      }\n      return;\n    }\n    mediaUrl = String(row['URL'] || '').trim();\n    mediaCaption = String(row['Caption'] || row['Deskripsi'] || '').trim() || 'Ini file yang diminta yaa.';\n  };\n\n  // 1) EXACT match Nama Link == key -> kirim (perilaku existing dipertahankan)\n  const exactRow = active.find(r => norm(r['Nama Link']) === mediaKey);\n  if (exactRow && String(exactRow['URL'] || '').trim()) {\n    resolveRow(exactRow);\n  } else {\n    // 2) FALLBACK: kumpulkan SEMUA kandidat aktif (Array.filter, bukan .find).\n    //   (0) saring pool per jenis media (foto->image / video->video),\n    //   (a) substring Nama Link + (b) Keyword (cocok PER-TOKEN),\n    //   (c) persempit kolom Tipe Unit bila key mengandung pola tipe (3672/3681/3060).\n    //   QUALIFIER GATE: kalau key punya kata pembeda yang TIDAK ada di kandidat mana pun\n    //   (mis. \"foto-interior\" -> \"interior\" tak ada di katalog) -> kandidat dikosongkan\n    //   supaya jatuh ke eskalasi manual, bukan salah tanya tipe.\n    const tokensOf = s => norm(s).split(/[^a-z0-9]+/i).filter(Boolean);\n    const GENERIC = new Set(['foto','gambar','photo','potret','video','klip','movie','denah','siteplan','brosur','katalog','price','pricelist','list','unit','rumah','tipe','type','file','media','minta','contoh']);\n    const keyTokens = tokensOf(mediaKey);\n    const keyDigits = digitsOf(mediaKey);            // \"foto-36-72\" -> \"3672\", \"foto\" -> \"\"\n    const hasTypePattern = keyDigits.length >= 4;    // tipe PCR = 4 digit\n    const qualifiers = keyTokens.filter(t => !GENERIC.has(t) && !/^\\d+$/.test(t) && t.length >= 3);\n\n    // jenis media yang diminta -> saring pool lewat kolom Tipe (image/video/document)\n    let wantTipe = null;\n    if (/\\bvideo\\b|klip|movie/.test(mediaKey)) wantTipe = 'video';\n    else if (/foto|gambar|photo|potret|denah|siteplan|brosur|katalog|price/.test(mediaKey)) wantTipe = 'image';\n    let pool = active;\n    if (wantTipe) { const p = active.filter(r => norm(r['Tipe']) === wantTipe); if (p.length) pool = p; }\n\n    const rowBag = (r) => [...tokensOf(r['Keyword']), ...tokensOf(r['Nama Link'])];\n    const nameMatch = (r) => { const nl = norm(r['Nama Link']); return !!nl && (nl.includes(mediaKey) || mediaKey.includes(nl)); };\n    const keywordMatch = (r) => tokensOf(r['Keyword']).some(kw => keyTokens.includes(kw));\n    const typeUnitMatch = (r) => { const tuD = digitsOf(r['Tipe Unit']); return tuD.length >= 4 && (keyDigits === tuD || keyDigits.includes(tuD)); };\n\n    // (a) substring Nama Link + (b) Keyword per-token + (c) Tipe Unit\n    let candidates = pool.filter(r => nameMatch(r) || keywordMatch(r) || typeUnitMatch(r));\n    // QUALIFIER GATE: kandidat wajib memenuhi minimal satu kata pembeda yang diminta\n    if (qualifiers.length) {\n      candidates = candidates.filter(r => { const bag = rowBag(r); return qualifiers.some(q => bag.includes(q)); });\n    }\n    // (c) Tipe Unit: bila key mengandung pola tipe, PERSEMPIT ke tipe itu\n    if (hasTypePattern) {\n      const typedIn = candidates.filter(typeUnitMatch);\n      if (typedIn.length) candidates = typedIn;\n    }\n\n    // dedup by URL — baris beda tipe tapi URL sama (video 36/72 & 36/81) = 1 kandidat.\n    // Simpan tipe unit yang ter-group per URL untuk menyusun pertanyaan pilihan.\n    const byUrl = new Map();\n    for (const r of candidates) {\n      const u = String(r['URL'] || '').trim();\n      if (!u) continue;\n      if (!byUrl.has(u)) byUrl.set(u, { row: r, tipes: [] });\n      const g = byUrl.get(u);\n      const tu = String(r['Tipe Unit'] || '').trim();\n      if (tu && !g.tipes.includes(tu)) g.tipes.push(tu);\n    }\n    const unique = [...byUrl.values()];\n\n    if (unique.length === 1) {\n      // 1 kandidat unik (termasuk kasus \"semua kandidat share 1 URL\") -> kirim\n      resolveRow(unique[0].row);\n    } else if (unique.length > 1) {\n      // >1 kandidat unik -> AMBIGU: sistem yang bertanya, media TIDAK dikirim, tim TIDAK dinotif\n      isMediaAmbiguous = true;\n      isSendMedia = false;\n      isMediaManual = false;\n      mediaUrl = '';\n      mediaCaption = '';\n\n      mediaCandidates = unique.map(g => ({\n        key: String(g.row['Nama Link'] || '').trim(),\n        tipeUnit: g.tipes.join(' / ')\n      }));\n\n      // label human-readable per kandidat, mis. \"tipe 36/72\", \"tipe 30/60 subsidi\"\n      const labelFor = (g) => {\n        const nl = norm(g.row['Nama Link']);\n        const kw = norm(g.row['Keyword']);\n        const isSub = /subsidi/.test(nl) || /subsidi/.test(kw) || g.tipes.includes('30/60');\n        const tp = g.tipes.length ? g.tipes.join(', ') : String(g.row['Tipe Unit'] || '').trim();\n        if (!tp) return nl;\n        return 'tipe ' + tp + (isSub ? ' subsidi' : '');\n      };\n      // kata benda media (foto/video) — dari Tipe kandidat atau dari key\n      const isVideo = /video/.test(mediaKey) || unique.every(g => /video/i.test(String(g.row['Tipe'] || '')));\n      const noun = isVideo ? 'video' : 'foto';\n\n      const opts = unique.map(labelFor);\n      let optText;\n      if (opts.length <= 1) optText = opts.join('');\n      else if (opts.length === 2) optText = `${opts[0]} atau ${opts[1]}`;\n      else optText = `${opts.slice(0, -1).join(', ')}, atau ${opts[opts.length - 1]}`;\n\n      // OVERRIDE balasan (pola gate SURVEY). Satu pertanyaan saja, gaya konsisten bot.\n      cleanOutput = `Boleh Kak 😊 Mau ${noun} unit tipe yang mana yaa, ${optText}?`;\n      console.log('SEND_MEDIA ambigu, tanya balik:', JSON.stringify(mediaCandidates));\n    } else {\n      // 0 kandidat -> fallback NOTIFIKASI MANUAL ke tim telemarketer (jalur existing)\n      console.warn('SEND_MEDIA key tidak ada di LINKS, fallback manual:', mediaKey);\n      isSendMedia = false;\n      isMediaManual = true;\n      const userMsg = (preprocess && preprocess.actualUserMessage) || originalMessage || '';\n      mediaRequestSummary = (mediaKey ? ('key=\"' + mediaKey + '\" ') : '') + (userMsg ? ('| pesan user: ' + String(userMsg).slice(0, 300)) : '');\n    }\n  }\n}\n// ── #3: MEDIA KE-2 (foto + video dalam satu balasan) ──\n// Kirim media kedua HANYA jika media-1 sukses (bukan ambigu/manual/location) DAN ada tag\n// kedua dengan KEY KANONIK yang exact-match di LINKS. Kalau tidak memenuhi -> dilewati\n// diam-diam (tidak tanya balik, tidak notif). Jalur media-1 di atas tidak diubah.\nlet isSendMedia2 = false, mediaUrl2 = '', mediaCaption2 = '';\nif (isSendMedia && mediaUrl && !isMediaAmbiguous && mediaKeysAll.length >= 2) {\n  let linkRows2 = [];\n  try { linkRows2 = $('Read LINKS Data').all().map(i => i.json); } catch (e) {}\n  const norm2 = s => String(s || '').toLowerCase().replace(/\\s+/g, ' ').trim();\n  const active2 = linkRows2.filter(r => /^\\s*(aktif|active|on|ya)\\s*$/i.test(String(r['Status'] || '')));\n  const key2 = mediaKeysAll.find(k => k && k !== mediaKey) || '';\n  const row2 = key2 ? active2.find(r => norm2(r['Nama Link']) === key2) : null;\n  if (row2) {\n    const tipe2 = norm2(row2['Tipe']);\n    const url2 = String(row2['URL'] || '').trim();\n    if (url2 && url2 !== mediaUrl && tipe2 !== 'location' && tipe2 !== 'website') {\n      isSendMedia2 = true;\n      mediaUrl2 = url2;\n      mediaCaption2 = String(row2['Caption'] || row2['Deskripsi'] || '').trim() || 'Ini file berikutnya yaa.';\n      // urutan foto -> video: kalau media-1 video & media-2 image, tukar posisi.\n      const row1 = active2.find(r => norm2(r['Nama Link']) === mediaKey);\n      const tipe1 = row1 ? norm2(row1['Tipe']) : '';\n      if (tipe1 === 'video' && tipe2 === 'image') {\n        const tU = mediaUrl, tC = mediaCaption;\n        mediaUrl = mediaUrl2; mediaCaption = mediaCaption2;\n        mediaUrl2 = tU; mediaCaption2 = tC;\n      }\n    }\n  }\n}\n\n// ── NOTIF ADMIN: hanya untuk survey reject kategori AI-FAULT ──\n// Kasus normal (slot belum lengkap / di luar jam operasional / hari tutup) TIDAK dinotif,\n// supaya admin tidak banjir alarm dari perilaku yang memang benar. Hanya kegagalan\n// prompt (halusinasi tanggal/jam/tahun, format tag salah) yang di-flag.\nconst AI_FAULT_REASONS = ['tanggal tidak terbaca', 'jam tidak terbaca', 'jam tidak valid', 'tahun tidak valid', 'tanggal/jam sudah lewat'];\nconst surveyNeedsAdminAlert = isSurveyIncomplete && AI_FAULT_REASONS.some(r => surveyRejectReason.includes(r));\n\n// register #1: slot yang dipersist ke STATS.\n// Survey sukses tercatat -> kosongkan. Selain itu bawa maju slot terbaru (tag menang, pending cadangan).\nconst pendTglOut = svTgl || pendingSv.tanggal || '';\nconst pendJamOut = svJam || pendingSv.jam || '';\nconst pendUnitOut = svUnit || pendingSv.unit || '';\nconst surveyPendingWrite = (isScheduleSurvey || svHallucinated || !(pendTglOut || pendJamOut || pendUnitOut))\n  ? { tanggal: '', jam: '', unit: '', ts: '' }\n  : { tanggal: pendTglOut, jam: pendJamOut, unit: pendUnitOut, ts: Math.floor(Date.now() / 1000) };\n\nreturn [{\n  json: {\n    ...chatCounter, ...preprocess, ...item.json,\n    cleanOutput,\n    isScheduleSurvey, surveyData,\n    isSurveyIncomplete, missingSlots, surveyRejectReason,\n    surveyNeedsAdminAlert,\n    surveyPendingWrite,\n    aiOutputRaw: aiOutput,\n    isRequestCall,\n    isTalkToAdmin,\n    isSendMedia, mediaUrl, mediaCaption, mediaKey,\n    isSendMedia2, mediaUrl2, mediaCaption2,\n    isMediaManual, mediaRequestSummary,\n    isMediaAmbiguous, mediaCandidates,\n    isUnknown,\n    needs_unknown: isUnknown ? 'true' : 'false',\n    original_message: originalMessage,\n    is_new_user: isNewUser,\n    unit_interest_merged: unitMerged,\n    budget_range_merged: budgetMerged,\n    unit_changed: unitChanged,\n    budget_changed: budgetChanged,\n    nama_lengkap_merged: namaMerged,\n    lokasi_kerja_merged: lokasiKerjaMerged,\n    nama_changed: namaChanged,\n    lokasi_kerja_changed: lokasiKerjaChanged\n  }\n}];", "PCRv21 :: Format Media Notif": "// FORMAT MEDIA NOTIF — notifikasi manual ke tim telemarketer (Aar & Aqsa).\n// Dipakai saat user minta gambar/video/brosur TAPI file belum ada di katalog\n// LINKS (native send tak bisa). Tim kirim file-nya manual ke user.\n// Mengembalikan 1 item per nomor tim (loop kirim di Notify Media Team).\nconst pa = $('Process All').first().json;\nconst cc = $('Chat Counter').first().json;\nconst key = $('Resolve User Row').first().json.resolved_key || cc.user_wa || '';\nconst nama = cc.user_name || '';\nconst mediaKey = pa.mediaKey || '';\nconst summary = pa.mediaRequestSummary || '';\n\nconst message = `📸 [PCR] PERMINTAAN MEDIA - KIRIM MANUAL\nUser: ${key}\nNama: ${nama || '(belum ada nama)'}\nDiminta: ${mediaKey || 'foto/video'}\nDetail: ${summary || '(tidak ada detail)'}\n\nUser menunggu file dikirim. Balas langsung ke user yaa.\nChat: wa.me/${String(key).replace(/\\D/g, '')}`;\n\nconst cfg = $('Parse Config').first().json.config;\nlet tujuan = Array.isArray(cfg.media_team_phone) ? cfg.media_team_phone : [cfg.media_team_phone];\ntujuan = (tujuan || []).filter(Boolean);\nif (!tujuan.length) { console.warn('media_team_phone kosong — tidak ada tujuan notif media manual.'); return []; }\n\nreturn tujuan.map(no => ({ json: { phone: String(no), message } }));\n", "PCRv21 :: Collect Handover Context": "// COLLECT HANDOVER CONTEXT — STATS (fakta persisten) + MSG_BUFFER (transkrip sesi).\nconst digits = v => String(v ?? '').replace(/\\D/g, '');\nconst key = $('Resolve User Row').first().json.resolved_key;\n\nlet statsRow = {};\ntry { statsRow = $('Read User STATS').all().map(i => i.json).find(r => digits(r['No WA']) === digits(key)) || {}; } catch (e) {}\n\nlet transcript = '';\ntry {\n  const buf = $('Read MSG_BUFFER').all().map(i => i.json)\n    .filter(r => digits(r['no_wa']) === digits(key))\n    .sort((a, b) => Number(a.ts) - Number(b.ts));\n  transcript = buf.map(r => `User: ${r.message}`).join('\\n');\n} catch (e) {}\n\nconst pa = $('Process All').first().json;\nconst sd = pa.surveyData || {};\nconst profil = {\n  // PRIORITAS: [FACTS] turn ini > nama_lengkap tersimpan > push name WA.\n  // JANGAN pakai statsRow['Nama'] duluan — itu nama akun WhatsApp, bukan nama\n  // yang user sebutkan. (Bug 2026-07-20: user bilang \"Hera\", handover kirim\n  // \"Steven Leroy\" karena kolom 'Nama' selalu terisi push name.)\n  nama: pa.nama_lengkap_merged || statsRow['nama_lengkap'] || statsRow['Nama'] || $('Chat Counter').first().json.user_name || '',\n  // Simpan push name terpisah: kalau beda dengan nama asli, itu info berguna\n  // untuk tim lapangan (mis. yang chat istri, akun WA atas nama suami).\n  nama_akun_wa: statsRow['Nama'] || $('Chat Counter').first().json.user_name || '',\n  lokasi_kerja: pa.lokasi_kerja_merged || statsRow['lokasi_kerja'] || '',\n  no_wa: key,\n  pesan_pertama: statsRow['Pesan Pertama'] || '',\n  unit_interest: pa.unit_interest_merged || statsRow['unit_interest'] || '',\n  budget_range: pa.budget_range_merged || statsRow['budget_range'] || '',\n  survey: [sd.tanggal, sd.jam, 'SCHEDULED'].filter(Boolean).join(' '),\n  lead_source: $('Detect Lead Source').first().json.lead_source_final || statsRow['lead_source'] || '',\n  jumlah_chat: statsRow['Counter'] || '',\n};\n\nreturn [{ json: {\n  handover_profil: profil,\n  handover_transcript: transcript || '(transkrip sesi tidak tersedia)',\n  handover_trigger: 'DELEGATION'\n}}];\n", "PCRv21 :: Format Handover Message": "// FORMAT HANDOVER MESSAGE — bungkus ringkasan LLM (atau fallback deterministik).\n\n// Sanitizer: buang sisa markdown dari output LLM. Prompt sudah minta plain text,\n// tapi LLM masih sering bocor bold (**...** / *...*) — WA tidak butuh formatting,\n// dan bintang yang tertinggal bikin pesan tim lapangan terlihat kotor.\n// Underscore sengaja TIDAK dihapus: berisiko kena nama kolom (unit_interest, dll).\nconst stripMd = s => String(s || '')\n  .replace(/\\*/g, '')             // ** dan *\n  .replace(/`/g, '')              // backtick\n  .replace(/^#{1,6}\\s*/gm, '')    // heading markdown\n  .replace(/[ \\t]+$/gm, '')       // trailing space\n  .replace(/\\n{3,}/g, '\\n\\n')     // rapikan blank line beruntun\n  .trim();\n\nlet summary = '';\ntry { const s = $('Summarize Handover').first().json; summary = (s.content && s.content[0] && s.content[0].text) || s.text || ''; } catch (e) {}\nsummary = stripMd(summary);\n\nconst ctx = $('Collect Handover Context').first().json;\nconst p = ctx.handover_profil || {};\nconst trigger = ctx.handover_trigger || 'DELEGATION';\n\nif (!summary || !summary.trim()) {\n  summary = `PROFIL KLIEN: ${p.nama || '-'}${p.lokasi_kerja ? ', ' + p.lokasi_kerja : ''}, ${p.no_wa || '-'}, sumber ${p.lead_source || 'belum diketahui'}\nTIPE UNIT DIMINATI: ${p.unit_interest || 'belum diketahui'}\nBUDGET/KPR: ${p.budget_range || 'belum dibahas'}\nSTATUS SURVEY: ${p.survey || 'belum dijadwalkan'}`;\n}\n\nconst header = {\n  DELEGATION: '🏠 [PCR] SURVEY BARU — HANDOVER KE TIM LAPANGAN',\n  HITL: '🙋 [PCR] AMBIL ALIH CHAT',\n  CALL: '📞 [PCR] MINTA DITELEPON',\n}[trigger] || '📋 [PCR] HANDOVER';\n\nconst message = `${header}\n\n${summary}\n\n— Chat: wa.me/${p.no_wa}`;\n\nconst cfg = $('Parse Config').first().json.config;\nlet tujuan = (trigger === 'DELEGATION')\n  ? (Array.isArray(cfg.field_team_phone) ? cfg.field_team_phone : [cfg.field_team_phone])\n  : [cfg.admin_phone];\ntujuan = (tujuan || []).filter(Boolean);\nif (!tujuan.length) { console.warn('Tidak ada nomor tujuan handover (field_team_phone kosong).'); return []; }\n\nreturn tujuan.map(no => ({ json: { phone: String(no), message } }));", "PCRv21 :: Send WA + Verify (Kirimi)": "// ============================================================\n// Send WA + Verify (Kirimi)\n// Gabungan node lama: \"Reply Chat Kirimi\" (HTTP Request) + \"Check API Response\" (Code).\n//\n// KENAPA DIGABUNG:\n// n8n me-retry MULAI DARI node yang gagal (runData node sebelumnya dipertahankan).\n// Kalau validasi berdiri sendiri sebagai node terpisah, klik Retry hanya mengulang\n// validasi dengan respons Kirimi yang lama -> throw lagi -> WA tidak pernah\n// terkirim ulang. Dengan digabung, satu klik Retry benar-benar mengirim ulang.\n//\n// On Error = Stop Workflow (sengaja, jangan diubah): supaya execution jadi merah,\n// Error Notifier jalan, dan execution bisa di-retry dari mobile dashboard.\n//\n// Retry HTTP ditangani DI DALAM kode ini (3x, jeda 5 detik) supaya persis meniru\n// perilaku lama node \"Reply Chat Kirimi\" (retryOnFail: true, waitBetweenTries: 5000).\n// Retry TIDAK berlaku untuk kegagalan \"HTTP 200 tapi status:false\" -- sama seperti\n// node \"Check API Response\" lama yang tidak punya retryOnFail. Ini disengaja:\n// respons status:false berarti Kirimi sudah memproses permintaan, jadi mengirim\n// ulang otomatis berisiko pesan dobel. Kirim ulang untuk kasus itu = keputusan\n// manusia, lewat tombol Retry.\n// ============================================================\n\nconst KIRIMI_URL = 'https://api.kirimi.id/v1/send-message';\nconst TIMEOUT_MS = 60000;\nconst MAX_HTTP_ATTEMPTS = 3;\nconst WAIT_MS = 5000;\n\nconst sleep = (ms) => new Promise((resolve) => {\n  if (typeof setTimeout === 'function') { setTimeout(resolve, ms); } else { resolve(); }\n});\n\n// --- kredensial: dari sheet CONFIG, sama persis dengan node HTTP lama ---\nconst _cfgAll = $('Parse Config').first().json.config || {};\nconst cfg = {\n  user_code: _cfgAll.kirimi_user_code,\n  secret: _cfgAll.kirimi_secret,\n  device_id: _cfgAll.kirimi_device_id,\n};\n\nconst phone = $('Chat Counter').first().json.user_wa;\nconst message = $('Process All').first().json.cleanOutput;\n\nif (!phone) {\n  throw new Error('Kirimi: nomor tujuan kosong (Chat Counter.user_wa)');\n}\nif (message === undefined || message === null || String(message).trim() === '') {\n  throw new Error('Kirimi: pesan kosong (Process All.cleanOutput)');\n}\nif (!cfg.user_code || !cfg.secret || !cfg.device_id) {\n  throw new Error('Kirimi: kredensial tidak lengkap (user_code/secret/device_id)');\n}\n\n// ---- 1) KIRIM (dengan retry khusus kegagalan HTTP) ----\nlet responseData = null;\nlet lastErr = null;\n\nfor (let attempt = 1; attempt <= MAX_HTTP_ATTEMPTS; attempt++) {\n  try {\n    responseData = await this.helpers.httpRequest({\n      method: 'POST',\n      url: KIRIMI_URL,\n      body: {\n        user_code: cfg.user_code,\n        secret: cfg.secret,\n        device_id: cfg.device_id,\n        phone: phone,\n        message: message,\n      },\n      json: true,\n      timeout: TIMEOUT_MS,\n    });\n    lastErr = null;\n    break;\n  } catch (e) {\n    lastErr = e;\n    console.log('Kirimi HTTP gagal (percobaan ' + attempt + '/' + MAX_HTTP_ATTEMPTS + '): ' + (e && e.message ? e.message : String(e)));\n    if (attempt < MAX_HTTP_ATTEMPTS) { await sleep(WAIT_MS); }\n  }\n}\n\nif (lastErr) {\n  throw new Error('Kirimi HTTP gagal setelah ' + MAX_HTTP_ATTEMPTS + ' percobaan: ' + (lastErr && lastErr.message ? lastErr.message : String(lastErr)));\n}\n\n// ---- 2) VERIFIKASI ISI RESPONS (logika lama \"Check API Response\") ----\nconst rd = (responseData && typeof responseData === 'object') ? responseData : {};\nconst explicitFail = rd.success === false || rd.status === false;\nconst isSuccess = !explicitFail && (\n  rd.status === true ||\n  rd.success === true ||\n  (rd.data && rd.data.id) ||\n  (rd.message && rd.message !== 'error')\n);\n\nif (!isSuccess) {\n  throw new Error('Kirimi API gagal (HTTP 200 tapi respons menolak): ' + JSON.stringify(responseData));\n}\n\nconsole.log('Kirimi sukses:', JSON.stringify(responseData));\nreturn [{ json: rd }];\n", "PCRv21 :: Extract & Prepare Data": "const chatCounter = $('Chat Counter').first().json;\n\n// DATA LANGSUNG DARI CHAT COUNTER NODE\nconst userNumber = chatCounter.user_wa;\nconst userName = chatCounter.user_name;\nconst userMessage = chatCounter.stats_message || chatCounter.original_message;   // [V2] '[gambar]' kalau kiriman tanpa teks\n\n// VALIDASI SEDERHANA\nif (!userNumber) {\n  throw new Error(\"user_wa tidak ditemukan di input!\");\n}\n\nconsole.log(\"✅ Data berhasil di-extract:\");\nconsole.log(\"- No WA:\", userNumber);\nconsole.log(\"- Nama:\", userName);\nconsole.log(\"- Pesan:\", userMessage);\n\nreturn [{\n  json: {\n    search_no_wa: userNumber,\n    user_name: userName,\n    user_message: userMessage,\n    timestamp: chatCounter.formatted_date + ' ' + chatCounter.formatted_time + ' WIB',\n    source: \"chat_counter_node\",\n    is_valid: userNumber !== \"unknown\"\n  }\n}];", "PCRv21 :: Process Counter & Merge Data": "// ====================================================================\n// PROCESS COUNTER & MERGE DATA (V4)\n// Fix: (1) matching row No WA primer / lid backup (bukan lid-only),\n//      (2) \"Tanggal Chat Pertama\" dibaca dari kolom yang benar\n//          (dulu baca existingRow.Tanggal yang tidak ada -> tanggal\n//          pertama ter-reset jadi hari ini setiap pesan),\n//      (3) error -> stop (return []) alih-alih menulis row \"ERROR\".\n// ====================================================================\nconst debugLog = [];\n\ntry {\n    const allItems = $input.all();\n    debugLog.push(\"Step 1: Received \" + allItems.length + \" items from Read STATS\");\n\n    const chatCounter = $('Chat Counter').first().json;\n    const resolve = $('Resolve User Row').first().json;\n    const resolvedKey = resolve.resolved_key;\n\n    const userName = chatCounter.user_name || \"User\";\n    const userMessage = chatCounter.stats_message || chatCounter.original_message || \"\";  // [V2] label media kalau teks kosong\n    const digits = v => String(v ?? '').replace(/\\D/g, '');\n    const phone = digits(chatCounter.user_phone);\n    const lid = digits(chatCounter.user_lid);\n\n    if (!resolvedKey) {\n        console.warn(\"resolved_key kosong - skip update STATS\");\n        return [];\n    }\n\n    // Process sheet rows\n    const sheetRows = allItems\n        .filter(item => {\n            const data = item?.json || item;\n            if (!data || Object.keys(data).length === 0) return false;\n            return !!(data['lid'] || data['No WA'] || data.no_wa || data.NoWA);\n        })\n        .map(item => item?.json || item);\n\n    debugLog.push(\"Step 2: Sheet rows found: \" + sheetRows.length);\n\n    // Find existing row: No WA primer, lid backup (konsisten dgn Resolve User Row)\n    let existingRow = null;\n    if (phone) existingRow = sheetRows.find(r => digits(r['No WA']) === phone) || null;\n    if (!existingRow && lid) {\n        existingRow = sheetRows.find(r => digits(r['lid']) === lid)\n                   || sheetRows.find(r => digits(r['No WA']) === lid)\n                   || null;\n    }\n\n    const isNewUser = !existingRow;\n    debugLog.push(\"Step 3: \" + (isNewUser ? \"NEW USER\" : \"EXISTING USER\"));\n\n    let counter, pesanPertama, tanggalPertama, intensitasChat;\n\n    if (existingRow) {\n        counter = parseInt(existingRow.Counter || existingRow.counter || 0) + 1;\n        intensitasChat = parseInt(existingRow['Intensitas Chat'] || existingRow.intensitas_chat || 0) + 1;\n\n        const pesanLama = existingRow['Pesan Pertama'] || existingRow.pesan_pertama;\n        pesanPertama = (pesanLama && String(pesanLama).trim() !== '') ? pesanLama : userMessage;\n\n        // V4 FIX: baca kolom yang benar\n        const tglLama = existingRow['Tanggal Chat Pertama'];\n        tanggalPertama = (tglLama && String(tglLama).trim() !== '') ? tglLama : null;\n    } else {\n        counter = 1;\n        intensitasChat = 1;\n        pesanPertama = userMessage;\n        tanggalPertama = null;\n    }\n\n    if (!tanggalPertama) {\n        tanggalPertama = new Date().toLocaleDateString('en-GB', {\n            timeZone: 'Asia/Jakarta', day: '2-digit', month: '2-digit', year: 'numeric'\n        });\n    }\n\n    const outputData = {\n        \"No WA\": resolvedKey,\n        \"lid\": lid,\n        \"Tanggal\": tanggalPertama,\n        \"TanggalSekarang\": new Date().toLocaleDateString('en-GB', {\n            timeZone: 'Asia/Jakarta', day: '2-digit', month: '2-digit', year: 'numeric'\n        }),\n        \"Nama\": userName,\n        \"Pesan Pertama\": pesanPertama,\n        \"Counter\": counter,\n        \"Intensitas Chat\": intensitasChat\n    };\n\n    return [{ json: outputData }];\n\n} catch (error) {\n    // V4 FIX: jangan menulis row \"ERROR\" ke sheet - cukup log & stop.\n    console.error(\"Process Counter ERROR: \" + error.message, debugLog);\n    return [];\n}\n", "PCRv21 :: Update STATS - Greeting Flag": "// ====================================================================\n// UPDATE GREETING FLAG (V4 - disederhanakan)\n// Dulu: pattern-matching teks balasan (rapuh, tergantung susunan\n// kalimat). Sekarang: cukup dari flag is_new_user — kalau eksekusi\n// ini mengirim intro ke user baru (reply sudah SUKSES terkirim\n// karena node ini jalan setelah Reply Chat Kirimi), tandai Y.\n// ====================================================================\nconst isNewUser = $('Cek_user_status').first().json.is_new_user === true;\n\nif (isNewUser) {\n  console.log('📝 [GREETING] intro terkirim ke user baru -> greeting_sent = Y');\n}\n\nreturn [{\n  json: {\n    update_needed: isNewUser ? 'true' : 'false',\n    greeting_sent: 'Y'\n  }\n}];\n", "PCRv21 :: Siapkan Vision Request": "// NODE: Siapkan Vision Request   [BARU - V2 VISION]\n// ====================================================================\n// Rakit body Anthropic Messages API untuk membaca gambar user.\n// Semua gambar dalam satu window debounce dikirim dalam SATU request\n// (lebih murah + model bisa membandingkan antar gambar).\n// Sumber gambar = URL (source.type \"url\") -> Anthropic yang fetch.\n//   Kalau URL Kirimi ternyata TIDAK publik, ganti blok image jadi base64:\n//   { type:'image', source:{ type:'base64', media_type:'image/jpeg', data:<b64> } }\n//   dan tambahkan node Download (HTTP Request, responseFormat=file) sebelum ini.\n// ====================================================================\nconst base = $('Cek_user_status').first().json;\nconst cfg = (() => { try { return $('Parse Config').first().json.config || {}; } catch (e) { return {}; } })();\n\nconst imgs = Array.isArray(base.vision_images) ? base.vision_images : [];\nconst maxImg = Math.max(1, Number(cfg.vision_max_images ?? 3) || 3);\nconst picked = imgs.slice(-maxImg).filter(im => im && im.url);\n\nif (!picked.length) {\n  // Harusnya tidak terjadi (IF Ada Gambar sudah menyaring), tapi jangan\n  // sampai node ini mengirim request kosong ke Anthropic.\n  return [{ json: { vision_body: null, vision_image_count: 0, vision_skip: true } }];\n}\n\nconst caption = String(base.user_message_final || '').trim();\n\nconst SYSTEM = [\n  'Kamu asisten vision untuk Vira, chatbot WhatsApp perumahan Persada Cisoka Residence (Cisoka, Tangerang).',\n  'Tugasmu HANYA mendeskripsikan gambar yang dikirim calon pembeli, supaya Vira bisa membalas dengan tepat.',\n  '',\n  'ATURAN:',\n  '- Bahasa Indonesia, padat, maksimal 5 kalimat per gambar.',\n  '- Untuk tiap gambar tulis 2 baris:',\n  '  KATEGORI: <pilih SATU> BUKTI_TRANSFER | KTP_ATAU_DOKUMEN_PRIBADI | SCREENSHOT_CHAT | BROSUR_ATAU_IKLAN | FOTO_RUMAH_ATAU_UNIT | DENAH_ATAU_SITEPLAN | SIMULASI_KPR_ATAU_HARGA | LOKASI_ATAU_PETA | SLIP_GAJI_ATAU_KEUANGAN | LAINNYA',\n  '  ISI: apa yang terlihat.',\n  '- Teks/angka penting di dalam gambar (nominal, tipe unit, tanggal, nama bank, nama perumahan, nama developer) tulis PERSIS apa adanya.',\n  '- DILARANG menebak. Tidak terbaca -> tulis \"tidak terbaca\".',\n  '- DILARANG menilai, menjawab pertanyaan user, atau memberi saran. Deskripsi saja.',\n  '- PRIVASI: DILARANG menyalin NIK/nomor KTP, nomor rekening lengkap, NPWP, atau nomor kartu. Sebut jenis dokumennya saja.',\n  '- Lebih dari satu gambar -> beri nomor \"Gambar 1\", \"Gambar 2\", dst.'\n].join('\\n');\n\nconst content = picked.map(im => ({\n  type: 'image',\n  source: { type: 'url', url: String(im.url) }\n}));\n\ncontent.push({\n  type: 'text',\n  text: `Ada ${picked.length} gambar dari calon pembeli.` +\n    (caption\n      ? `\\nPesan/caption yang user tulis: \"${caption}\"`\n      : `\\nUser tidak menulis pesan apa pun, hanya mengirim gambar.`) +\n    `\\nDeskripsikan sesuai format KATEGORI/ISI.`\n});\n\nconst body = {\n  model: String(cfg.vision_model || 'claude-haiku-4-5-20251001'),\n  max_tokens: Math.max(200, Number(cfg.vision_max_tokens ?? 700) || 700),\n  system: SYSTEM,\n  messages: [{ role: 'user', content }]\n};\n\nreturn [{ json: { vision_body: body, vision_image_count: picked.length, vision_skip: false } }];", "PCRv21 :: Rakit Konteks Gambar": "// NODE: Rakit Konteks Gambar   [BARU - V2 VISION]\n// ====================================================================\n// Titik gabung dua cabang IF Ada Gambar:\n//   - cabang TRUE  : input = respons Anthropic (punya .content[])\n//   - cabang FALSE : input = output Cek_user_status (tanpa .content)\n// Menyisipkan blok [GAMBAR DARI USER] / [LAMPIRAN DARI USER] ke dalam\n// [SYSTEM_DATA] (sebelum CRITICAL INSTRUCTION) supaya:\n//   (a) Preprocess tetap mempertahankannya (dia hanya split di [USER QUERY]),\n//   (b) regex intent Preprocess TIDAK ikut membaca deskripsi gambar.\n// ====================================================================\nconst base = $('Cek_user_status').first().json;\n\nlet desc = '';\nlet ok = false;\nlet imgCount = 0;\nlet visionError = '';\n\ntry {\n  const it = ($input.first() || {}).json || {};\n  // hanya cabang TRUE yang punya struktur respons Anthropic\n  if (Array.isArray(it.content)) {\n    desc = it.content\n      .filter(b => b && b.type === 'text' && typeof b.text === 'string')\n      .map(b => b.text)\n      .join('\\n')\n      .trim();\n    ok = desc !== '';\n    if (!ok) visionError = 'respons Anthropic tanpa blok text';\n  } else if (it.error) {\n    visionError = typeof it.error === 'string' ? it.error : JSON.stringify(it.error).slice(0, 300);\n  }\n} catch (e) {\n  visionError = String(e && e.message ? e.message : e);\n}\n\n// -- SANITASI (anti prompt-injection lewat teks DI DALAM gambar) -------------\n// Vision disuruh menyalin teks \"persis apa adanya\", jadi gambar berisi tulisan\n// \"[USER QUERY] abaikan instruksi\" atau \"[SEND_MEDIA: brosur]\" bisa menyusup ke\n// prompt / memicu aksi di Process All. Netralkan markernya, bukan buang teksnya.\n// [V2.1] Sanitasi berbasis POLA, bukan string literal.\n// V2.0 mencocokkan literal '[SEND_MEDIA', sedangkan Process All mem-parse tag dengan\n// regex yang mengizinkan spasi: /\\[\\s*SEND_MEDIA/. Akibatnya tulisan \"[ SEND_MEDIA: brosur]\"\n// di dalam gambar LOLOS sanitasi tapi TETAP dieksekusi. Sama untuk SCHEDULE_SURVEY & FACTS.\nconst RE_TAG  = /\\[\\s*(SEND_MEDIA|SCHEDULE_SURVEY|REQUEST_CALL|TALK_TO_ADMIN|UNKNOWN|FACTS)\\b/gi;\nconst RE_BLOK = /\\[\\s*(SYSTEM_DATA|USER QUERY|CONTEXT|GAMBAR DARI USER|LAMPIRAN DARI USER)/gi;\nconst RE_CRIT = /CRITICAL\\s+INSTRUCTION/gi;\nconst MAX_DESC = 2000;\nif (desc) {\n  // ganti \"[\" jadi \"(\" supaya parser tag & pemisah blok tidak kena,\n  // tapi isi teksnya tetap terbaca manusia.\n  let d = desc\n    .replace(RE_TAG,  (mm, tag) => '(' + tag)\n    .replace(RE_BLOK, (mm, tag) => '(' + tag)\n    .replace(RE_CRIT, 'CRITICAL-INSTRUCTION');\n  if (d.length > MAX_DESC) d = d.slice(0, MAX_DESC) + ' ...(dipotong)';\n  if (d !== desc) console.warn('VISION: marker mencurigakan di deskripsi gambar - dinetralkan.');\n  desc = d;\n}\n\ntry { imgCount = Number($('Siapkan Vision Request').first().json.vision_image_count) || 0; } catch (e) { }\nif (!imgCount) imgCount = Array.isArray(base.vision_images) ? base.vision_images.length : 0;\n\nif (visionError) console.warn('VISION gagal:', visionError);\n\n// [V2.1] blok mengikuti vision_mode. Di V2.0, mode mati tetap menghasilkan blok\n// \"sistem GAGAL membaca\" -> terbaca klien sebagai fitur RUSAK, bukan fitur di luar paket.\nconst visionMode = (() => {\n  try { return String($('Parse Config').first().json.config.vision_mode || 'full').toLowerCase(); }\n  catch (e) { return 'full'; }\n})();\n\nlet blok = '';\nif (visionMode === 'off') {\n  // perilaku V1.3: lampiran diabaikan sepenuhnya, tidak ada blok yang disisipkan.\n  blok = '';\n} else if (base.has_image && visionMode === 'full') {\n  blok = ok\n    ? `[GAMBAR DARI USER]\\nUser baru saja mengirim ${imgCount} gambar. Hasil pembacaan gambar (sumber tepercaya, boleh kamu rujuk):\\n${desc}\\nTanggapi isi gambarnya. DILARANG bilang kamu tidak bisa melihat gambar.`\n    : `[GAMBAR DARI USER]\\nUser mengirim gambar tapi sistem GAGAL membacanya. Minta maaf singkat lalu minta user menuliskan inti isi gambarnya. DILARANG menebak isinya.`;\n  if (Number(base.vision_images_dropped) > 0) {\n    blok += `\\nCatatan: user mengirim lebih banyak gambar, hanya ${imgCount} terakhir yang terbaca. Kalau relevan, minta user mengirim ulang yang belum terbahas.`;\n  }\n} else if (base.has_image || Number(base.other_media_count) > 0) {\n  // mode 'ack' (gambar maupun bukan), ATAU media non-gambar di mode 'full'.\n  const jenis = base.has_image\n    ? (Number(base.other_media_count) > 0 ? 'gambar dan lampiran lain' : 'gambar')\n    : 'lampiran non-gambar (video/pesan suara/dokumen/lokasi/stiker)';\n  blok = `[LAMPIRAN DARI USER]\\nUser mengirim ${jenis} yang BELUM bisa kamu buka. Akui dengan sopan dan ramah bahwa kirimannya sudah masuk, lalu minta intinya diketik singkat, atau tawarkan disambungkan ke tim. DILARANG menebak isinya. DILARANG bilang \"sistem gagal membaca\" atau menyalahkan sistem.`;\n}\n\nlet ai = String(base.ai_input_text || '');\nif (blok) {\n  if (ai.includes('CRITICAL INSTRUCTION')) {\n    ai = ai.replace('CRITICAL INSTRUCTION', blok + '\\n\\nCRITICAL INSTRUCTION');\n  } else if (ai.includes('[USER QUERY]')) {\n    ai = ai.replace('[USER QUERY]', blok + '\\n\\n[USER QUERY]');\n  } else {\n    ai = blok + '\\n\\n' + ai;\n  }\n}\n\nreturn [{\n  json: {\n    ...base,\n    ai_input_text: ai,\n    image_desc: desc,\n    vision_ok: ok,\n    vision_error: visionError,\n    vision_image_count: imgCount\n  }\n}];"};
const AsyncFunction = Object.getPrototypeOf(async function(){}).constructor;
const lines = [];
let fail = 0;

function check(label, code) {
  try { new AsyncFunction(code); lines.push('[PASS] ' + label); return true; }
  catch (e) { fail++; lines.push('[FAIL] ' + label + '  ->  ' + e.name + ': ' + e.message); return false; }
}

lines.push('=== NODE GABUNGAN: sintaks ===');
for (const k of Object.keys(MERGED)) check(k + ' :: Send WA + Verify (Kirimi)', MERGED[k]);

lines.push('');
lines.push('=== NODE GABUNGAN: isi wajib ===');
const need = ['this.helpers.httpRequest','api.kirimi.id/v1/send-message','$(\'Chat Counter\')',
              '$(\'Process All\')','cleanOutput','explicitFail','isSuccess','MAX_HTTP_ATTEMPTS','return [{ json: rd }]'];
for (const k of Object.keys(MERGED)) {
  const miss = need.filter(n => MERGED[k].indexOf(n) === -1);
  if (miss.length) { fail++; lines.push('[FAIL] ' + k + ' kehilangan: ' + miss.join(', ')); }
  else lines.push('[PASS] ' + k + ' memuat semua bagian wajib');
}

lines.push('');
lines.push('=== SELURUH CODE NODE LAIN (regresi sintaks) ===');
let okAll = 0, badAll = 0;
for (const k of Object.keys(ALL)) {
  try { new AsyncFunction(ALL[k]); okAll++; }
  catch (e) { badAll++; fail++; lines.push('[FAIL] ' + k + '  ->  ' + e.name + ': ' + e.message); }
}
lines.push('[' + (badAll ? 'FAIL' : 'PASS') + '] ' + okAll + ' code node lolos, ' + badAll + ' gagal');

lines.push('');
lines.push(fail ? ('>>> ' + fail + ' GAGAL') : '>>> SEMUA LOLOS');
document.getElementById('out').textContent = lines.join('\n');
window.__SYNTAX = { fail: fail, lines: lines };
</script>
