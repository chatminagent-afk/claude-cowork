<script>
var SRC = {"CacheCheck": "// r8 -- Cek cache tab statis. SELALU jalan.\n// Kalau masih segar, 4 node baca Sheets di belakang dilewati sepenuhnya:\n// 13 operasi Sheets per pesan turun jadi 9.\nconst TTL_MS = 120 * 1000;\nconst KEY = 'vira_static_tabs';\n\nconst store = $getWorkflowStaticData('global');\nconst box = store[KEY];\nconst now = Date.now();\n\nlet hit = false;\nlet cache = null;\n\nif (box && box.ts && (now - box.ts) < TTL_MS && box.tabs) {\n  // Cache dianggap sah hanya kalau SEMUA tab ada isinya. Satu tab kosong\n  // berarti pengambilan sebelumnya cacat -- lebih baik baca ulang daripada\n  // menyajikan data separuh (PROGRAM kosong = VIRA bilang tidak punya program).\n  const need = [\"Read FAQ\", \"Read PROGRAM Data\", \"Read ABOUT Data\", \"Read LINKS Data\"];\n  const ok = need.every(function (k) {\n    return Array.isArray(box.tabs[k]) && box.tabs[k].length > 0;\n  });\n  if (ok) { hit = true; cache = box.tabs; }\n}\n\nconst age = box && box.ts ? Math.round((now - box.ts) / 1000) : -1;\nconst base = $input.first() ? $input.first().json : {};\n\nreturn [{ json: Object.assign({}, base, {\n  cache_hit: hit,\n  cache_age_s: age,\n  _cache: cache\n}) }];\n", "CacheStore": "// r8 -- Simpan 4 tab statis ke static data, lalu teruskan sebagai _cache.\n// Hanya jalan saat cache meleset.\nconst KEY = 'vira_static_tabs';\nconst NODES = [\"Read FAQ\", \"Read PROGRAM Data\", \"Read ABOUT Data\", \"Read LINKS Data\"];\n\n// Pola .all(0, 0) disalin dari helper `grab` di node \"FAQ Retrieve\":\n// Read PROGRAM/ABOUT/LINKS ber-executeOnce, jadi pada run kedua referensi run\n// saat ini kosong walau datanya sudah terambil di run pertama.\nfunction pull(node, useFirstRun) {\n  try {\n    const ref = $(node);\n    const items = useFirstRun ? ref.all(0, 0) : ref.all();\n    return (items || []).map(function (i) { return i.json; }).filter(Boolean);\n  } catch (e) { return null; }\n}\n\nconst tabs = {};\nlet complete = true;\nfor (const node of NODES) {\n  let rows = pull(node, false);\n  if (!rows || !rows.length) rows = pull(node, true);\n  if (!rows || !rows.length) { complete = false; rows = []; }\n  tabs[node] = rows;\n}\n\n// JANGAN simpan cache yang cacat -- lebih baik baca ulang pesan berikutnya\n// daripada mengunci data separuh selama TTL.\nif (complete) {\n  $getWorkflowStaticData('global')[KEY] = { ts: Date.now(), tabs: tabs };\n} else {\n  console.warn('CACHE TIDAK DISIMPAN: ada tab statis yang kosong.');\n}\n\nconst base = $input.first() ? $input.first().json : {};\nreturn [{ json: Object.assign({}, base, { _cache: tabs, cache_stored: complete }) }];\n", "FAQRetrieve": "// ===== CONTEXT RETRIEVE V3 (KONSOLIDASI) =====\n// Single source of truth = tab PROGRAM (superset: harga, batch, status, syarat).\n// + ABOUT_SAM (bio) + LINKS (url) + FAQ. Token-efisien, anti-halu, tanpa tool agent.\ntry {\n  const pre = $('Preprocess - Context Detection').first().json;\n  const query = pre.actualUserMessage || '';\n  const flags = {\n    askingPrice: !!pre.askingPrice,\n    askingBatch: !!pre.askingBatch,\n    discussingProgram: !!pre.discussingProgram,\n    wantsToRegister: !!pre.wantsToRegister,\n  };\n  const askingSyarat = /syarat|persyaratan|kriteria|ketentuan|dokumen|rapor|raport|portofolio|portfolio|requirement|nilai|esai|essay/i.test(query);\n  const askingAboutSam = /\\bsam\\b|founder|pendiri|pengajar|mentor|tutor|guru|ngajar|siapa kak|siapa ini|admin|alumni|lulus|sekolah.*(mana|sg|singap)|kuliah|background|pengalaman|kerja/i.test(query);\n  const askingProgramDetail = flags.discussingProgram || !!pre.grade || /durasi|berapa kali|seminggu|format|online|sesi|materi|isi program|belajar apa/i.test(query);\n\n  // Kegagalan baca sheet dicatat, TIDAK ditelan diam-diam. Versi lama mengembalikan []\n  // tanpa log, sehingga \"sheet gagal dibaca\" tidak bisa dibedakan dari \"sheet memang\n  // kosong\" - VIRA lalu melayani customer seolah The Scholars tidak punya program.\n  const sheetIssues = [];\n  // Ringkasan per node ikut ke OUTPUT node (bukan cuma console), supaya bisa\n  // dibaca langsung dari execution data tanpa membuka panel Logs n8n.\n  const sheetDebug = {};\n  // r8: kalau _cache terisi, pakai itu dan JANGAN sentuh $(node) sama sekali --\n  // node bacanya memang sengaja dilewati, jadi $(node) akan error/kosong dan\n  // memicu sheetIssues palsu (\"PROGRAM kosong\" -> VIRA bilang tidak punya program).\n  const _cacheIn = (($input.first() || {}).json || {})._cache || null;\n\n  const grab = (node) => {\n    if (_cacheIn && Array.isArray(_cacheIn[node]) && _cacheIn[node].length) {\n      sheetDebug[node] = _cacheIn[node].length + ' baris — CACHE';\n      return _cacheIn[node];\n    }\n    // pull(true) memaksa baca hasil run pertama. Perlu karena Read PROGRAM/ABOUT/LINKS\n    // ber-executeOnce: kalau node ini jalan di run kedua (debounce/buffer), referensi\n    // run saat ini kosong walau datanya sebenarnya sudah terambil di run pertama.\n    const pull = (useFirstRun) => {\n      try {\n        const ref = $(node);\n        const items = useFirstRun ? ref.all(0, 0) : ref.all();\n        return (items || []).map(i => i.json).filter(Boolean);\n      } catch (e) {\n        return { err: (e && e.message) ? e.message : String(e) };\n      }\n    };\n\n    const rows = pull(false);\n\n    if (rows && rows.err !== undefined) {\n      const first = pull(true);\n      if (first && first.err === undefined && first.length) {\n        console.warn('SHEET PULIH: \"' + node + '\" gagal di run saat ini (' + rows.err + '), diambil dari run pertama. ' + first.length + ' baris.');\n        sheetDebug[node] = first.length + ' baris — FALLBACK run pertama (run saat ini error: ' + rows.err + ')';\n        return first;\n      }\n      console.error('SHEET GAGAL DIBACA: \"' + node + '\" -> ' + rows.err);\n      sheetIssues.push(node + ' (error: ' + rows.err + ')');\n      sheetDebug[node] = 'GAGAL — ' + rows.err;\n      return [];\n    }\n\n    if (!rows.length) {\n      const first = pull(true);\n      if (first && first.err === undefined && first.length) {\n        console.warn('SHEET PULIH: \"' + node + '\" kosong di run saat ini, diambil dari run pertama. ' + first.length + ' baris.');\n        sheetDebug[node] = first.length + ' baris — FALLBACK run pertama (run saat ini 0 baris)';\n        return first;\n      }\n      console.error('SHEET KOSONG: \"' + node + '\" tidak mengembalikan baris apa pun.');\n      sheetIssues.push(node + ' (0 baris)');\n      sheetDebug[node] = '0 baris — KOSONG';\n      return [];\n    }\n\n    sheetDebug[node] = rows.length + ' baris — normal';\n    return rows;\n  };\n  const val = (row, ...keys) => { for (const k of keys) { for (const rk of Object.keys(row)) { if (rk.toLowerCase().trim() === k.toLowerCase().trim() || rk.toLowerCase().startsWith(k.toLowerCase())) { const v = row[rk]; if (v !== undefined && v !== null && String(v).trim() !== '') return String(v).trim(); } } } return ''; };\n  const clip = (s, n) => { s = (s || '').replace(/\\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; };\n\n  const parts = [];\n  const prog = grab('Read PROGRAM Data');\n\n  // Database tidak terbaca = GANGGUAN SISTEM, bukan \"programnya tidak ada\".\n  // Tanpa penanda ini AI menyimpulkan The Scholars tidak punya program apa pun dan\n  // menjawab dengan yakin - persis kegagalan yang terlihat di produksi.\n  if (!prog.length) {\n    parts.push('PERINGATAN SISTEM: DATABASE PROGRAM TIDAK TERBACA untuk pesan ini. Ini gangguan teknis, BUKAN berarti programnya tidak ada. DILARANG menyatakan program/batch tidak ada, dan DILARANG menyebut status pendaftaran, harga, jadwal, atau kuota. Untuk semua pertanyaan soal program, batch, harga, jadwal, dan pendaftaran -> jawab [UNKNOWN]. Jangan sebut adanya gangguan sistem ke user.');\n  }\n\n  // STATUS & BATCH (selalu; gating harga & pendaftaran) -- diturunkan dari PROGRAM\n  // Kolom \"Status\" adalah SATU-SATUNYA penentu pendaftaran buka/tutup. Verdict dihitung\n  // di sini (deterministik) supaya AI tidak menyimpulkannya sendiri dari tanggal.\n  if (prog.length) {\n    // Dropdown kolom Status di sheet PROGRAM: Active | Coming Soon | Closed | Always Active.\n    // Dicocokkan per KATA supaya varian ejaan tetap kena. Urutan pemeriksaan penting:\n    // ALWAYS dulu (mengandung \"Active\"), lalu SOON/CLOSED (mengandung \"belum\"/\"tutup\"),\n    // baru OPEN. Kalau OPEN dicek duluan, \"Coming Soon\"/\"Belum dibuka\" salah terbaca.\n    const ALWAYS_RE = /always|selalu/i;\n    const SOON_RE = /(coming\\s*soon|belum\\s*dibuka|belum\\s*buka|akan\\s*datang)/i;\n    const CLOSED_RE = /(closed|close|tutup|ditutup|penuh|full|selesai|inactive|tidak\\s*aktif|non\\s*-?\\s*aktif)/i;\n    const OPEN_RE = /(active|aktif|open|buka|dibuka|berjalan|ongoing)/i;\n\n    // \"hari ini\" WIB, dinormalkan ke tengah malam supaya deadline hari-H tetap dihitung berlaku\n    const _nowWib = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Jakarta' }));\n    const todayWib = new Date(_nowWib.getFullYear(), _nowWib.getMonth(), _nowWib.getDate());\n    const BLN_ID = ['januari','februari','maret','april','mei','juni','juli','agustus','september','oktober','november','desember'];\n    const parseTglID = (s) => {\n      const m = String(s || '').match(/(\\d{1,2})\\s+([A-Za-z]+)\\s+(\\d{4})/);\n      if (!m) return null;\n      const bi = BLN_ID.indexOf(m[2].toLowerCase());\n      return bi === -1 ? null : new Date(Number(m[3]), bi, Number(m[1]));\n    };\n\n    const lines = prog.map(r => {\n      const nm = val(r, 'Nama Program'), st = val(r, 'Status'), batch = val(r, 'Nama Batch');\n      const mulai = val(r, 'Tanggal Mulai'), dl = val(r, 'Deadline Daftar'), kuota = val(r, 'Kuota');\n      const hasBatch = batch && batch !== '-';\n      const stRaw = String(st || '').trim();\n      const dlDate = parseTglID(dl);\n      const mulaiDate = parseTglID(mulai);\n      const dlLewat = !!(dlDate && dlDate < todayWib);\n      const mulaiLewat = !!(mulaiDate && mulaiDate < todayWib);\n\n      // ── Verdict: kolom Status yang utama; tanggal cuma JARING PENGAMAN\n      //    untuk kasus Sam lupa mengubah Status setelah tanggal terlewat.\n      let verdict, alasan = '';\n      if (ALWAYS_RE.test(stRaw)) {\n        verdict = 'DIBUKA';                       // Always Active -> abaikan tanggal\n      } else if (SOON_RE.test(stRaw)) {\n        verdict = 'BELUM DIBUKA';\n        if (mulaiLewat) {                          // Sam lupa: program sudah jalan\n          verdict = 'SUDAH DITUTUP';\n          alasan = 'program sudah mulai ' + mulai;\n          console.warn('STATUS BASI: ' + nm + ' Status=\"' + stRaw + '\" tapi Tanggal Mulai ' + mulai + ' sudah lewat -> dianggap SUDAH DITUTUP. Perbaiki kolom Status di sheet PROGRAM.');\n        }\n      } else if (CLOSED_RE.test(stRaw)) {\n        verdict = 'SUDAH DITUTUP';\n      } else if (OPEN_RE.test(stRaw)) {\n        verdict = 'DIBUKA';\n        if (dlLewat) {                             // Sam lupa: deadline sudah terlewat\n          verdict = 'SUDAH DITUTUP';\n          alasan = 'deadline daftar ' + dl + ' sudah lewat';\n          console.warn('STATUS BASI: ' + nm + ' Status=\"' + stRaw + '\" tapi Deadline Daftar ' + dl + ' sudah lewat -> dianggap SUDAH DITUTUP. Perbaiki kolom Status/Deadline di sheet PROGRAM.');\n        } else if (!dlDate && mulaiLewat) {         // tanpa deadline: pakai tanggal mulai\n          verdict = 'SUDAH DITUTUP';\n          alasan = 'program sudah mulai ' + mulai;\n          console.warn('STATUS BASI: ' + nm + ' Status=\"' + stRaw + '\" tanpa Deadline, tapi Tanggal Mulai ' + mulai + ' sudah lewat -> dianggap SUDAH DITUTUP.');\n        }\n      } else {\n        verdict = 'TIDAK JELAS';                   // di luar dropdown -> jangan menebak\n        console.warn('STATUS TIDAK DIKENALI: ' + nm + ' Status=\"' + stRaw + '\". Isi kolom Status dengan salah satu: Active / Coming Soon / Closed / Always Active.');\n      }\n\n      let out = verdict === 'TIDAK JELAS'\n        ? `${nm}: STATUS PENDAFTARAN TIDAK JELAS - jangan menyatakan buka/tutup, jawab [UNKNOWN] untuk status`\n        : `${nm}: PENDAFTARAN ${verdict}${alasan ? ' (' + alasan + ')' : ''}`;\n\n      if (hasBatch) out += `, ${batch}`;\n      if (mulai) out += `, Program mulai ${mulai}`;\n      if (dl) out += `, Deadline daftar ${dl}`;\n      if (kuota) out += `, Kuota ${kuota}`;\n      return out;\n    });\n    parts.push('STATUS & BATCH (sumber resmi & PALING TINGGI - menang atas FAQ. PENDAFTARAN DIBUKA / BELUM DIBUKA / SUDAH DITUTUP di sini FINAL, jangan disimpulkan ulang dari tanggal; program/batch yang tidak ada di sini = tidak ada, jangan dikarang):\\n' + lines.join('\\n'));\n  }\n\n  // Pemetaan program -> kelas (selalu, kecil)\n  parts.push('PEMETAAN PROGRAM: Junior=SD6/SMP1 | Intermediate=SMP2/SMP3 | Seniors=SMA kelas 12 | Mock Interview=semua siswa. SMA 10/11 belum ada program.');\n\n  // HARGA (kondisional) -- dari PROGRAM\n  if ((flags.askingPrice || flags.wantsToRegister || askingProgramDetail) && prog.length) {\n    const lines = prog.map(r => `${val(r, 'Nama Program')}: ${val(r, 'Harga') || 'tidak tertulis'}${val(r, 'Pembayaran') ? ' (' + clip(val(r, 'Pembayaran'), 90) + ')' : ''}${val(r, 'Catatan') ? ' - ' + clip(val(r, 'Catatan'), 70) : ''}`);\n    parts.push('HARGA (sebut hanya sesuai ATURAN HARGA di system; ikut status batch):\\n' + lines.join('\\n'));\n  }\n\n  // SYARAT (kondisional) -- dari PROGRAM\n  if (askingSyarat && prog.length) {\n    const lines = prog.map(r => `${val(r, 'Nama Program')}: Syarat: ${clip(val(r, 'Syarat Umum'), 180)}${val(r, 'Dokumen yang Perlu Disiapkan', 'Dokumen') ? ' | Dokumen: ' + clip(val(r, 'Dokumen yang Perlu Disiapkan', 'Dokumen'), 150) : ''}`);\n    parts.push('SYARAT:\\n' + lines.join('\\n'));\n  }\n\n  // PROGRAM detail (kondisional)\n  if (askingProgramDetail && prog.length) {\n    const lines = prog.map(r => `${val(r, 'Nama Program')}: ${clip(val(r, 'Deskripsi'), 170)} | Target: ${clip(val(r, 'Target Peserta'), 90)} | Durasi: ${clip(val(r, 'Durasi'), 60)} | Format: ${clip(val(r, 'Format'), 60)}`);\n    parts.push('PROGRAM (detail):\\n' + lines.join('\\n'));\n  }\n\n  // TENTANG SAM (kondisional) -- dari ABOUT_SAM\n  if (askingAboutSam) {\n    const about = grab('Read ABOUT Data');\n    if (about.length) parts.push('TENTANG SAM & THE SCHOLARS:\\n' + about.map(r => `${val(r, 'Aspek')}: ${clip(val(r, 'Detail'), 160)}`).join('\\n'));\n  }\n\n  // LINK AKTIF (selalu) -- nama saja; URL disisipkan sistem saat [SEND_GFORM]\n  const links = grab('Read LINKS Data');\n  if (links.length) {\n    const activeRows = links.filter(r => /aktif|active|on|ya/i.test(val(r, 'Status')));\n    const active = activeRows.map(r => {\n      const nm = val(r, 'Nama Link');\n      const ds = clip(val(r, 'Deskripsi'), 80);\n      return nm ? (ds ? `${nm} \\u2014 ${ds}` : nm) : '';\n    }).filter(Boolean);\n    if (active.length) {\n      const sample = val(activeRows[0], 'Nama Link') || 'Nama Link';\n      parts.push('LINK AKTIF (saat [SEND_GFORM] WAJIB sebut Nama Link PERSIS, mis. [SEND_GFORM: ' + sample + ']):\\n- ' + active.join('\\n- '));\n    }\n  }\n\n  const data_context = parts.join('\\n\\n');\n\n  // ---------- FAQ lexical retrieval ----------\n  const faq = grab('Read FAQ').filter(r => r.Pertanyaan && r.Jawaban);\n  const STOP = new Set(['yang','untuk','dan','di','ke','dari','itu','ini','apa','apakah','bisa','kah','ya','yaa','kak','min','dong','sih','kok','aja','ada','gimana','bagaimana','saya','aku','nya','kalau','atau','juga','sudah','belum','mau','dengan','pada','adalah','kira','tolong','mohon','halo','hai','permisi','terima','kasih','sama','buat','soal','tentang','nih','ngga','gak','engga','tidak','dll','dsb','ga','ikut','harus','nanti','dimana','banget','seperti','pakai','punya','lagi','deh','yg','utk','sm','jd','udah','blm']);\n  const GROUPS = [\n    ['biaya','harga','bayar','tarif','pembayaran','cicil','cicilan','nyicil','nyicilnya','dicicil','ngecicil','dp','mahal','murah','fee','uang','dibayar','bayarnya','investasi','gratis'],\n    ['daftar','pendaftaran','registrasi','enroll','gabung','join','mendaftar','ndaftar','apply'],\n    ['jadwal','kapan','mulai','periode','angkatan','dibuka'],\n    ['syarat','persyaratan','kriteria','ketentuan','requirement'],\n    ['beasiswa','scholarship','asean','uob','cli','capitaland','moe','funded'],\n    ['program','kelas','junior','intermediate','senior','seniors','jenjang'],\n    ['interview','wawancara','mock'],\n    ['essay','esai','karangan'],\n    ['alumni','lulus','berhasil','diterima','keterima','sukses'],\n    ['anak','anaku','anakku','putra','putri','murid','siswa'],\n    ['singapura','singapore','sg'],\n    ['tinggal','kehidupan','asrama','akomodasi','hidup'],\n    ['kuota','slot','penuh','kursi','sisa'],\n    ['mengajar','pengajar','guru','mentor','tutor','ngajar'],\n  ];\n  const SYN = {}; for (const g of GROUPS) for (const w of g) SYN[w] = g[0];\n  const stem = (t) => { let w = t; for (const s of ['nya','kah','lah','kan','an','i']) if (w.length - s.length >= 4 && w.endsWith(s)) { w = w.slice(0, -s.length); break; } for (const p of ['meng','meny','mem','men','peng','peny','pem','pen','ber','ter','di','se','ke','me','pe']) if (w.length - p.length >= 4 && w.startsWith(p)) { w = w.slice(p.length); break; } return w; };\n  const tok = (s) => (s || '').toLowerCase().replace(/[^\\p{L}\\p{N}\\s]/gu, ' ').split(/\\s+/).filter(Boolean).filter(t => !STOP.has(t)).map(t => { const a = SYN[t]; if (a) return a; const st = stem(t); return SYN[st] || st; }).filter(t => t.length >= 2 && !STOP.has(t));\n  const docs = faq.map(r => ({ row: r, toks: tok(r.Pertanyaan) }));\n  const Nn = docs.length, df = {};\n  for (const dd of docs) for (const t of new Set(dd.toks)) df[t] = (df[t] || 0) + 1;\n  const idf = (t) => Math.log((Nn + 1) / ((df[t] || 0) + 1)) + 1;\n  const boost = {};\n  if (flags.askingPrice || flags.discussingProgram) boost['Program & Biaya'] = 1.25;\n  if (flags.askingBatch) boost['Batch & Jadwal'] = 1.30;\n  if (flags.wantsToRegister) boost['Seleksi & Proses Daftar'] = 1.20;\n  const qToks = [...new Set(tok(query))];\n  let faq_context = '';\n  if (qToks.length && docs.length) {\n    const scored = docs.map(dd => { const dset = new Set(dd.toks); let s = 0, m = 0; for (const t of qToks) if (dset.has(t)) { s += idf(t); m++; } s *= (boost[dd.row.Kategori] || 1.0); return { row: dd.row, score: s, matched: m }; }).sort((a, b) => b.score - a.score);\n    const top = scored[0];\n    const FLOOR = 2.5, needCov = qToks.length >= 3 ? 2 : 1;\n    if (top.score >= FLOOR && top.matched >= needCov) {\n      const kept = scored.filter(x => x.score >= 0.45 * top.score && x.matched >= 1).slice(0, 4);\n      faq_context = kept.map(x => `Q: ${x.row.Pertanyaan}\\nA: ${x.row.Jawaban}`).join('\\n\\n');\n    }\n  }\n\n  if (sheetIssues.length) {\n    console.error('RINGKASAN MASALAH SHEET pesan ini: ' + sheetIssues.join(' | '));\n  }\n\n  return [{ json: { ...pre, faq_context, data_context, sheet_issues: sheetIssues, sheet_debug: sheetDebug }, pairedItem: { item: 0 } }];\n} catch (e) {\n  const msg = (e && e.message) ? e.message : String(e);\n  console.error('FAQ RETRIEVE GAGAL TOTAL: ' + msg);\n  const pre = ($('Preprocess - Context Detection').first() || { json: {} }).json || {};\n  return [{ json: { ...pre, faq_context: '', data_context: 'PERINGATAN SISTEM: DATABASE TIDAK TERBACA untuk pesan ini. Ini gangguan teknis, BUKAN berarti datanya tidak ada. DILARANG menyatakan program/batch/harga/jadwal tidak ada -> jawab [UNKNOWN] untuk semua pertanyaan fakta. Jangan sebut adanya gangguan sistem ke user.', sheet_issues: ['FAQ Retrieve gagal total: ' + msg], sheet_debug: { 'FAQ Retrieve': 'GAGAL TOTAL — ' + msg }, faq_error: String(e) }, pairedItem: { item: 0 } }];\n}\n", "ProcessAll_r9": "const item = $input.first();\n\n// Ambil AI output dari Anthropic Chat Model\nlet aiOutput = '';\nif (item?.json?.content && Array.isArray(item.json.content) && item.json.content.length > 0) {\n  aiOu atch[1]) {\n  aiFactsKelas = factsMatch[1].split(',').map(s => s.trim()).filter(Boolean);\n  console.log('🏷️ FACTS kelas dari AI:', aiFactsKelas);\n}\n\nconst regexGrades = Array.isArray(preprocess && preprocess.grades) ? preprocess.grades : [];\nlet existingFreshRaw = '';\ntry { existingFreshRaw = String($('Cek_user_status').first().json.kelas_anak_db || ''); } catch (e) {}\nconst existingFresh = existingFreshRaw.split(',').map(s => s.trim()).filter(Boolean);\n\nconst mergedSet = [];\nfor (const c of [...aiFactsKelas, ...regexGrades, ...existingFresh]) {\n  const lab = toLabel(c);\n  if (lab && !mergedSet.includes(lab)) mergedSet.push(lab);\n}\nconst mergedArr     = KELAS_WL.filter(w => mergedSet.includes(w)); // urut kanonik\nconst mergedKelas   = mergedArr.join(', ');\nconst progSet       = [...new Set(mergedArr.map(g => KELAS_PROG[g]).filter(Boolean))];\nconst mergedProgram = PROG_ORDER.filter(p => progSet.includes(p)).join(', ');\nconst existingCanon = KELAS_WL.filter(w => existingFresh.map(toLabel).includes(w)).join(', ');\nconst kelasChanged  = mergedKelas !== '' && mergedKelas !== existingCanon;\nif (kelasChanged) console.log(`📝 kelas_anak: \"${existingCanon}\" -> \"${mergedKelas}\" | program: \"${mergedProgram}\"`);\n\n\n// ── TAG: [PENDAFTARAN] (backward compat) ──────────────────────\nlet isPendaftaran = false;\nlet pendaftaranData = {};\nconst pendMatch = aiOutput.match(/\\[PENDAFTARAN\\](.*?)\\[\\/PENDAFTARAN\\]/s);\nif (pendMatch && pendMatch[1]) {\n  isPendaftaran = true;\n  const c = pendMatch[1];\n  const namaM    = c.match(/Nama:([^|]+)/);\n  const programM = c.match(/Program:([^|]+)/);\n  const batchM   = c.match(/Batch:([^|]+)/);\n  const asalM    = c.match(/Asal:([^|\\\\]]+)/);\n  pendaftaranData = {\n    nama:    namaM    ? namaM[1].trim()    : '',\n    program: programM ? programM[1].trim() : '',\n    batch:   batchM   ? batchM[1].trim()   : '',\n    asal:    asalM    ? asalM[1].trim()    : '',\n  };\n}\n\n// ── DATA_COMPLETE ───────────────── ari',\n];\nconst keywordPattern = internalKeywords.join('|');\nconst internalRegex = new RegExp(`^\\\\s*([^.!?]*?(${keywordPattern})[^.!?]*[.!?]\\\\s*)`, 'i');\ncleanOutput = cleanOutput.replace(internalRegex, '');\n\n// Hapus juga kalimat yang diawali dengan kata-kata tersebut (tanpa titik)\nconst startPattern = new RegExp(`^\\\\s*(${keywordPattern}).*?(\\\\n|\\\\.|$)`, 'i');\ncleanOutput = cleanOutput.replace(startPattern, '');\n\n// Jaga-jaga: buang baris pertama jika terindikasi\nconst lines = cleanOutput.split('\\n');\nif (lines.length > 1) {\n  const firstLine = lines[0].toLowerCase();\n  if (internalKeywords.some(kw => firstLine.includes(kw))) {\n    lines.shift();\n    cleanOutput = lines.join('\\n');\n  }\n}\n\n// Kalimat pembuka \"Berdasarkan/Menurut/Dari + data/faq/sheet/referensi ...\"\ncleanOutput = cleanOutput.replace(/^\\s*(Berdasarkan|Menurut|Dari)\\s+(data|faq|sheet|referensi)[^.!?]*[.!?]\\s*/i, '');\n\n// Potong teks sebelum \": \" — hanya jika kalimat DIAWALI frasa proses internal\nconst colonMatch = cleanOutput.match(/^\\s*(Berdasarkan|Menurut|Dari)\\s+(data|faq|sheet|referensi)[^:]*:\\s*(.+)/is);\nif (colonMatch && colonMatch[3] && colonMatch[3].trim().length > 0) {\n  cleanOutput = colonMatch[3].trim();\n}\n\n// ── V4 GUARD ANTI-KOSONG ──────────────────────────────────────\n// Kalau filter internal menghapus SEMUA teks padahal AI punya\n// jawaban, kembalikan versi sebelum filter. Pesan error hanya\n// untuk kasus AI benar-benar tidak menghasilkan output.\nif (!cleanOutput.trim() && preInternalStrip.trim()) {\n  // Coba selamatkan isi setelah titik dua (\"Berdasarkan FAQ ...: <isi>\")\n  const rescue = preInternalStrip.match(/^\\s*[^:.!?\\n]{0,80}(?:data|faq|sheet|referensi)[^:.!?\\n]{0,80}:\\s*(.+)/is);\n  if (rescue && rescue[1] && rescue[1].trim()) {\n    console.warn('🛡️ GUARD: ambil isi setelah frasa internal.');\n    cleanOutput = rescue[1].trim();\n  } else {\n    console.warn('🛡️ GUARD: filter internal mengosongkan output — pakai versi er|bayar|pembayaran)|kirim\\s*bukti|konfirmasi\\s*pembayaran|pembayaran\\s*(nya\\s*)?(sudah|udah|telah)\\s*(masuk|diterima|kami\\s*terima)|sudah\\s*(saya|kami)\\s*terima\\s*pembayaran)/i;\n\nlet transferBlocked = false;\nif (transferRegex.test(cleanOutput)) {\n  const beforeNet = cleanOutput;\n\n  // Buang HANYA kalimat yang menyinggung transfer; kalimat lain (mis. harga) dipertahankan.\n  // Baris kosong asli dipertahankan supaya spasi paragraf & link tidak rusak.\n  const DROP = '\\x01';\n  const keptLines = cleanOutput\n    .split('\\n')\n    .map(line => {\n      const t = line.trim();\n      if (!t) return '';\n      const k = t\n        .split(/(?<=[.!?])\\s+/)\n        .filter(s => !transferRegex.test(s))\n        .join(' ')\n        .replace(/\\s{2,}/g, ' ')\n        .trim();\n      return k || DROP;\n    })\n    .filter(l => l !== DROP);\n\n  const kept = keptLines.join('\\n').replace(/\\n{3,}/g, '\\n\\n').trim();\n  cleanOutput = kept ? `${kept}\\n\\n${TRANSFER_SAFE_REPLY}` : TRANSFER_SAFE_REPLY;\n  transferBlocked = true;\n\n  console.warn('SAFETY NET TRANSFER aktif.');\n  console.warn('  sebelum:', beforeNet);\n  console.warn('  sesudah:', cleanOutput);\n}\n\n// ── SAFETY NET LINK (URL wajib terdaftar & AKTIF di tab LINKS) ──\n// Sam mengatur link lewat tab LINKS, tapi 7 baris FAQ menyimpan URL mentah di dalam\n// teks jawabannya. AI tinggal menyalin, sehingga link yang sudah di-Closed di LINKS\n// tetap terkirim: kasus Intensive Class UOB/CLI - LINKS \"Intensive Class\" sudah\n// Closed, tapi FAQ baris 104 masih memuat https://tinyurl.com/UOBCLIntensiveClass\n// (URL yang bahkan tidak terdaftar di LINKS). Filter di bawah menjadikan tab LINKS\n// satu-satunya gerbang: URL yang TIDAK terdaftar, atau terdaftar tapi TIDAK aktif,\n// dibuang sebelum pesan dikirim.\nconst LINK_UNVERIFIED_REPLY = 'Untuk linknya saya cek dulu yaa. Kalau mau lebih cepat, bisa ngobrol langsung sama Sam, tinggal ketik \"mau ngomong sama Sam\".';\n\n// Dicek CLOSED dulu: \"Nonaktif ];\n};\n\nconst linkRowsGuard = pullLinks();\nconst linksReadOk = linkRowsGuard.length > 0;\nif (!linksReadOk) console.error('SAFETY NET LINK: tab LINKS tidak terbaca - semua URL diblokir demi aman.');\n\n// Sam: \"Mungkin bisa di-redirect untuk join channel WA ku saja.\"\n// URL channel diambil dari tab LINKS (bukan hardcode) supaya kalau Sam ganti channel\n// atau menonaktifkannya, balasan ini ikut menyesuaikan tanpa mengubah kode.\nconst waChannelRow = linkRowsGuard.find(r =>\n  isLinkActive(r['Status']) && (\n    /whatsapp\\.com\\/channel\\//i.test(String(r['URL'] || '')) ||\n    /chat\\.whatsapp\\.com\\//i.test(String(r['URL'] || '')) ||\n    /channel/i.test(String(r['Nama Link'] || ''))\n  )\n);\nconst waChannelUrl = waChannelRow ? String(waChannelRow['URL'] || '').trim() : '';\nconst SAM_TAIL = 'Kalau mau tanya-tanya lebih lanjut, tinggal ketik \"mau ngomong sama Sam\".';\n\n// txt = teks yang sudah ada di balasan. Kalau link channel-nya kebetulan sudah\n// disebut di situ, jangan diulang - user tidak perlu menerima URL yang sama 2x.\nconst buildClosedReply = (txt) => {\n  if (waChannelUrl && !String(txt || '').includes(waChannelUrl)) {\n    return 'Untuk sekarang pendaftarannya lagi ditutup yaa. Boleh join WhatsApp Channel-nya dulu, nanti info batch berikutnya saya share di sana:\\n\\n\\ud83d\\udc49 ' + waChannelUrl + '\\n\\n' + SAM_TAIL;\n  }\n  return 'Untuk sekarang pendaftarannya lagi ditutup yaa. ' + SAM_TAIL;\n};\n\n\n// Samakan bentuk URL sebelum dibandingkan: buang tanda baca penutup & slash akhir.\nconst normUrl = (u) => String(u || '').trim().toLowerCase()\n  .replace(/[)\\]\\.,;:!?\"'\\u00bb]+$/g, '')\n  .replace(/\\/+$/, '');\n\nconst activeUrlSet = new Set();\nconst knownUrlSet = new Set();\nfor (const r of linkRowsGuard) {\n  const u = normUrl(r['URL']);\n  if (!u) continue;\n  knownUrlSet.add(u);\n  if (isLinkActive(r['Status'])) activeUrlSet.add(u);\n}\n\nconst GUARD_URL_RE = /https?:\\/\\/[^\\s)]+/g;\nconst foundUrls = cleanOutput.match(GUARD_URL_RE) || [];\nconst blockedUrls = [];\nfor (const raw of foundUrls) {\n  const n = normUrl(raw);\n  if (linksReadOk && activeUrlSet.has(n)) continue;\n  blockedUrls.push(raw);\n  console.warn('SAFETY NET LINK: URL ditolak -> ' + raw + (knownUrlSet.has(n) ? ' (terdaftar di LINKS tapi TIDAK aktif)' : ' (TIDAK terdaftar di LINKS)'));\n}\n\nlet linkBlocked = false;\nlet linkReplyAdded = false;\nif (blockedUrls.length) {\n  const beforeLink = cleanOutput;\n  const hasBlocked = (s) => blockedUrls.some(u => s.includes(u));\n  const DROP_L = '\\x02';\n\n  // Buang HANYA kalimat yang memuat URL terlarang; kalimat lain dipertahankan.\n  const keptLines = cleanOutput\n    .split('\\n')\n    .map(line => {\n      const t = line.trim();\n      if (!t) return '';\n      const k = t\n        .split(/(?<=[.!?])\\s+/)\n        .filter(s => !hasBlocked(s))\n        .join(' ')\n        .replace(/\\s{2,}/g, ' ')\n        .trim();\n      return k || DROP_L;\n    })\n    .filter(l => l !== DROP_L);\n\n  // URL sering ditulis di baris sendiri sesudah kalimat pengantar (\"daftar di sini yaa:\").\n  // Tanpa ini pengantarnya menggantung tanpa link.\n  let kept = keptLines\n    .join('\\n')\n    .split('\\n')\n    .filter(l => !/\\b(link|daftar|sini|berikut|form)\\b[^\\n]*[:\\uff1a]\\s*$/i.test(l.trim()))\n    .join('\\n')\n    .replace(/\\n{3,}/g, '\\n\\n')\n    .trim();\n\n  const reply = linksReadOk ? buildClosedReply(kept) : LINK_UNVERIFIED_REPLY;\n  cleanOutput = kept ? kept + '\\n\\n' + reply : reply;\n  linkBlocked = true;\n  linkReplyAdded = true;\n\n  console.warn('SAFETY NET LINK aktif. Diblokir: ' + blockedUrls.join(' | '));\n  console.warn('  sebelum:', beforeLink);\n  console.warn('  sesudah:', cleanOutput);\n}\n\n// Fallback [SEND_GFORM] tanpa nama link akan menyisipkan link pendaftaran default.\n// Kalau URL barusan diblokir, itu berarti mengganti link yang ditolak dengan link\n// lain yang tidak diminta user - justru menyesatkan. Kalau AI menyebut nama link\n// secara eks ing(r['Nama Link'] || '')));\n  }\n\n  if (match && match['URL']) {\n    gformLinkName = match['Nama Link'];\n    const url = String(match['URL']).trim();\n\n    const linkMeta = `${match['Nama Link'] || ''} ${match['Deskripsi'] || ''}`.toLowerCase();\n    const isWaChannel =\n      /whatsapp\\.com\\/channel\\//i.test(url) ||\n      /chat\\.whatsapp\\.com\\//i.test(url) ||\n      /channel|komunitas|wa\\s*channel/i.test(linkMeta);\n\n    if (!cleanOutput.includes(url)) {\n      cleanOutput = isWaChannel\n        ? `${cleanOutput}\\n\\n👉 ${url}`\n        : `${cleanOutput}\\n\\n👉 ${url}\\n\\nKalau ada yang masih kurang jelas, bisa ngobrol langsung sama Sam yaa. tinggal ketik \"mau ngomong sama Sam\".`;\n    }\n    console.log('✅ Link injected inline:', match['Nama Link'], url, isWaChannel ? '(WA channel - tanpa imbuhan)' : '');\n  } else {\n    console.warn('⚠️ SEND_GFORM aktif tapi link tidak ditemukan/tidak aktif di LINKS. linkName=', gformLinkName || '(kosong)');\n    // User memang minta link, tapi barisnya tidak ada atau statusnya bukan aktif.\n    // Jangan diam saja - jujur bilang linknya belum bisa dikasih dan arahkan ke Sam.\n    if (!linkReplyAdded) {\n      cleanOutput = (cleanOutput + '\\n\\n' + buildClosedReply(cleanOutput)).trim();\n      linkReplyAdded = true;\n    }\n  }\n}\n\n// ── LOGGING ───────────────────────────────────────────────────\nif (isSendGForm)   console.log('📋 SEND_GFORM tag detected');\nif (isMockBooking) console.log('📅 MOCK_INTERVIEW_BOOKING detected:', JSON.stringify(mockBookingData));\nif (isUnknown)     console.log('❓ UNKNOWN tag detected');\n\n// ── RETURN ──────────────────────────────────────────────────\nreturn [{\n  json: {\n    ...chatCounter,\n    ...preprocess,\n    ...item.json, // overwrite dengan data terbaru jika ada konflik\n    cleanOutput,\n    transferBlocked,\n    linkBlocked,\n    blockedUrls,\n    isSendGForm,\n    gformLinkName,\n    isMockBooking,\n    mockBookingData,\n    isUnknown,\n    isPendaftaran,\n    pendaftaranData,\n    isDataComplete,\n    dataComplete,\n    isTalkToSam,\n    nama:    pendaftaranData.nama    || dataComplete.nama    || mockBookingData.nama || '',\n    program: pendaftaranData.program || dataComplete.program || 'Mock Interview',\n    needs_unknown: isUnknown ? 'true' : 'false',\n    can_record_to_sheet: isMockBooking || isPendaftaran || isDataComplete,\n    original_message: originalMessage,\n    is_new_user: isNewUser,\n    kelas_anak_merged: mergedKelas,\n    program_interest_merged: mergedProgram,\n    kelas_changed: kelasChanged,\n  }\n}];\n", "ProcessAll_r8": "const item = $input.first();\n\n// Ambil AI output dari Anthropic Chat Model\nlet aiOutput = '';\nif (item?.json?.content && Array.isArray(item.json.content) && item.json.content.length > 0) {\n  aiOutput = item.json.content[0].text || '';\n} else {\n  aiOutput = item?.json?.output || item?.json?.text || '';\n}\n\nconsole.log('AI Output preview:', aiOutput.substring(0, 300));\n\n// Ambil data konteks dari node Chat Counter dan Preprocess\nconst chatCounter = $('Chat Counter').first().json;\nconst preprocess = $('Preprocess - Context Detection').first().json;\n\n// Context data\nconst originalMessage = chatCounter.original_message || '';\nconst isNewUser = preprocess?.isNewUser || false;\n\n// ── TAG: [SEND_GFORM: Nama Link] ──────────────────────────────\nlet gformLinkName = '';\nlet isSendGForm = false;\nconst gformMatch = aiOutput.match(/\\[\\s*SEND_GFORM\\s*(?::\\s*([^\\]]*))?\\]/i);\nif (gformMatch) {\n  isSendGForm = true;\n  gformLinkName = (gformMatch[1] || '').trim();\n  console.log('📋 SEND_GFORM tag detected. linkName=', gformLinkName || '(kosong)');\n}\n\nif (!isSendGForm) {\n  const outputLower = aiOutput.toLowerCase();\n  const hasFormsUrl = aiOutput.includes('forms.gle');\n  const forgotTagPatterns = [\n    'link pendaftaran sudah saya kirim',\n    'link pendaftaran mock interview sudah saya kirim',\n    'silakan isi formnya',\n    'form sudah saya kirim',\n    'link penda TL-aware dari Cek_user_status). Union +\n// dedup -> tidak menimpa anak lain. Program DITURUNKAN dari kelas (bukan AI).\nconst KELAS_WL   = ['SD 1','SD 2','SD 3','SD 4','SD 5','SD 6','SMP 1','SMP 2','SMP 3','SMA 10/11','SMA 12'];\nconst KELAS_PROG = { 'SD 1':'','SD 2':'','SD 3':'','SD 4':'','SD 5':'','SD 6':'Junior','SMP 1':'Junior','SMP 2':'Intermediate','SMP 3':'Intermediate','SMA 12':'Seniors','SMA 10/11':'' };\nconst PROG_ORDER = ['Junior','Intermediate','Seniors'];\nconst toLabel = (s) => {\n  const t = String(s || '').toUpperCase().replace(/\\s+/g, ' ').trim();\n  return KELAS_WL.find(w => w.toUpperCase() === t) || null;\n};\n\nlet aiFactsKelas = [];\nconst factsMatch = aiOutput.match(/\\[\\s*FACTS\\b[^\\]]*\\bkelas\\s*=\\s*\"([^\"]*)\"[^\\]]*\\]/i);\nif (factsMatch && factsMatch[1]) {\n  aiFactsKelas = factsMatch[1].split(',').map(s => s.trim()).filter(Boolean);\n  console.log('🏷️ FACTS kelas dari AI:', aiFactsKelas);\n}\n\nconst regexGrades = Array.isArray(preprocess && preprocess.grades) ? preprocess.grades : [];\nlet existingFreshRaw = '';\ntry { existingFreshRaw = String($('Cek_user_status').first().json.kelas_anak_db || ''); } catch (e) {}\nconst existingFresh = existingFreshRaw.split(',').map(s => s.trim()).filter(Boolean);\n\nconst mergedSet = [];\nfor (const c of [...aiFactsKelas, ...regexGrades, ...existingFresh]) {\n  const lab = toLabel(c);\n  if (lab && !mergedSet.includes(lab)) mergedSet.push(lab);\n}\nconst mergedArr     = KELAS_WL.filter(w => mergedSet.includes(w)); // urut kanonik\nconst mergedKelas   = mergedArr.join(', ');\nconst progSet       = [...new Set(mergedArr.map(g => KELAS_PROG[g]).filter(Boolean))];\nconst mergedProgram = PROG_ORDER.filter(p => progSet.includes(p)).join(', ');\nconst existingCanon = KELAS_WL.filter(w => existingFresh.map(toLabel).includes(w)).join(', ');\nconst kelasChanged  = mergedKelas !== '' && mergedKelas !== existingCanon;\nif (kelasChanged) console.log(`📝 kelas_anak: \"${existingCanon}\" -> \"${mergedKelas}\" | program: \"${mergedProgram}\"`);\n\n\n// ── TAG: [PENDAFTARAN] (backward compat) ──────────────────────\nlet isPendaftaran = false;\nlet pendaftaranData = {};\nconst pendMatch = aiOutput.match(/\\[PENDAFTARAN\\](.*?)\\[\\/PENDAFTARAN\\]/s);\nif (pendMatch && pendMatch[1]) {\n  isPendaftaran = true;\n  const c = pendMatch[1];\n  const namaM    = c.match(/Nama:([^|]+)/);\n  const programM = c.match(/Program:([^|]+)/);\n  const batchM   = c.match(/Batch:([^|]+)/);\n  const asalM    = c.match(/Asal:([^|\\\\]]+)/);\n  pendaftaranData = {\n    nama:    namaM    ? namaM[1].trim()    : '',\n    program: programM ? programM[1].trim() : '',\n    batch:   batchM   ? batchM[1].trim()   : '',\n    asal:    asalM    ? asalM[1].trim()    : '',\n  };\n}\n\n// ── DATA_COMPLETE ──────────────────────────────────────────────\nlet isDataComplete = false;\nlet dataComplete = {};\nconst dcMatch = aiOutput.match(/\\[DATA_COMPLETE\\](.*?)\\[\\/DATA_COMPLETE\\]/s);\nif (dcMatch && dcMatch[1]) {\n  isDataComplete = true;\n  const c = dcMatch[1];\n  const namaM    = c.match(/Nama:([^|]+)/);\n  const noWaM    = c.match(/NoWA:([^|]+)/);\n  const programM = c.match(/Program:([^|\\\\]]+)/);\n  dataComplete = {\n    nama:    namaM    ? namaM[1].trim() : '',\n    noWA:    noWaM    ? noWaM[1].trim() : '',\n    program: programM ? programM[1].trim() : '',\n  };\n}\n\n// ── CLEAN OUTPUT (hapus semua tag sistem) ──────────────────────\nlet cleanOutput = aiOutput\n  .replace(/\\[\\s*SEND_GFORM\\s*(?::[^\\]]*)?\\]/gi, '')\n  .replace(/\\[MOCK_INTERVIEW_BOOKING\\].*?\\[\\/MOCK_INTERVIEW_BOOKING\\]/gs, '')\n  .replace(/\\[PENDAFTARAN\\].*?\\[\\/PENDAFTARAN\\]/gs, '')\n  .replace(/\\[DATA_COMPLETE\\].*?\\[\\/DATA_COMPLETE\\]/gs, '')\n  .replace(/\\[UNKNOWN\\]/g, '')\n  .replace(/\\[\\s*USER[_\\s]?STATUS\\s*:\\s*[^\\]]*\\]/gi, '')\n  .replace(/\\[\\s*FACTS\\b[^\\]]*\\]/gi, '')\n  .replace(/\\[TALK_TO_SAM\\]/g, '');\n\n// ── SIMPAN VERSI SEBELUM FILTER INTERNAL (guard anti-kosong) ──\nconst preInternalStrip = cleanOutput;\n\n// ── HAPUS KALIMAT PROSES INTERNAL ───────────────────────────\n// V4 FIX: daftar keyword DIPERSEMPIT ke frasa yang benar-benar\n// membocorkan proses internal (selalu menyebut sumber data).\n// Frasa percakapan normal (\"saya cek\", \"saya lihat\", \"dari data\")\n// DIHAPUS dari daftar — dulu menyebabkan balasan valid 1 kalimat\n// terhapus habis dan user menerima \"Maaf, terjadi kesalahan\".\nconst internalKeywords = [\n  'berdasarkan faq',\n  'berdasarkan data',\n  'menurut data',\n  'dari faq',\n  'dari sheet',\n  'dari referensi',\n  'data terverifikasi',\n  'faq relevan',\n  'faq yang tersedia',\n  'data yang tersedia',\n  'saya cek data',\n  'saya cek faq',\n  'saya cek sheet',\n  'saya cek di',\n  'cek di sheet',\n  'cek di database',\n  'ambil data dari',\n];\nconst keywordPattern = internalKeywords.join('|');\nconst internalRegex = new RegExp(`^\\\\s*([^.!?]*?(${keywordPattern})[^.!?]*[.!?]\\\\s*)`, 'i');\ncleanOutput = cleanOutput.replace(internalRegex, '');\n\n// Hapus juga kalimat yang diawali dengan kata-kata tersebut (tanpa titik)\nconst startPattern = new RegExp(`^\\\\s*(${keywordPattern}).*?(\\\\n|\\\\.|$)`, 'i');\ncleanOutput = cleanOutput.replace(startPattern, '');\n\n// Jaga-jaga: buang baris pertama jika terindikasi\nconst lines = cleanOutput.split('\\n');\nif (lines.length > 1) {\n  const firstLine = lines[0].toLowerCase();\n  if (internalKeywords.some(kw => firstLine.includes(kw))) {\n    lines.shift();\n    cleanOutput = lines.join('\\n');\n  }\n}\n\n// Kalimat pembuka \"Berdasarkan/Menurut/Dari + data/faq/sheet/referensi ...\"\ncleanOutput = cleanOutput.replace(/^\\s*(Berdasarkan|Menurut|Dari)\\s+(data|faq|sheet|referensi)[^.!?]*[.!?]\\s*/i, '');\n\n// Potong teks sebelum \": \" — hanya jika kalimat DIAWALI frasa proses internal\nconst colonMatch = cleanOutput.match(/^\\s*(Berdasarkan|Menurut|Dari)\\s+(data|faq|sheet|referensi)[^:]*:\\s*(.+)/is);\nif (colonMatch && colonMatch[3] && colonMatch[3].trim().length > 0) {\n  cleanOutput = colonMatch[3].trim();\n}\n\n// ── V4 GUARD ANTI-KOSONG ──────────────────────────────────────\n// Kalau filter internal menghapus SEMUA teks padahal AI punya\n// jawaban, kembalikan versi sebelum filter. Pesan error hanya\n// untuk kasus AI benar-benar tidak menghasilkan output.\nif (!cleanOutput.trim() && preInternalStrip.trim()) {\n  // Coba selamatkan isi setelah titik dua (\"Berdasarkan FAQ ...: <isi>\")\n  const rescue = preInternalStrip.match(/^\\s*[^:.!?\\n]{0,80}(?:data|faq|sheet|referensi)[^:.!?\\n]{0,80}:\\s*(.+)/is);\n  if (rescue && rescue[1] && rescue[1].trim()) {\n    console.warn('🛡️ GUARD: ambil isi setelah frasa internal.');\n    cleanOutput = rescue[1].trim();\n  } else {\n    console.warn('🛡️ GUARD: filter internal mengosongkan output — pakai versi asli.');\n    cleanOutput = preInternalStrip;\n  }\n}\n\ncleanOutput = cleanOutput.trim();\n\n// ── CLEAN MARKDOWN ──────────────────────────────────────────\nconst urlRegex = /https?:\\/\\/[^\\s)]+/g;\nconst maskedUrls = [];\ncleanOutput = cleanOutput.replace(urlRegex, (match) => {\n  maskedUrls.push(match);\n  return `\\x00URL${maskedUrls.length - 1}\\x00`;\n});\n\ncleanOutput = cleanOutput\n  .replace(/\\*\\*([^*]+)\\*\\*/g, '$1')\n  .replace(/\\*([^*]+)\\*/g, '$1')\n  .replace(/_([^_]+)_/g, '$1')\n  .replace(/~~([^~]+)~~/g, '$1')\n  .replace(/`([^`]+)`/g, '$1')\n  .replace(/[\\*_~`]/g, '');\n\ncleanOutput = cleanOutput\n  .replace(/(\\d)\\s*[—–]\\s*(\\d)/g, '$1-$2')\n  .replace(/\\s*[—–]\\s*/g, ', ')\n  .replace(/\\s*;\\s*/g, ', ')\n  .replace(/\\s{2,}/g, ' ')\n  .replace(/\\s+([,.])/g, '$1')\n  .replace(/,\\s*,/g, ',')\n  .trim();\n\ncleanOutput = cleanOutput.replace(\n  /\\x00URL(\\d+)\\x00/g,\n  (_, idx) => maskedUrls[parseInt(idx)]\n);\n\n// Safety net register netral: buang vokatif yang lolos dari prompt\ncleanOutput = cleanOutput\n  .replace(/(^|\\n)\\s*(Om\\s*\\/?\\s*Tante|Bapak\\s*\\/?\\s*Ibu|Pak\\s*\\/?\\s*Bu|Ayah\\s*\\/?\\s*Bunda)\\s*,\\s*/gi, '$1')\n  .replace(/\\s*\\b(Om\\s*\\/?\\s*Tante|Bapak\\s*\\/?\\s*Ibu|Pak\\s*\\/?\\s*Bu|Ayah\\s*\\/?\\s*Bunda)\\b\\s*/gi, ' ')\n  .replace(/\\s{2,}/g, ' ')\n  .replace(/\\s+,/g, ',')\n  .replace(/,\\s*,/g, ',')\n  .replace(/(^|\\n)\\s*,\\s*/g, '$1')\n  .trim();\n\n// ── SAFETY NET TRANSFER ─────────────────────────────────────\n// Sam: \"VIRA jangan pernah ngomong tentang transfer, transfer selalu dihandle sama gw.\"\n// Alur asli: user isi form -> Sam cek kualifikasi manual -> Sam sendiri yang bahas pembayaran.\n// Harga/nominal TETAP dilewatkan; yang dicegat cuma topik transfer & bukti bayar.\nconst TRANSFER_SAFE_REPLY = 'Baik, nanti akan dibantu cek dengan Sam yaa.';\nconst transferRegex = /(\\btransfer\\b|\\btf\\b|\\btrf\\b|\\brekening\\b|\\bnorek\\b|\\bno\\.?\\s*rek\\b|\\bnomor\\s*rekening\\b|bukti\\s*(transfer|bayar|pembayaran)|kirim\\s*bukti|konfirmasi\\s*pembayaran|pembayaran\\s*(nya\\s*)?(sudah|udah|telah)\\s*(masuk|diterima|kami\\s*terima)|sudah\\s*(saya|kami)\\s*terima\\s*pembayaran)/i;\n\nlet transferBlocked = false;\nif (transferRegex.test(cleanOutput)) {\n  const beforeNet = cleanOutput;\n\n  // Buang HANYA kalimat yang menyinggung transfer; kalimat lain (mis. harga) dipertahankan.\n  // Baris kosong asli dipertahankan supaya spasi paragraf & link tidak rusak.\n  const DROP = '\\x01';\n  const keptLines = cleanOutput\n    .split('\\n')\n    .map(line => {\n      const t = line.trim();\n      if (!t) return '';\n      const k = t\n        .split(/(?<=[.!?])\\s+/)\n        .filter(s => !transferRegex.test(s))\n        .join(' ')\n        .replace(/\\s{2,}/g, ' ')\n        .trim();\n      return k || DROP;\n    })\n    .filter(l => l !== DROP);\n\n  const kept = keptLines.join('\\n').replace(/\\n{3,}/g, '\\n\\n').trim();\n  cleanOutput = kept ? `${kept}\\n\\n${TRANSFER_SAFE_REPLY}` : TRANSFER_SAFE_REPLY;\n  transferBlocked = true;\n\n  console.warn('SAFETY NET TRANSFER aktif.');\n  console.warn('  sebelum:', beforeNet);\n  console.warn('  sesudah:', cleanOutput);\n}\n\n// ── SAFETY NET LINK (URL wajib terdaftar & AKTIF di tab LINKS) ──\n// Sam mengatur link lewat tab LINKS, tapi 7 baris FAQ menyimpan URL mentah di dalam\n// teks jawabannya. AI tinggal menyalin, sehingga link yang sudah di-Closed di LINKS\n// tetap terkirim: kasus Intensive Class UOB/CLI - LINKS \"Intensive Class\" sudah\n// Closed, tapi FAQ baris 104 masih memuat https://tinyurl.com/UOBCLIntensiveClass\n// (URL yang bahkan tidak terdaftar di LINKS). Filter di bawah menjadikan tab LINKS\n// satu-satunya gerbang: URL yang TIDAK terdaftar, atau terdaftar tapi TIDAK aktif,\n// dibuang sebelum pesan dikirim.\nconst LINK_UNVERIFIED_REPLY = 'Untuk linknya saya cek dulu yaa. Kalau mau lebih cepat, bisa ngobrol langsung sama Sam, tinggal ketik \"mau ngomong sama Sam\".';\n\n// Dicek CLOSED dulu: \"Nonaktif\" mengandung \"aktif\", jadi kalau OPEN dicek duluan\n// baris nonaktif salah terbaca sebagai aktif.\nconst LINK_CLOSED_RE = /(closed|close|tutup|ditutup|nonaktif|non\\s*-?\\s*aktif|inactive|expired|kadaluarsa|kedaluwarsa|selesai|\\boff\\b)/i;\nconst LINK_ACTIVE_RE = /(aktif|active|\\bon\\b|\\bya\\b|\\byes\\b)/i;\nconst isLinkActive = (st) => { const s = String(st || ''); return !LINK_CLOSED_RE.test(s) && LINK_ACTIVE_RE.test(s); };\n\n// Read LINKS Data ber-executeOnce: kalau node ini jalan di run kedua (debounce),\n// referensi run saat ini kosong walau datanya sudah terambil di run pertama.\n// Tanpa fallback ini guard akan memblokir link yang sebenarnya sah.\nconst pullLinks = () => {\n  const tryPull = (useFirstRun) => {\n    try {\n      const ref = $('Read LINKS Data');\n      const items = useFirstRun ? ref.all(0, 0) : ref.all();\n      return (items || []).map(i => i.json).filter(Boolean);\n    } catch (e) { return null; }\n  };\n  const now = tryPull(false);\n  if (now && now.length) return now;\n  const first = tryPull(true);\n  if (first && first.length) {\n    console.warn('SAFETY NET LINK: LINKS kosong di run ini, dipakai hasil run pertama. ' + first.length + ' baris.');\n    return first;\n  }\n  return [];\n};\n\nconst linkRowsGuard = pullLinks();\nconst linksReadOk = linkRowsGuard.length > 0;\nif (!linksReadOk) console.error('SAFETY NET LINK: tab LINKS tidak terbaca - semua URL diblokir demi aman.');\n\n// Sam: \"Mungkin bisa di-redirect untuk join channel WA ku saja.\"\n// URL channel diambil dari tab LINKS (bukan hardcode) supaya kalau Sam ganti channel\n// atau menonaktifkannya, balasan ini ikut menyesuaikan tanpa mengubah kode.\nconst waChannelRow = linkRowsGuard.find(r =>\n  isLinkActive(r['Status']) && (\n    /whatsapp\\.com\\/channel\\//i.test(String(r['URL'] || '')) ||\n    /chat\\.whatsapp\\.com\\//i.test(String(r['URL'] || '')) ||\n    /channel/i.test(String(r['Nama Link'] || ''))\n  )\n);\nconst waChannelUrl = waChannelRow ? String(waChannelRow['URL'] || '').trim() : '';\nconst SAM_TAIL = 'Kalau mau tanya-tanya lebih lanjut, tinggal ketik \"mau ngomong sama Sam\".';\n\n// txt = teks yang sudah ada di balasan. Kalau link channel-nya kebetulan sudah\n// disebut di situ, jangan diulang - user tidak perlu menerima URL yang sama 2x.\nconst buildClosedReply = (txt) => {\n  if (waChannelUrl && !String(txt || '').includes(waChannelUrl)) {\n    return 'Untuk sekarang pendaftarannya lagi ditutup yaa. Boleh join WhatsApp Channel-nya dulu, nanti info batch berikutnya saya share di sana:\\n\\n\\ud83d\\udc49 ' + waChannelUrl + '\\n\\n' + SAM_TAIL;\n  }\n  return 'Untuk sekarang pendaftarannya lagi ditutup yaa. ' + SAM_TAIL;\n};\n\n\n// Samakan bentuk URL sebelum dibandingkan: buang tanda baca penutup & slash akhir.\nconst normUrl = (u) => String(u || '').trim().toLowerCase()\n  .replace(/[)\\]\\.,;:!?\"'\\u00bb]+$/g, '')\n  .replace(/\\/+$/, '');\n\nconst activeUrlSet = new Set();\nconst knownUrlSet = new Set();\nfor (const r of linkRowsGuard) {\n  const u = normUrl(r['URL']);\n  if (!u) continue;\n  knownUrlSet.add(u);\n  if (isLinkActive(r['Status'])) activeUrlSet.add(u);\n}\n\nconst GUARD_URL_RE = /https?:\\/\\/[^\\s)]+/g;\nconst foundUrls = cleanOutput.match(GUARD_URL_RE) || [];\nconst blockedUrls = [];\nfor (const raw of foundUrls) {\n  const n = normUrl(raw);\n  if (linksReadOk && activeUrlSet.has(n)) continue;\n  blockedUrls.push(raw);\n  console.warn('SAFETY NET LINK: URL ditolak -> ' + raw + (knownUrlSet.has(n) ? ' (terdaftar di LINKS tapi TIDAK aktif)' : ' (TIDAK terdaftar di LINKS)'));\n}\n\nlet linkBlocked = false;\nlet linkReplyAdded = false;\nif (blockedUrls.length) {\n  const beforeLink = cleanOutput;\n  const hasBlocked = (s) => blockedUrls.some(u => s.includes(u));\n  const DROP_L = '\\x02';\n\n  // Buang HANYA kalimat yang memuat URL terlarang; kalimat lain dipertahankan.\n  const keptLines = cleanOutput\n    .split('\\n')\n    .map(line => {\n      const t = line.trim();\n      if (!t) return '';\n      const k = t\n        .split(/(?<=[.!?])\\s+/)\n        .filter(s => !hasBlocked(s))\n        .join(' ')\n        .replace(/\\s{2,}/g, ' ')\n        .trim();\n      return k || DROP_L;\n    })\n    .filter(l => l !== DROP_L);\n\n  // URL sering ditulis di baris sendiri sesudah kalimat pengantar (\"daftar di sini yaa:\").\n  // Tanpa ini pengantarnya menggantung tanpa link.\n  let kept = keptLines\n    .join('\\n')\n    .split('\\n')\n    .filter(l => !/\\b(link|daftar|sini|berikut|form)\\b[^\\n]*[:\\uff1a]\\s*$/i.test(l.trim()))\n    .join('\\n')\n    .replace(/\\n{3,}/g, '\\n\\n')\n    .trim();\n\n  const reply = linksReadOk ? buildClosedReply(kept) : LINK_UNVERIFIED_REPLY;\n  cleanOutput = kept ? kept + '\\n\\n' + reply : reply;\n  linkBlocked = true;\n  linkReplyAdded = true;\n\n  console.warn('SAFETY NET LINK aktif. Diblokir: ' + blockedUrls.join(' | '));\n  console.warn('  sebelum:', beforeLink);\n  console.warn('  sesudah:', cleanOutput);\n}\n\n// Fallback [SEND_GFORM] tanpa nama link akan menyisipkan link pendaftaran default.\n// Kalau URL barusan diblokir, itu berarti mengganti link yang ditolak dengan link\n// lain yang tidak diminta user - justru menyesatkan. Kalau AI menyebut nama link\n// secara eksplisit, resolusi normal tetap jalan (dan tetap disaring status aktif).\nif (linkBlocked && !gformLinkName) {\n  isSendGForm = false;\n  console.warn('SAFETY NET LINK: fallback SEND_GFORM dimatikan (tidak ada nama link eksplisit).');\n}\n\ncleanOutput = cleanOutput.replace(/(^|\\n)([a-z])/g, (m, p1, p2) => p1 + p2.toUpperCase());\n\n// ── FALLBACK: jika cleanOutput tetap kosong (AI tidak menghasilkan output) ──\nif (!cleanOutput || cleanOutput.trim() === '') {\n  console.warn('⚠️ cleanOutput kosong! Menggunakan fallback.');\n  if (isUnknown) {\n    cleanOutput = 'Maaf yaa, untuk pertanyaan ini saya belum punya jawabannya. Nanti saya cari tahu dan kabari lewat sini ya!';\n  } else {\n    cleanOutput = 'Maaf, terjadi kesalahan. Coba tanyakan ulang yaa.';\n  }\n}\n\n// ── RESOLVE & INJECT GFORM LINK (inline, data-driven) ───────────\nif (isSendGForm) {\n  let linkRows = [];\n  try {\n    linkRows = $('Read LINKS Data').all().map(i => i.json);\n  } catch (e) {\n    console.warn('⚠️ Tidak bisa baca node Read LINKS Data:', e.message);\n  }\n\n  const normL = s => String(s || '').toLowerCase().replace(/\\s+/g, ' ').trim();\n  // Pakai helper yang sama dengan SAFETY NET LINK: regex lama meloloskan\n  // \"Nonaktif\" (mengandung \"aktif\") dan \"Coming Soon\" tidak, tapi keduanya\n  // harus konsisten dengan gerbang di atas.\n  const activeRows = linkRows.filter(r => isLinkActive(r['Status']));\n\n  let match = null;\n  const rq = normL(gformLinkName);\n  if (rq) {\n    match = activeRows.find(r => normL(r['Nama Link']) === rq)\n         || activeRows.find(r => { const n = normL(r['Nama Link']); return n && (n.includes(rq) || rq.includes(n)); });\n  }\n  // AI tidak menyebut nama link -> default ke pendaftaran batch reguler\n  if (!match && !rq) {\n    match = activeRows.find(r => /pendaftaran batch/i.test(String(r['Nama Link'] || '')))\n         || activeRows.find(r => /gform|pendaftaran/i.test(String(r['Nama Link'] || '')));\n  }\n\n  if (match && match['URL']) {\n    gformLinkName = match['Nama Link'];\n    const url = String(match['URL']).trim();\n\n    const linkMeta = `${match['Nama Link'] || ''} ${match['Deskripsi'] || ''}`.toLowerCase();\n    const isWaChannel =\n      /whatsapp\\.com\\/channel\\//i.test(url) ||\n      /chat\\.whatsapp\\.com\\//i.test(url) ||\n      /channel|komunitas|wa\\s*channel/i.test(linkMeta);\n\n    if (!cleanOutput.includes(url)) {\n      cleanOutput = isWaChannel\n        ? `${cleanOutput}\\n\\n👉 ${url}`\n        : `${cleanOutput}\\n\\n👉 ${url}\\n\\nKalau ada yang masih kurang jelas, bisa ngobrol langsung sama Sam yaa. tinggal ketik \"mau ngomong sama Sam\".`;\n    }\n    console.log('✅ Link injected inline:', match['Nama Link'], url, isWaChannel ? '(WA channel - tanpa imbuhan)' : '');\n  } else {\n    console.warn('⚠️ SEND_GFORM aktif tapi link tidak ditemukan/tidak aktif di LINKS. linkName=', gformLinkName || '(kosong)');\n    // User memang minta link, tapi barisnya tidak ada atau statusnya bukan aktif.\n    // Jangan diam saja - jujur bilang linknya belum bisa dikasih dan arahkan ke Sam.\n    if (!linkReplyAdded) {\n      cleanOutput = (cleanOutput + '\\n\\n' + buildClosedReply(cleanOutput)).trim();\n      linkReplyAdded = true;\n    }\n  }\n}\n\n// ── LOGGING ───────────────────────────────────────────────────\nif (isSendGForm)   console.log('📋 SEND_GFORM tag detected');\nif (isMockBooking) console.log('📅 MOCK_INTERVIEW_BOOKING detected:', JSON.stringify(mockBookingData));\nif (isUnknown)     console.log('❓ UNKNOWN tag detected');\n\n// ── RETURN ──────────────────────────────────────────────────\nreturn [{\n  json: {\n    ...chatCounter,\n    ...preprocess,\n    ...item.json, // overwrite dengan data terbaru jika ada konflik\n    cleanOutput,\n    transferBlocked,\n    linkBlocked,\n    blockedUrls,\n    isSendGForm,\n    gformLinkName,\n    isMockBooking,\n    mockBookingData,\n    isUnknown,\n    isPendaftaran,\n    pendaftaranData,\n    isDataComplete,\n    dataComplete,\n    isTalkToSam,\n    nama:    pendaftaranData.nama    || dataComplete.nama    || mockBookingData.nama || '',\n    program: pendaftaranData.program || dataComplete.program || 'Mock Interview',\n    needs_unknown: isUnknown ? 'true' : 'false',\n    can_record_to_sheet: isMockBooking || isPendaftaran || isDataComplete,\n    original_message: originalMessage,\n    is_new_user: isNewUser,\n    kelas_anak_merged: mergedKelas,\n    program_interest_merged: mergedProgram,\n    kelas_changed: kelasChanged,\n  }\n}];\n"};

// ───────── stub runtime n8n ─────────
function Runner(){
  this.store={}; this.nodes={}; this.reads=0; this.logs=[];
}
Runner.prototype.ctx=function(inputItems){
  var self=this;
  function ref(name){
    var runs=self.nodes[name];
    if(!runs) throw new Error('Referenced node is unexecuted: '+name); // persis perilaku n8n
    return {
      all:function(b,r){ if(r!==undefined) return runs[r]||[]; return runs[runs.length-1]||[]; },
      first:function(){ var it=(runs[runs.length-1]||[])[0]; if(!it) throw new Error('no data '+name); return it; }
    };
  }
  return {
    $: ref,
    $input:{ first:function(){ return inputItems[0]; }, all:function(){ return inputItems; } },
    $getWorkflowStaticData:function(){ return self.store; },
    console:{ log:function(){self.logs.push(['log',[].join.call(arguments,' ')]);},
              warn:function(){self.logs.push(['warn',[].join.call(arguments,' ')]);},
              error:function(){self.logs.push(['error',[].join.call(arguments,' ')]);} }
  };
};
Runner.prototype.run=function(name,src,inputItems){
  var c=this.ctx(inputItems);
  var fn=new Function('$','$input','$getWorkflowStaticData','console','return (function(){'+src+'\n})()');
  var res=fn(c.$,c.$input,c.$getWorkflowStaticData,c.console)||[];
  if(!this.nodes[name]) this.nodes[name]=[];
  this.nodes[name].push(res);
  return res;
};
Runner.prototype.sheet=function(name,rows){ this.reads++;
  if(!this.nodes[name]) this.nodes[name]=[];
  this.nodes[name].push(rows.map(function(r){return {json:r};})); };

// jalankan satu "pesan" lewat jalur statis
function message(R, preprocess){
  R.nodes['Preprocess - Context Detection']=[[{json:preprocess}]];
  var cc=R.run('Cache Check',SRC.CacheCheck,[{json:preprocess}]);
  var hit=cc[0].json.cache_hit;
  var faqIn;
  if(hit){ faqIn=cc; }
  else{
    var t=tabs();
    R.sheet('Read FAQ',t['Read FAQ']);
    R.sheet('Read PROGRAM Data',t['Read PROGRAM Data']);
    R.sheet('Read ABOUT Data',t['Read ABOUT Data']);
    R.sheet('Read LINKS Data',t['Read LINKS Data']);
    faqIn=R.run('Cache Store',SRC.CacheStore,R.nodes['Read LINKS Data'][R.nodes['Read LINKS Data'].length-1]);
  }
  var faq=R.run('FAQ Retrieve',SRC.FAQRetrieve,faqIn);
  return {hit:hit,faq:faq,cc:cc};
}

sec('3. Process All / SAFETY NET LINK saat cache KENA (inti bug)');

function runProcessAll(src, cachedHit){
  var R2=new Runner();
  // siapkan konteks
  R2.nodes['Chat Counter']=[[{json:{original_message:'mau daftar batch 12',user_wa:'628111'}}]];
  R2.nodes['Preprocess - Context Detection']=[[{json:PRE}]];
  R2.nodes['Cek_user_status']=[[{json:{status:'ON'}}]];
  if(cachedHit){
    // cache KENA: Cache Check jalan (bawa _cache), Read LINKS Data TIDAK jalan
    R2.nodes['Cache Check']=[[{json:{cache_hit:true,_cache:tabs()}}]];
  }else{
    R2.nodes['Cache Check']=[[{json:{cache_hit:false,_cache:null}}]];
    R2.sheet('Read LINKS Data',LINKS);
    R2.nodes['Cache Store']=[[{json:{_cache:tabs(),cache_stored:true}}]];
  }
  var ai=[{json:{content:[{text:'Boleh banget! Ini link pendaftarannya ya: https://forms.gle/BATCH12 Silakan diisi.'}]}}];
  var res=R2.run('Process All',src,ai);
  return {out:(res[0]&&res[0].json)||{},logs:R2.logs};
}
