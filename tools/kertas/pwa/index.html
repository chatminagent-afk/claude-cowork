<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#0C6B4F" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Kertas" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<title>Kertas</title>
<script>
/* Dijalankan sebelum halaman dilukis. Tanpa ini, mode gelap akan berkedip
   putih sepersekian detik tiap kali app dibuka. */
(function(){
  var pref="auto";
  try{ var raw=localStorage.getItem("kertas.v1"); if(raw){ var p=JSON.parse(raw).theme; if(p) pref=p; } }catch(e){}
  var dark = pref==="dark" || (pref==="auto" && window.matchMedia &&
             window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme", dark?"dark":"light");
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root, [data-theme="light"]{
  --paper:#E8EDEA; --surf:#FCFDFC; --surf2:#F1F4F2; --ink:#0E1A16; --ink2:#3A4A44;
  --muted:#5A6C66; --line:#D6DEDA; --pine:#0C6B4F; --pine-soft:#E2EFEA;
  --amber:#B7791F; --brick:#A83A2B;
  /* Warna semantik: yang ini yang membuat mode gelap tidak sekadar dibalik. */
  --inverse-bg:#0E1A16; --inverse-fg:#EAF1EE;   /* toast, chip aktif */
  --on-pine:#FFFFFF;                            /* teks di atas warna pine */
  --warn-bg:#FBF1DE; --warn-fg:#6B5416; --warn-line:#E8D5A8;
  --err-bg:#F7E4E0;  --err-fg:#7A2A1E;  --err-line:#E9C3BB;
  --code-bg:#101A17; --code-fg:#C8E0D6;
  --box-line:#B6C6BF; --track-off:#C9D6D0;
  --nav-bg:rgba(252,253,252,.94); --empty-bg:rgba(255,255,255,.45);
  --gbtn-bg:#FFFFFF; --gbtn-fg:#3C4043; --gbtn-line:#DADCE0; --gbtn-active:#F8F9FA;
  --btn-ghost:rgba(0,0,0,.08);
  --ease:cubic-bezier(.2,.8,.2,1);
  --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
/* Bukan pembalikan warna: hijau pine dicerahkan supaya tetap terbaca di atas
   latar gelap, dan setiap permukaan naik sedikit ketimbang latar dasarnya. */
[data-theme="dark"]{
  --paper:#0E1613; --surf:#16211D; --surf2:#1D2A25; --ink:#E4ECE8; --ink2:#B7C7C0;
  --muted:#82988F; --line:#27362F; --pine:#5CC69C; --pine-soft:#1B322A;
  --amber:#E0B454; --brick:#E58A78;
  --inverse-bg:#E4ECE8; --inverse-fg:#0E1613;
  --on-pine:#06201A;
  --warn-bg:#2C2617; --warn-fg:#E8CE93; --warn-line:#4A3F22;
  --err-bg:#2E1A17;  --err-fg:#F0B3A6;  --err-line:#4C2A24;
  --code-bg:#0A120F; --code-fg:#C8E0D6;
  --box-line:#3D5148; --track-off:#33453D;
  --nav-bg:rgba(22,33,29,.94); --empty-bg:rgba(255,255,255,.035);
  --gbtn-bg:#131314; --gbtn-fg:#E3E3E3; --gbtn-line:#5F6368; --gbtn-active:#1E1F20;
  --btn-ghost:rgba(255,255,255,.13);
  color-scheme:dark;   /* kalender & jam bawaan HP ikut gelap */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior-y:none}
body{background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;padding-top:var(--safe-top)}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px;border-radius:6px}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:none}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.h{font-family:'Bricolage Grotesque',Georgia,serif;font-weight:600;letter-spacing:-.025em;line-height:1.1}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

header{padding:12px 18px 10px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex:0 0 auto}
#title{font-size:26px}
#sub{font-size:12px;color:var(--muted);margin-top:3px}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:12px}
nav{flex:0 0 auto;display:flex;border-top:1px solid var(--line);background:var(--nav-bg);
  backdrop-filter:blur(10px);padding:6px 8px calc(10px + var(--safe-bot))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 4px;
  color:var(--muted);font-size:10px;font-weight:500;border-radius:12px;position:relative;transition:.2s var(--ease)}
nav button[data-on="1"]{color:var(--pine)}
nav button[data-on="1"]::before{content:"";position:absolute;top:0;width:16px;height:2px;border-radius:2px;background:var(--pine)}
nav button:active{transform:scale(.94)}
svg{stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav svg{width:19px;height:19px}

.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px 5px 9px;border-radius:20px;font-size:11px;
  font-weight:500;border:1px solid var(--line);background:var(--surf)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--pine);flex:0 0 auto}
.dot.busy{background:var(--amber);animation:pulse 1.1s infinite}
.dot.off{background:var(--brick)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.iconbtn{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--surf);
  display:grid;place-items:center;color:var(--ink2);transition:.18s var(--ease);flex:0 0 auto}
.iconbtn:active{transform:scale(.92)}
.iconbtn svg{width:16px;height:16px}

.sec{padding:2px 18px 4px;display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.list{padding:0 18px}
.row{position:relative;background:var(--surf);border:1px solid var(--line);border-radius:14px;
  padding:12px 13px 12px 20px;margin-bottom:8px;transition:.2s var(--ease);animation:rise .38s var(--ease) both;
  width:100%;text-align:left;display:block}
.row:active{transform:scale(.99)}
.spine{position:absolute;left:9px;top:12px;bottom:12px;width:2px;border-radius:2px;background:var(--line)}
.spine.synced{background:linear-gradient(180deg,var(--pine),#7FB5A0)}
.spine.pending{background:linear-gradient(180deg,var(--amber),#E5C48A)}
.spine.offline{background:repeating-linear-gradient(180deg,var(--brick) 0 3px,transparent 3px 6px)}
.rowtitle{font-size:14.5px;font-weight:600;letter-spacing:-.01em;line-height:1.3;word-break:break-word}
.rowsnip{font-size:12.5px;color:var(--ink2);margin-top:3px;line-height:1.45;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rowmeta{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:10.5px;color:var(--muted);flex-wrap:wrap}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade{animation:fade .28s var(--ease) both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.chips{display:flex;gap:6px;padding:6px 18px 4px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:500;border:1px solid var(--line);
  background:var(--surf);color:var(--ink2);white-space:nowrap;transition:.18s var(--ease)}
.chip[data-on="1"]{background:var(--inverse-bg);border-color:var(--inverse-bg);color:var(--inverse-fg)}
.chip:active{transform:scale(.95)}

.field{margin:4px 18px 2px;display:flex;align-items:center;gap:8px;background:var(--surf2);
  border:1px solid transparent;border-radius:12px;padding:10px 12px;transition:.2s var(--ease)}
.field:focus-within{background:var(--surf);border-color:var(--pine)}
.field input{border:0;background:transparent;outline:0;font-size:16px;width:100%}
.field svg{width:15px;height:15px;stroke:var(--muted);flex:0 0 auto}

.task{display:flex;gap:11px;align-items:flex-start;background:var(--surf);border:1px solid var(--line);
  border-radius:14px;padding:12px;margin-bottom:7px;animation:rise .38s var(--ease) both;
  transition:height .3s var(--ease),padding .3s var(--ease),margin .3s var(--ease),
             opacity .22s var(--ease),transform .3s var(--ease),background .2s var(--ease)}
.box{width:21px;height:21px;border-radius:7px;border:1.6px solid var(--box-line);flex:0 0 auto;margin-top:1px;
  display:grid;place-items:center;transition:.22s var(--ease);background:var(--surf)}
.box[data-on="1"]{background:var(--pine);border-color:var(--pine)}
.box svg{width:12px;height:12px;stroke:var(--on-pine);stroke-width:3.4;stroke-dasharray:24;stroke-dashoffset:24;
  transition:stroke-dashoffset .3s var(--ease) .04s}
.box[data-on="1"] svg{stroke-dashoffset:0}
.box.pop{animation:pop .32s var(--ease)}
@keyframes pop{0%{transform:scale(1)}42%{transform:scale(1.24)}100%{transform:scale(1)}}
.tasktext{font-size:14.5px;font-weight:500;line-height:1.35;position:relative;display:inline-block;word-break:break-word}
.tasktext::after{content:"";position:absolute;left:0;top:52%;height:1.4px;background:var(--muted);width:0;transition:width .34s var(--ease) .06s}
.task[data-done="1"] .tasktext{color:var(--muted)}
.task[data-done="1"] .tasktext::after{width:100%}

/* Dicentang: centang menggambar dirinya dan coretannya menyapu dulu di tempat.
   Baru setelah itu barisnya menyusut dan muncul di bagian Selesai. Tanpa jeda
   itu tugasnya terasa "hilang", bukan "selesai" — dan orang jadi ragu apakah
   tekanannya masuk. Ini yang ditiru dari Google Tasks. */
.task.leaving{animation:none!important;opacity:0;transform:translateX(20px);
  height:0!important;padding-top:0!important;padding-bottom:0!important;
  margin-bottom:0!important;border-top-width:0!important;border-bottom-width:0!important;overflow:hidden}
.task.landing{animation:land .42s var(--ease) both}
@keyframes land{0%{opacity:0;transform:translateY(-12px) scale(.96)}
  58%{opacity:1;transform:translateY(0) scale(1.015)}100%{opacity:1;transform:none}}
/* Menyusun ulang daftar setelah satu centang tidak boleh membuat semua baris
   lain ikut meluncur masuk lagi. Yang bergerak hanya yang memang pindah. */
.list.quiet .task{animation:none}
.list.quiet .task.landing{animation:land .42s var(--ease) both}
.donefoot{font-size:11px;color:var(--muted);padding:2px 18px 4px;line-height:1.5}

.donehead{display:flex;align-items:center;gap:8px;width:100%;padding:14px 18px 6px;text-align:left;
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.donehead .caret{width:12px;height:12px;stroke-width:2.8;flex:0 0 auto;transition:transform .26s var(--ease)}
.donehead .caret[data-open="1"]{transform:rotate(90deg)}
.donehead .cnt{margin-left:auto;letter-spacing:.1em}
.donewrap{overflow:hidden;transition:max-height .34s var(--ease),opacity .26s var(--ease)}
.donewrap[data-open="1"]{max-height:3000px;opacity:1}
.donewrap[data-open="0"]{max-height:0;opacity:0}
/* Yang sudah selesai tidak lagi menuntut perhatian: kartunya dilepas,
   tinggal teks tercoret di atas latar halaman. */
.donewrap .task{background:transparent;border-color:transparent;padding:9px 12px;margin-bottom:1px}
.donewrap .task .rowmeta{opacity:.7}
.badge{font-size:10px;padding:2px 7px;border-radius:6px;background:var(--surf2);color:var(--ink2);font-weight:500;
  display:inline-flex;align-items:center;gap:4px}
.badge svg{width:10px;height:10px;stroke-width:2.4}
.badge.late{background:var(--err-bg);color:var(--err-fg)}
.badge.hi{background:var(--pine-soft);color:var(--pine)}
.badge.bell{background:var(--warn-bg);color:var(--warn-fg)}
/* Tag section di tiap thumbnail catatan. Sengaja diberi warna pine dan ditaruh
   paling depan — dulu ia cuma teks abu-abu yang tenggelam di antara metadata. */
.badge.fold{background:var(--pine-soft);color:var(--pine);font-weight:600}
.badge.fold svg{stroke-width:2;opacity:.85}
.chip.add{border-style:dashed;color:var(--pine);border-color:var(--box-line);
  display:inline-flex;align-items:center;gap:5px;padding-left:9px}
.chip.add svg{width:12px;height:12px;stroke-width:2.6}
.folderrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.folderrow .nm{flex:1;font-size:14px;font-weight:500}
.folderrow .ct{font-size:11px;color:var(--muted)}
.folderrow button{color:var(--brick);padding:7px 9px;border-radius:9px;font-size:12px;background:var(--btn-ghost)}

.empty{padding:20px 14px;text-align:center;border:1px dashed var(--line);border-radius:14px;background:var(--empty-bg)}
.empty b{display:block;font-size:13.5px;margin-top:6px}
.empty span{font-size:11.5px;color:var(--muted)}

.fab{position:fixed;right:16px;bottom:calc(80px + var(--safe-bot));width:52px;height:52px;border-radius:17px;
  background:var(--pine);color:var(--on-pine);display:grid;place-items:center;z-index:5;
  box-shadow:0 12px 26px -8px rgba(12,107,79,.6);transition:.22s var(--ease)}
.fab:active{transform:scale(.9)}
.fab svg{width:22px;height:22px;stroke:var(--on-pine);stroke-width:2.2}

#editor{position:fixed;inset:0;background:var(--paper);z-index:20;display:none;flex-direction:column;padding-top:var(--safe-top)}
#editor.on{display:flex;animation:sheet .3s var(--ease) both}
@keyframes sheet{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}
#etitle{border:0;background:transparent;outline:0;width:100%;font-size:24px;padding:0 18px}
#blocks{flex:1;overflow-y:auto;padding:8px 0 12px}
.blk{display:flex;align-items:flex-start;gap:8px;padding:1px 18px;position:relative}
.blk .gutter{flex:0 0 auto;display:flex;align-items:flex-start;justify-content:flex-end;min-width:18px;
  padding-top:7px;font-size:14px;color:var(--muted);user-select:none}
.blk .gutter .box{width:19px;height:19px;margin-top:-1px}
.btext{flex:1;border:0;background:transparent;outline:0;resize:none;overflow:hidden;
  font:inherit;font-size:16px;line-height:1.6;padding:4px 0;min-height:28px;width:100%}
.blk[data-t="h1"] .btext{font-family:'Bricolage Grotesque',Georgia,serif;font-size:22px;font-weight:600;letter-spacing:-.02em;padding-top:12px}
.blk[data-t="h2"] .btext{font-family:'Bricolage Grotesque',Georgia,serif;font-size:18px;font-weight:600;letter-spacing:-.015em;padding-top:10px}
.blk[data-t="quote"] .btext{border-left:2px solid var(--pine);padding-left:11px;color:var(--ink2)}
.blk[data-t="code"] .wrap{flex:1;background:var(--code-bg);border-radius:12px;padding:11px 12px;position:relative}
.blk[data-t="code"] .btext{font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.65;color:var(--code-fg);white-space:pre}
.blk[data-t="code"] .copy{position:absolute;top:7px;right:8px;font-size:10px;color:#7E9A8F;padding:4px 7px;border-radius:7px;background:rgba(255,255,255,.07)}
.blk[data-checked="1"] .btext{color:var(--muted);text-decoration:line-through}
.divider{flex:1;height:1px;background:var(--line);margin:14px 0}
.tool{display:flex;gap:6px;padding:7px 14px;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line);
  background:var(--surf);padding-bottom:calc(7px + var(--safe-bot));flex:0 0 auto}
.tool::-webkit-scrollbar{display:none}
.tool .chip{display:inline-flex;align-items:center;gap:5px;padding:7px 11px}
.tool .chip svg{width:13px;height:13px}

#scrim{position:fixed;inset:0;background:rgba(14,26,22,.5);z-index:40;display:none;align-items:flex-end;justify-content:center}
#scrim.on{display:flex}
#scrim.center{align-items:center;padding:22px}
.sheet{background:var(--surf);border-radius:22px 22px 0 0;padding:18px 18px calc(22px + var(--safe-bot));width:100%;
  max-width:520px;max-height:88vh;overflow-y:auto;animation:up .3s var(--ease) both}
#scrim.center .sheet{border-radius:20px;max-width:380px;animation:sheet .28s var(--ease) both}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:36px;height:4px;border-radius:4px;background:var(--line);margin:-6px auto 14px}
.frow{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}
.frow svg{width:17px;height:17px;stroke:var(--muted);flex:0 0 auto}
.frow label{font-size:13.5px;flex:1}
.frow input,.frow select{border:1px solid var(--line);background:var(--surf2);border-radius:10px;padding:8px 10px;
  font-size:15px;outline:0;max-width:176px}
#toast{position:fixed;left:18px;right:18px;bottom:calc(76px + var(--safe-bot));background:var(--inverse-bg);color:var(--inverse-fg);
  border-radius:13px;padding:12px 14px;font-size:12.5px;z-index:60;display:none}
#toast.on{display:block;animation:sheet .3s var(--ease) both}

.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:8px}
#banner{flex:0 0 auto;display:none;margin:0 18px 6px;padding:11px 13px;border-radius:13px;font-size:12.5px;
  line-height:1.5;align-items:center;gap:10px;animation:rise .3s var(--ease) both}
#banner.on{display:flex}
#banner.warn{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-fg)}
#banner.err{background:var(--err-bg);border:1px solid var(--err-line);color:var(--err-fg)}
#banner button{background:var(--btn-ghost);border-radius:9px;padding:7px 11px;font-size:12px;font-weight:600;
  margin-left:auto;white-space:nowrap;color:inherit}
.lbl{font-size:11px;color:var(--muted);margin:14px 18px 6px;display:block}
.ledger{background:var(--code-bg);border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 18px;font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;line-height:1.75;color:#9DBBAF;max-height:170px;overflow:auto}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 13px;background:var(--surf);
  border:1px solid var(--line);border-radius:13px;margin-bottom:7px;font-size:13.5px}
.track{width:42px;height:24px;border-radius:20px;background:var(--track-off);position:relative;transition:.24s var(--ease);flex:0 0 auto}
.track[data-on="1"]{background:var(--pine)}
.knob{position:absolute;top:2.5px;left:2.5px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.24s var(--ease)}
.track[data-on="1"] .knob{left:20.5px}
.btn{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surf);
  font-size:13.5px;font-weight:500;margin-bottom:7px;transition:.18s var(--ease);text-align:left;display:block}
.btn:active{transform:scale(.99)}
.btn.primary{background:var(--pine);border-color:var(--pine);color:var(--on-pine);text-align:center}
.btn.danger{color:var(--brick)}
.note{font-size:11.5px;color:var(--muted);line-height:1.55;padding:0 20px 14px}
a{color:var(--pine)}

.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:11px;padding:13px;border-radius:12px;
  background:var(--gbtn-bg);border:1px solid var(--gbtn-line);font-size:14.5px;font-weight:600;color:var(--gbtn-fg);
  box-shadow:0 1px 3px rgba(0,0,0,.16);transition:.18s var(--ease)}
.gbtn:active{transform:scale(.985);background:var(--gbtn-active)}
.gbtn[disabled]{opacity:.45}
.gbtn svg{width:19px;height:19px;stroke:none}

#setup{position:fixed;inset:0;z-index:70;background:var(--paper);overflow-y:auto;display:none;
  padding:calc(26px + var(--safe-top)) 20px calc(30px + var(--safe-bot))}
#setup.on{display:block}
.step{display:flex;gap:12px;margin-bottom:16px}
.stepn{width:24px;height:24px;border-radius:50%;background:var(--pine);color:var(--on-pine);flex:0 0 auto;

<script>
"use strict";
/* ==========================================================================
   KERTAS PWA 1.2 — catatan blok + tugas berpengingat, tersimpan di Drive
   ========================================================================== */

/* ================= 1. LOGIKA MURNI (diuji, tanpa DOM) ==================== */

const LOGIC = {
  truncate(s,n){ s=String(s||""); return s.length<=n?s:s.slice(0,Math.max(0,n-1)).trimEnd()+"…"; },
  dayKey(iso){ return String(iso||"").slice(0,10); },
  today(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); },
  /* updatedAt disimpan dalam UTC. Mengirisnya mentah-mentah membuat tugas yang
     diselesaikan lewat tengah malam WIB terhitung "kemarin". */
  localDayKey(iso){
    const d=new Date(iso);
    return isNaN(d.getTime())?"":new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
  },
  relTime(fromISO,now){
    const a=new Date(fromISO).getTime(), b=(now?new Date(now):new Date()).getTime();
    if(isNaN(a)||isNaN(b)) return "—";
    const s=Math.round((b-a)/1000);
    if(s<45) return "baru saja";
    if(s<3600) return Math.round(s/60)+" mnt lalu";
    if(s<86400) return Math.round(s/3600)+" jam lalu";
    if(s<604800) return Math.round(s/86400)+" hr lalu";
    return new Date(fromISO).toLocaleDateString("id-ID",{day:"numeric",month:"short"});
  },

  /* ---------- blok catatan ---------- */
  newBlock(type,text){ return {id:"b"+Math.random().toString(36).slice(2,8),type:type||"text",text:text||"",checked:false}; },

  /* Pintasan yang diketik langsung, seperti Samsung Notes / Notion. */
  shortcut(text){
    const m=[
      [/^#\s/,"h1"],[/^##\s/,"h2"],[/^###\s/,"h2"],
      [/^-\s\[\s?\]\s/,"todo"],[/^\[\s?\]\s/,"todo"],[/^\[x\]\s/i,"todo"],
      [/^[-*+]\s/,"bullet"],[/^\d+[.)]\s/,"num"],
      [/^>\s/,"quote"],[/^```/,"code"],[/^(---|___|\*\*\*)$/,"divider"]
    ];
    for(const [re,type] of m){
      if(re.test(text)) return {type, text: type==="divider" ? "" : text.replace(re,"")};
    }
    return null;
  },
  splitBlock(block,caret){
    const t=block.text||"";
    const carry=(block.type==="bullet"||block.type==="num"||block.type==="todo")?block.type:"text";
    return { left:{...block,text:t.slice(0,caret)}, right:LOGIC.newBlock(carry,t.slice(caret)) };
  },
  numberOf(blocks,i){
    let n=1;
    for(let k=i-1;k>=0;k--){ if(blocks[k]&&blocks[k].type==="num") n++; else break; }
    return n;
  },
  blocksToMarkdown(blocks){
    const out=[];
    (blocks||[]).forEach((b,i)=>{
      const t=b.text||"";
      switch(b.type){
        case "h1": out.push("# "+t); break;
        case "h2": out.push("## "+t); break;
        case "bullet": out.push("- "+t); break;
        case "num": out.push(LOGIC.numberOf(blocks,i)+". "+t); break;
        case "todo": out.push((b.checked?"- [x] ":"- [ ] ")+t); break;
        case "quote": out.push("> "+t); break;
        case "code": out.push("```\n"+t+"\n```"); break;
        case "divider": out.push("---"); break;
        default: out.push(t);
      }
    });
    return out.join("\n\n").trim();
  },
  markdownToBlocks(md){
    const lines=String(md||"").replace(/\r\n/g,"\n").split("\n");
    const blocks=[];
    for(let i=0;i<lines.length;i++){
      const line=lines[i];
      if(line.trim()==="") continue;
      if(/^```/.test(line.trim())){
        const buf=[]; i++;
        while(i<lines.length&&!/^```\s*$/.test(lines[i].trim())){ buf.push(lines[i]); i++; }
        blocks.push(LOGIC.newBlock("code",buf.join("\n"))); continue;
      }
      if(/^(---|___|\*\*\*)\s*$/.test(line.trim())){ blocks.push(LOGIC.newBlock("divider","")); continue; }
      let m;
      if((m=line.match(/^##\s+(.*)$/))) blocks.push(LOGIC.newBlock("h2",m[1]));
      else if((m=line.match(/^#\s+(.*)$/))) blocks.push(LOGIC.newBlock("h1",m[1]));
      else if((m=line.match(/^-\s\[([ xX])\]\s?(.*)$/))){
        const b=LOGIC.newBlock("todo",m[2]); b.checked=m[1].toLowerCase()==="x"; blocks.push(b);
      }
      else if((m=line.match(/^[-*+]\s+(.*)$/))) blocks.push(LOGIC.newBlock("bullet",m[1]));
      else if((m=line.match(/^\d+[.)]\s+(.*)$/))) blocks.push(LOGIC.newBlock("num",m[1]));
      else if((m=line.match(/^>\s?(.*)$/))) blocks.push(LOGIC.newBlock("quote",m[1]));
      else blocks.push(LOGIC.newBlock("text",line));
    }
    return blocks.length?blocks:[LOGIC.newBlock("text","")];
  },
  noteToMarkdown(n){
    return ("# "+((n.title||"Tanpa judul").trim())+"\n\n"+LOGIC.blocksToMarkdown(n.blocks)).trim()+"\n";
  },
  markdownToNote(md){
    const blocks=LOGIC.markdownToBlocks(md);
    let title="";
    if(blocks.length&&blocks[0].type==="h1"){ title=blocks[0].text; blocks.shift(); }
    return { title, blocks: blocks.length?blocks:[LOGIC.newBlock("text","")] };
  },
  noteSnippet(n){
    return (n.blocks||[]).map(b=>b.type==="todo"?(b.checked?"☑ ":"☐ ")+b.text:b.text).filter(Boolean).join(" · ");
  },

  /* ---------- tugas & pengingat ---------- */
  dueAt(t){ return (t&&t.due) ? t.due+"T"+(t.time||"23:59")+":00" : null; },
  remindAt(t){
    const due=LOGIC.dueAt(t);
    if(!due||t.remind===null||t.remind===undefined||t.remind==="") return null;
    const ms=new Date(due).getTime()-Number(t.remind)*60000;
    return isNaN(ms)?null:new Date(ms).toISOString();
  },
  isOverdue(t,todayKey){ return !!(t&&t.due&&!t.done&&LOGIC.dayKey(t.due)<todayKey); },
  shouldNotify(t,nowMs,notified){
    if(!t||t.done||t.deleted) return false;
    if((notified||[]).includes(t.id+"@"+(t.updatedAt||""))) return false;
    const at=LOGIC.remindAt(t); if(!at) return false;
    const ms=new Date(at).getTime();
    return ms<=nowMs && nowMs-ms<86400000;
  },
  sortTasks(tasks,mode,todayKey){
    const live=(tasks||[]).filter(t=>t&&!t.deleted);
    let pool;
    if(mode==="done") pool=live.filter(t=>t.done);
    else if(mode==="today") pool=live.filter(t=>!t.done&&t.due&&LOGIC.dayKey(t.due)<=todayKey);
    else pool=live.filter(t=>!t.done&&(!t.due||LOGIC.dayKey(t.due)>todayKey));
    const rank={high:0,normal:1,low:2};
    return pool.slice().sort((a,b)=>{
      if(mode==="done") return String(b.updatedAt||"").localeCompare(String(a.updatedAt||""));
      const ad=(a.due||"9999-12-31")+"T"+(a.time||"23:59");
      const bd=(b.due||"9999-12-31")+"T"+(b.time||"23:59");
      if(ad!==bd) return ad<bd?-1:1;
      const ar=rank[a.priority]??1, br=rank[b.priority]??1;
      if(ar!==br) return ar-br;
      return String(a.title).localeCompare(String(b.title));
    });
  },
  /* Daftar "Selesai" yang tampil di bawah daftar aktif, seperti Google Tasks.
     scope "today" hanya yang diselesaikan hari ini — kalau tidak, tab Hari ini
     lama-lama jadi arsip seumur hidup. */
  doneList(tasks,todayKey,scope){
    let pool=(tasks||[]).filter(t=>t&&!t.deleted&&t.done);
    if(scope==="today") pool=pool.filter(t=>LOGIC.localDayKey(t.updatedAt)===todayKey);
    return pool.slice().sort((a,b)=>String(b.updatedAt||"").localeCompare(String(a.updatedAt||"")));
  },
  /* ---------- section catatan ---------- */
  normalizeFolder(v){ return String(v||"").replace(/\s+/g," ").trim().slice(0,20); },
  /* Mengembalikan alasan penolakan, atau null kalau namanya boleh dipakai.
     "Semua" harus dijaga: ia bukan section, melainkan penyaring yang berarti
     "jangan disaring" — kalau sampai jadi section, catatannya tak terlihat. */
  folderError(v,existing){
    const n=LOGIC.normalizeFolder(v);
    if(!n) return "Nama section belum diisi.";
    if(n.toLowerCase()==="semua") return '"Semua" dipakai sistem untuk menampilkan semuanya. Pilih nama lain.';
    if((existing||[]).some(f=>String(f).toLowerCase()===n.toLowerCase())) return 'Section "'+n+'" sudah ada.';
    return null;
  },
  /* Section yang datang dari HP lain lewat Drive harus ikut terdaftar di sini,
     kalau tidak catatannya tersaring habis dan seolah hilang. */
  mergeFolders(known,found){
    const out=[...(known||[])];
    for(const f of (found||[])){
      const n=LOGIC.normalizeFolder(f);
      if(n&&n.toLowerCase()!=="semua"&&!out.some(x=>String(x).toLowerCase()===n.toLowerCase())) out.push(n);
    }
    return out;
  },
  filterNotes(notes,query,folder){
    const q=String(query||"").trim().toLowerCase();
    let out=(notes||[]).filter(n=>n&&!n.deleted);
    if(folder&&folder!=="Semua") out=out.filter(n=>n.folder===folder);
    if(q) out=out.filter(n=>((n.title||"")+" "+LOGIC.noteSnippet(n)).toLowerCase().includes(q));
    return out.slice().sort((a,b)=>{
      if(!!b.pinned!==!!a.pinned) return b.pinned?1:-1;
      return String(b.updatedAt).localeCompare(String(a.updatedAt));
    });
  },

  /* ---------- CSV (Google Sheet) ---------- */
  TASK_COLS:["id","title","due","time","remind","done","list","priority","notes","updatedAt"],
  csvCell(v){ const s=String(v??""); return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; },
  tasksToCsv(tasks){
    const rows=(tasks||[]).filter(t=>!t.deleted).map(t=>[t.id,t.title,t.due||"",t.time||"",
      (t.remind===null||t.remind===undefined||t.remind==="")?"":String(t.remind),
      t.done?"TRUE":"FALSE",t.list||"Inbox",t.priority||"normal",t.notes||"",t.updatedAt||""]);
    return [LOGIC.TASK_COLS,...rows].map(r=>r.map(LOGIC.csvCell).join(",")).join("\n");
  },
  parseCsv(text){
    const rows=[]; let row=[],cell="",q=false;
    const s=String(text||"").replace(/\r\n/g,"\n");
    for(let i=0;i<s.length;i++){
      const c=s[i];
      if(q){ if(c==='"'){ if(s[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
      else if(c==='"') q=true;
      else if(c===","){ row.push(cell); cell=""; }
      else if(c==="\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
      else cell+=c;
    }
    if(cell!==""||row.length){ row.push(cell); rows.push(row); }
    return rows.filter(r=>r.length>1||(r[0]||"").trim()!=="");
  },
  csvToTasks(text){
    const rows=LOGIC.parseCsv(text);
    if(!rows.length) return [];
    return rows.slice(1).filter(r=>r[0]).map(r=>({
      id:r[0], title:r[1]||"", due:r[2]||null, time:r[3]||null,
      remind:(r[4]===""||r[4]===undefined)?null:Number(r[4]),
      done:r[5]==="TRUE", list:r[6]||"Inbox", priority:r[7]||"normal",
      notes:r[8]||"", updatedAt:r[9]||new Date().toISOString()
    }));
  },
  /* ---------- cadangan .json ---------- */
  /* Berkas ini datang dari luar, jadi tidak boleh dipercaya bentuknya.
     Yang penting: gagal dengan kalimat yang bisa ditindaklanjuti, bukan
     melempar TypeError dan meninggalkan pengguna menatap layar diam. */
  readBackup(text){
    let d;
    try{ d=JSON.parse(text); }
    catch(e){ return {ok:false,error:"Berkas ini bukan JSON yang sah. Pastikan yang dipilih hasil Unduh cadangan."}; }
    if(!d||typeof d!=="object"||Array.isArray(d))
      return {ok:false,error:"Isinya tidak dikenali sebagai cadangan Kertas."};
    if(!Array.isArray(d.notes)&&!Array.isArray(d.tasks))
      return {ok:false,error:"Tidak ada daftar catatan maupun tugas di dalam berkas ini."};
    const bersih=(a)=>Array.isArray(a)?a.filter(x=>x&&typeof x==="object"&&x.id):[];
    return {ok:true,
      notes:bersih(d.notes), tasks:bersih(d.tasks),
      folders:Array.isArray(d.folders)?d.folders:[],
      clientId:typeof d.clientId==="string"?d.clientId:"",
      exportedAt:typeof d.exportedAt==="string"?d.exportedAt:null};
  },
  /* Yang lebih baru menang; seri dimenangkan yang sudah ada di HP ini —
     kalau seri dimenangkan berkas cadangan, mengimpor cadangan lama akan
     memundurkan catatan yang baru saja diketik. */
  mergeNotes(local,incoming){
    const map=new Map();
    for(const n of (local||[])) if(n&&n.id) map.set(n.id,n);
    for(const n of (incoming||[])){
      if(!n||!n.id) continue;
      const cur=map.get(n.id);
      if(!cur||String(n.updatedAt||"")>String(cur.updatedAt||"")) map.set(n.id,n);
    }
    return [...map.values()];
  },
  /* Dipakai untuk memberi tahu SEBELUM menimpa: berapa yang baru, berapa yang
     menggantikan versi lebih lama, berapa yang dilewati. */
  importDiff(local,incoming){
    const map=new Map((local||[]).filter(x=>x&&x.id).map(x=>[x.id,x]));
    const masuk=[]; let lewat=0, baru=0;
    for(const x of (incoming||[])){
      const cur=map.get(x.id);
      if(!cur){ baru++; masuk.push(x.id); }
      else if(String(x.updatedAt||"")>String(cur.updatedAt||"")) masuk.push(x.id);
      else lewat++;
    }
    return {baru, timpa:masuk.length-baru, lewat, ids:masuk};
  },
  mergeTasks(local,remote){
    const map=new Map();
    for(const t of (remote||[])) if(t&&t.id) map.set(t.id,t);
    for(const t of (local||[])){
      if(!t||!t.id) continue;
      const r=map.get(t.id);
      if(!r||String(t.updatedAt||"")>=String(r.updatedAt||"")) map.set(t.id,t);
    }
    return [...map.values()];
  },

  /* ---------- antrean & jaringan ---------- */
  nextQueue(queue,op){
    const key=op.entity+":"+op.id;
    return [...(queue||[]).filter(o=>o.entity+":"+o.id!==key),op];
  },
  syncStateOf(entity,id,queue,online){
    const queued=(queue||[]).some(o=>o.entity===entity&&o.id===id);
    if(queued&&!online) return "offline";
    if(queued) return "pending";
    return "synced";
  },
  detectConflict(local,remoteModified){
    return !!(local&&local.dirty&&remoteModified&&local.driveModified&&remoteModified>local.driveModified);
  },
  backoffMs(attempts){
    const n=Math.max(1,Math.floor(attempts)||1);
    return Math.min(300000,3000*Math.pow(2,n-1));
  },
  pendingCount(queue){ return (queue||[]).length; },
  resolveTheme(pref,systemDark){
    if(pref==="dark") return "dark";
    if(pref==="light") return "light";
    return systemDark?"dark":"light";     // "auto" dan nilai tak dikenal
  },
  validClientId(v){ return /^[0-9]+-[a-z0-9_]+\.apps\.googleusercontent\.com$/i.test(String(v||"").trim()); },
  explainAuthError(code,origin){
    const c=String(code||"");
    if(/origin_mismatch|redirect_uri_mismatch/i.test(c))
      return "Origin belum terdaftar. Di Google Cloud Console → Credentials → OAuth client, isi Authorized JavaScript origins dengan persis: "+origin;
    if(/popup_closed|user_cancel|abort/i.test(c)) return "Jendela login ditutup sebelum selesai. Coba lagi.";
    if(/popup_blocked|popup_failed/i.test(c)) return "Popup diblokir browser. Izinkan popup untuk situs ini, lalu tekan lagi.";
    if(/access_denied/i.test(c)) return "Izin ditolak. Kertas butuh akses drive.file untuk menyimpan catatanmu.";
    if(/invalid_client|unauthorized_client/i.test(c)) return "Client ID tidak dikenali. Pastikan tipenya Web application dan tersalin utuh.";
    if(/idpiframe|cookie/i.test(c)) return "Browser memblokir cookie pihak ketiga. Matikan mode penyamaran atau izinkan cookie untuk accounts.google.com.";
    return "Login gagal: "+c;
  }
};

/* ================= 3. STATE ============================================= */

/* Isi sekali di sini kalau kamu sudah punya Client ID, lalu penyiapan
   tidak pernah muncul lagi di perangkat mana pun yang membuka berkas ini.
   Client ID bukan rahasia — yang rahasia adalah client secret, dan Kertas
   memang tidak memakainya. */
const CONFIG={ clientId:"" };

const STORE_KEY="kertas.v1";
/* Section catatan dulunya konstanta, jadi tidak ada cara menambahnya.
   Sekarang tinggal di dalam state. "Semua" tidak ikut disimpan — ia penyaring,
   bukan section. */
const DEFAULT_FOLDERS=["BCA","Klien","Personal"];
const REMIND_OPTIONS=[["","Tanpa pengingat"],["0","Tepat waktu"],["5","5 menit sebelum"],
  ["15","15 menit sebelum"],["30","30 menit sebelum"],["60","1 jam sebelum"],["1440","1 hari sebelum"]];

function load(){ try{ const r=localStorage.getItem(STORE_KEY); if(r) return JSON.parse(r); }catch(e){} return null; }

let storageFull=false;
/* Menulis seluruh state ke localStorage berarti men-stringify semua catatan.
   Kalau itu dilakukan tiap ketikan, mengetik di catatan besar mulai tersendat.
   Penulisan penting tetap langsung; ketikan cukup ditunda sebentar. */
function save(){
  try{
    localStorage.setItem(STORE_KEY,JSON.stringify(S));
    storageFull=false;
  }catch(e){
    // Kuota penuh tidak boleh gagal diam-diam — itu kehilangan data yang
    // tak disadari. Buang dulu yang paling tidak penting, lalu beri tahu.
    try{
      S.ledger=S.ledger.slice(0,10); S.notified=S.notified.slice(-40);
      localStorage.setItem(STORE_KEY,JSON.stringify(S));
      storageFull=false;
    }catch(e2){
      storageFull=true;
      try{ renderBanner(); }catch(e3){}
    }
  }
}
let saveTimer=null;
function saveSoon(){ clearTimeout(saveTimer); saveTimer=setTimeout(save,400); }
function flushSave(){ clearTimeout(saveTimer); save(); }

const S = load() || {
  clientId:CONFIG.clientId, notes:[], tasks:[], queue:[], ledger:[], notified:[],
  ids:{root:null,notes:null,tasks:null},
  lastSync:null, tab:"today", folder:"Semua", taskMode:"today", query:"",
  autoSync:true, tasksModified:null, offlineSim:false, syncAttempts:0, lastError:null,
  calendarReminders:false, everConnected:false, theme:"auto", doneOpen:true, setupDone:[],
  folders:[...DEFAULT_FOLDERS]
};
S.queue=S.queue||[]; S.ledger=S.ledger||[]; S.ids=S.ids||{}; S.notified=S.notified||[];
if(!S.theme) S.theme="auto";

(function migrate(){
  let changed=false;
  for(const n of S.notes){
    if(!n.blocks){ n.blocks=LOGIC.markdownToBlocks(n.body||""); delete n.body; changed=true; }
  }
  for(const t of S.tasks){
    if(t.time===undefined){ t.time=null; changed=true; }
    if(t.remind===undefined){ t.remind=null; changed=true; }
    if(t.notes===undefined) t.notes="";
  }
  if(changed){ save(); }
})();

const ENV=(()=>{
  const ua=navigator.userAgent||"";
  const iOS=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  // Di iOS semua browser memakai mesin Safari, jadi Chrome/Firefox di sana
  // TIDAK bisa memasang app — ini penyebab kebingungan yang paling sering.
  const iOSSafari=iOS&&!/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);
  const iOSOther=iOS&&!iOSSafari;
  const standalone=(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;
  return {iOS,iOSSafari,iOSOther,android:/Android/.test(ua),standalone};
})();

/* ================= 4. AUTENTIKASI ====================================== */

const SCOPE_DRIVE="https://www.googleapis.com/auth/drive.file";
const SCOPE_CAL="https://www.googleapis.com/auth/calendar.events";
const scopes=()=>SCOPE_DRIVE+(S.calendarReminders?" "+SCOPE_CAL:"");

function initAuth(){
  if(!window.google||!google.accounts||!google.accounts.oauth2) return false;
  if(!LOGIC.validClientId(S.clientId)) return false;
  tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:S.clientId.trim(), scope:scopes(),
    callback:(resp)=>{
      if(resp.error){
        const msg=LOGIC.explainAuthError(resp.error,appOrigin());
        log("login gagal: "+resp.error,"err"); S.lastError=msg; save();
        toast(msg); renderSetup(); render(); return;
      }
      token=resp.access_token; tokenExp=Date.now()+(Number(resp.expires_in||3600)-120)*1000;
      S.everConnected=true; S.lastError=null; save();
      log("terhubung ke Google");
      closeSetup(); render(); syncNow();
    },
    error_callback:(err)=>{
      const msg=LOGIC.explainAuthError((err&&err.type)||"popup_closed",appOrigin());
      log("login dibatalkan","warn"); toast(msg); render();
    }
  });
  return true;
}
function signIn(consent){
  if(!LOGIC.validClientId(S.clientId)){ openSetup(); return; }
  if(!tokenClient&&!initAuth()){ toast("Pustaka Google belum siap. Periksa koneksi lalu coba lagi."); return; }
  try{ tokenClient.requestAccessToken({prompt:consent?"consent":""}); }
  catch(e){ toast(LOGIC.explainAuthError("popup_blocked",appOrigin())); }
}
function signOut(){
  if(token&&window.google&&google.accounts.oauth2) google.accounts.oauth2.revoke(token,()=>{});
  token=null; tokenExp=0; log("keluar dari Google");
  toast("Sudah keluar. Catatan di HP dan di Drive tetap aman."); render();
}

/* ================= 5. DRIVE + CALENDAR ================================= */

const DRIVE="https://www.googleapis.com/drive/v3";
const UPLOAD="https://www.googleapis.com/upload/drive/v3";
const CAL="https://www.googleapis.com/calendar/v3";

async function api(url,opts={},retry=true){
  if(!signedIn()) throw new Error("belum login");
  if(S.offlineSim) throw new Error("mode offline (uji coba) aktif");
  let r;
  try{ r=await fetch(url,{...opts,headers:{Authorization:"Bearer "+token,...(opts.headers||{})}}); netDown=false; }
  catch(e){ netDown=true; throw new Error("tidak ada koneksi"); }
  if(r.status===401&&retry){ token=null; signIn(false); throw new Error("sesi habis, coba lagi"); }
  if(r.status===429||r.status===403){
    const body=await r.text();
    if(/rateLimit|userRateLimit/i.test(body)){ await new Promise(s=>setTimeout(s,1500)); return api(url,opts,false); }
    throw new Error("Google menolak: "+body.slice(0,110));
  }
  if(!r.ok) throw new Error("HTTP "+r.status+" "+(await r.text()).slice(0,110));
  const ct=r.headers.get("content-type")||"";
  return ct.includes("json")?r.json():r.text();
}
async function ensureFolder(name,parent){
  const q=[`name='${name.replace(/'/g,"\\'")}'`,"mimeType='application/vnd.google-apps.folder'","trashed=false",
    parent?`'${parent}' in parents`:"'root' in parents"].join(" and ");
  const found=await api(`${DRIVE}/files?q=${encodeURIComponent(q)}&fields=files(id)&spaces=drive`);
  if(found.files&&found.files.length) return found.files[0].id;
  const made=await api(`${DRIVE}/files?fields=id`,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({name,mimeType:"application/vnd.google-apps.folder",parents:[parent||"root"]})});
  log("folder "+name+" dibuat"); return made.id;
}
function multipart(meta,body,ct){
  const b="kertas"+Date.now();
  return { headers:{"Content-Type":"multipart/related; boundary="+b},
    body:`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n`+
         `--${b}\r\nContent-Type: ${ct}; charset=UTF-8\r\n\r\n${body}\r\n--${b}--` };
}
const createFile=(meta,body,ct)=>api(`${UPLOAD}/files?uploadType=multipart&fields=id,modifiedTime`,{method:"POST",...multipart(meta,body,ct)});
async function updateFile(id,body,ct,meta){
  if(meta) await api(`${DRIVE}/files/${id}`,{method:"PATCH",
    headers:{"Content-Type":"application/json"},body:JSON.stringify(meta)});
  return api(`${UPLOAD}/files/${id}?uploadType=media&fields=id,modifiedTime`,
    {method:"PATCH",headers:{"Content-Type":ct+"; charset=UTF-8"},body});
}
async function exportFile(id,mime){
  try{ return await api(`${DRIVE}/files/${id}/export?mimeType=${encodeURIComponent(mime)}`); }
  catch(e){ if(mime==="text/markdown") return api(`${DRIVE}/files/${id}/export?mimeType=text/plain`); throw e; }
}
/* files.list hanya mengembalikan satu halaman. Tanpa mengikuti nextPageToken,
   catatan ke-201 dan seterusnya tidak pernah ikut tersinkron. */
async function listNoteFiles(){
  const out=[]; let pageToken="";
  const q=`'${S.ids.notes}' in parents and trashed=false`;
  do{
    const url=`${DRIVE}/files?q=${encodeURIComponent(q)}`+
      `&fields=nextPageToken,files(id,name,modifiedTime,appProperties)&pageSize=100`+
      (pageToken?`&pageToken=${encodeURIComponent(pageToken)}`:"");
    const r=await api(url);
    out.push(...(r.files||[]));
    pageToken=r.nextPageToken||"";
  }while(pageToken);
  return out;
}

async function ensureTree(){
  if(!S.ids.root) S.ids.root=await ensureFolder("Kertas",null);
  if(!S.ids.notes) S.ids.notes=await ensureFolder("Notes",S.ids.root);
  save();
}

/* Alarm yang tetap bunyi saat app tertutup hanya bisa datang dari sistem
   operasi. Karena itu tugas berpengingat dicerminkan jadi acara Google
   Calendar — aplikasinya sudah terpasang di Android maupun iPhone. */
async function syncCalendar(t){
  if(!S.calendarReminders) return;
  const at=LOGIC.dueAt(t);
  const wanted=!!(at&&t.remind!==null&&t.remind!==undefined&&t.remind!==""&&!t.done&&!t.deleted);
  try{
    if(!wanted){
      if(t.calEventId){ await api(`${CAL}/calendars/primary/events/${t.calEventId}`,{method:"DELETE"}); t.calEventId=null; }
      return;
    }
    const start=new Date(at), end=new Date(start.getTime()+30*60000);
    const body={summary:t.title,description:"Dari Kertas"+(t.notes?"\n\n"+t.notes:""),
      start:{dateTime:start.toISOString()},end:{dateTime:end.toISOString()},
      reminders:{useDefault:false,overrides:[{method:"popup",minutes:Number(t.remind)}]}};
    if(t.calEventId){
      await api(`${CAL}/calendars/primary/events/${t.calEventId}`,{method:"PATCH",
        headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    }else{
      const ev=await api(`${CAL}/calendars/primary/events`,{method:"POST",
        headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      t.calEventId=ev.id;
    }
  }catch(e){ log("pengingat kalender gagal: "+e.message,"warn"); }
}

/* ================= 6. SINKRONISASI ===================================== */

async function syncNow(manual){
  if(busy) return;
  if(!signedIn()){ if(manual) signIn(false); render(); return; }
  if(!online()){ if(manual) toast("Masih offline. "+S.queue.length+" perubahan aman di HP."); return; }
  busy=true; render();
  try{
    await ensureTree();
    // Satu panggilan daftar dipakai bersama oleh push dan pull. Sebelumnya
    // tiap catatan yang diunggah butuh satu GET tambahan hanya untuk mengecek
    // versi Drive — 20 catatan berarti 20 permintaan yang sia-sia.
    const files=await listNoteFiles();
    const remoteMap=new Map(files.map(f=>[f.id,f]));
    await pushAll(remoteMap);
    await pullAll(files);
    S.lastSync=new Date().toISOString(); S.syncAttempts=0; S.lastError=null; save();
    log("sinkron selesai"+(S.queue.length?" ("+S.queue.length+" ditahan)":""));
  }catch(e){
    S.syncAttempts=(S.syncAttempts||0)+1; S.lastError=e.message; save();
    log("sync gagal ("+S.syncAttempts+"×): "+e.message,"err");
    if(manual) toast("Sync gagal: "+e.message);
    scheduleRetry();
  }finally{ busy=false; save(); render(); scheduleReminders(); }
}
let retryTimer=null;
function scheduleRetry(){
  clearTimeout(retryTimer);
  if(!S.queue.length) return;
  const wait=LOGIC.backoffMs(S.syncAttempts||1);
  log("coba lagi dalam "+Math.round(wait/1000)+" detik");
  retryTimer=setTimeout(()=>{ if(reachable()&&signedIn()) syncNow(); },wait);
}
async function pushAll(remoteMap){
  const ops=S.queue.slice();
  for(const op of ops.filter(o=>o.entity==="note")){
    const r=await pushNote(op,remoteMap);
    if(r==="conflict"){ log("catatan "+op.id+" ditahan, menunggu keputusan","warn"); continue; }
    S.queue=S.queue.filter(o=>!(o.entity==="note"&&o.id===op.id)); save();
  }
  if(ops.some(o=>o.entity==="task")){
    for(const t of S.tasks.filter(x=>ops.some(o=>o.entity==="task"&&o.id===x.id))) await syncCalendar(t);
    await pushTasks();
    S.queue=S.queue.filter(o=>o.entity!=="task");
    S.tasks=S.tasks.filter(t=>!t.deleted);
    save();
  }
}
async function pushNote(op,remoteMap){
  const n=S.notes.find(x=>x.id===op.id);
  if(!n) return;
  if(n.deleted){
    if(n.fileId) await api(`${DRIVE}/files/${n.fileId}`,{method:"PATCH",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({trashed:true})});
    return;
  }
  const md=LOGIC.noteToMarkdown(n);
  const name=(n.title||"Tanpa judul").slice(0,80);
  if(n.fileId){
    // Sebelum menimpa, pastikan versi Drive belum bergerak selagi kita offline.
    let f=remoteMap?remoteMap.get(n.fileId):null;
    if(!f&&remoteMap){
      // Tidak ada di folder: mungkin dibuang, mungkin dipindah pengguna.
      // Baru di sinilah satu GET benar-benar diperlukan.
      try{
        const meta=await api(`${DRIVE}/files/${n.fileId}?fields=modifiedTime,trashed`);
        if(meta&&!meta.trashed) f={id:n.fileId,modifiedTime:meta.modifiedTime};
      }catch(e){}
      if(!f){ n.fileId=null; n.driveModified=null; }
    }
    if(f&&n.driveModified&&f.modifiedTime!==n.driveModified){ askConflict(n,f); return "conflict"; }
  }
  /* Section disimpan sebagai appProperties, bukan di dalam isi dokumennya —
     supaya tidak ikut terbaca sebagai teks saat catatannya dibuka di Google Docs,
     tapi tetap ikut turun ke HP lain. */
  const props={kertasFolder:n.folder||defaultFolder()};
  if(n.fileId){
    const r=await updateFile(n.fileId,md,"text/markdown",{name,appProperties:props});
    n.driveModified=r.modifiedTime;
    /* Daftar berkas diambil SEBELUM push, jadi entri ini sudah basi. Kalau
       dibiarkan, pullAll di bawah menganggapnya berubah di Drive dan menimpa
       balik section yang baru saja diubah pengguna dengan nilai lamanya. */
    const f0=remoteMap?remoteMap.get(n.fileId):null;
    if(f0){ f0.modifiedTime=r.modifiedTime; f0.appProperties={...(f0.appProperties||{}),...props}; }
  }else{
    const r=await createFile({name,parents:[S.ids.notes],appProperties:props,
      mimeType:"application/vnd.google-apps.document"},md,"text/markdown");
    n.fileId=r.id; n.driveModified=r.modifiedTime; log("catatan baru dibuat sebagai Google Doc");
  }
  n.dirty=false; save();
}
async function pushTasks(){
  if(S.ids.tasks&&S.tasksModified){
    try{
      const meta=await api(`${DRIVE}/files/${S.ids.tasks}?fields=modifiedTime`);
      if(meta.modifiedTime!==S.tasksModified){
        const remote=LOGIC.csvToTasks(await exportFile(S.ids.tasks,"text/csv"));
        S.tasks=LOGIC.mergeTasks(S.tasks,remote);
        log("tugas digabung dengan versi Drive");
      }
    }catch(e){ log("gagal cek sheet: "+e.message,"warn"); }
  }
  const csv=LOGIC.tasksToCsv(S.tasks);
  if(!S.ids.tasks){
    const q="name='Kertas Tasks' and trashed=false and '"+S.ids.root+"' in parents";
    const found=await api(`${DRIVE}/files?q=${encodeURIComponent(q)}&fields=files(id)`);
    if(found.files&&found.files.length) S.ids.tasks=found.files[0].id;
  }
  if(S.ids.tasks){ const r=await updateFile(S.ids.tasks,csv,"text/csv"); S.tasksModified=r.modifiedTime; }
  else{
    const r=await createFile({name:"Kertas Tasks",parents:[S.ids.root],
      mimeType:"application/vnd.google-apps.spreadsheet"},csv,"text/csv");
    S.ids.tasks=r.id; S.tasksModified=r.modifiedTime; log("sheet Kertas Tasks dibuat");
  }
  save();
}
async function pullAll(files){
  for(const f of (files||[])){
    const local=S.notes.find(n=>n.fileId===f.id);
    if(local&&local.driveModified===f.modifiedTime) continue;
    if(local&&LOGIC.detectConflict(local,f.modifiedTime)){ askConflict(local,f); continue; }
    const parsed=LOGIC.markdownToNote(await exportFile(f.id,"text/markdown"));
    /* Berkas lama (dibuat sebelum section ikut tersimpan) belum punya penanda
       ini — jatuhkan ke bawaan, jangan sampai jadi section kosong bernama "". */
    const seksi=LOGIC.normalizeFolder((f.appProperties||{}).kertasFolder)||defaultFolder();
    S.folders=LOGIC.mergeFolders(S.folders,[seksi]);
    if(local){
      local.title=parsed.title||f.name; local.blocks=parsed.blocks; local.folder=seksi;
      local.driveModified=f.modifiedTime; local.updatedAt=f.modifiedTime; local.dirty=false;
    }else{
      S.notes.unshift({id:"n"+Math.random().toString(36).slice(2,8),fileId:f.id,
        title:parsed.title||f.name,blocks:parsed.blocks,folder:seksi,pinned:false,
        updatedAt:f.modifiedTime,driveModified:f.modifiedTime,dirty:false});
      log("catatan ditarik dari Drive: "+f.name);
    }
  }
  if(S.ids.tasks){
    const meta=await api(`${DRIVE}/files/${S.ids.tasks}?fields=modifiedTime`);
    if(meta.modifiedTime!==S.tasksModified&&!S.queue.some(o=>o.entity==="task")){
      S.tasks=LOGIC.csvToTasks(await exportFile(S.ids.tasks,"text/csv"));
      S.tasksModified=meta.modifiedTime; log("daftar tugas ditarik dari Sheet");
    }
  }
  save();
}
function askConflict(local,f){
  openSheet(`<div class="grab"></div>
    <div class="h" style="font-size:17px;margin-bottom:6px">Catatan ini berubah di dua tempat</div>
    <p style="font-size:12.5px;color:var(--ink2);line-height:1.55;margin:0 0 14px">
      Kamu mengubah "${esc(LOGIC.truncate(local.title||"Tanpa judul",30))}" di HP ini, sementara versi di Drive juga berubah.
      Tidak ada yang dihapus sampai kamu memilih.</p>
    <button class="btn primary" onclick="K.resolve('${local.id}','${f.id}','both')">Simpan dua-duanya</button>
    <button class="btn" onclick="K.resolve('${local.id}','${f.id}','local')">Pakai versi HP ini</button>
    <button class="btn" onclick="K.resolve('${local.id}','${f.id}','remote')">Pakai versi Drive</button>`);
}

/* ================= 7. PENGINGAT ========================================
   Dua jalur, dan bedanya mendasar:

   - Di browser/PWA, penjadwalan cuma bisa lewat setTimeout, yang hidup
     selama tabnya hidup. Begitu app ditutup, timernya ikut mati. Itu batas
     platform — makanya ada cerminan ke Google Calendar.
   - Di shell native (Capacitor), penjadwalan diserahkan ke alarm OS. Alarmnya
     tetap bunyi walau app sudah ditutup total, tanpa server mana pun.

   Berkas ini tetap satu dan sama untuk dua-duanya: kalau Capacitor tidak ada,
   semuanya jatuh kembali ke perilaku web lama tanpa perubahan apa pun. */

const NATIVE={
  get on(){ const c=window.Capacitor; return !!(c&&c.isNativePlatform&&c.isNativePlatform()); },
  get ln(){ const c=window.Capacitor; return (c&&c.Plugins&&c.Plugins.LocalNotifications)||null; }
};

/* Android menuntut ID notifikasi berupa angka 32-bit; id tugas Kertas berupa
   teks. Hash ini harus stabil — kalau berubah, alarm lama tidak bisa dibatalkan
   dan tugas yang sudah dihapus tetap berbunyi. */
function notifId(id){
  let h=0;
  for(let i=0;i<String(id).length;i++) h=(Math.imul(h,31)+String(id).charCodeAt(i))|0;
  return (Math.abs(h)%2000000000)||1;
}

/* Android membatasi jumlah alarm tertunda per app. Ambil yang paling dekat saja. */
const NATIVE_MAX=64;

async function syncNativeReminders(){
  const LN=NATIVE.ln; if(!LN) return false;
  try{
    const pend=await LN.getPending();
    if(pend&&pend.notifications&&pend.notifications.length)
      await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});

    const now=Date.now(), due=[];
    for(const t of S.tasks){
      if(t.done||t.deleted) continue;
      const at=LOGIC.remindAt(t); if(!at) continue;
      const ms=new Date(at).getTime();
      if(isNaN(ms)||ms<=now) continue;      // yang sudah lewat ditangani catchUpReminders
      due.push({ms,t});
    }
    due.sort((a,b)=>a.ms-b.ms);
    const dipakai=due.slice(0,NATIVE_MAX);
    if(due.length>dipakai.length)
      log((due.length-dipakai.length)+" pengingat terjauh belum dijadwalkan (batas OS)","warn");

    if(dipakai.length) await LN.schedule({notifications:dipakai.map(({ms,t})=>({
      id:notifId(t.id),
      title:t.title,
      body:(t.time?"Pukul "+t.time:"Hari ini")+(t.notes?" · "+LOGIC.truncate(t.notes,50):""),
      schedule:{at:new Date(ms),allowWhileIdle:true},
      extra:{taskId:t.id}
    }))});
    return true;
  }catch(e){ log("pengingat native gagal: "+e.message,"warn"); return false; }
}

/* null = belum diperiksa. Dipakai tab Sync supaya sakelarnya tidak berbohong. */
let nativeNotifOK=null;
async function checkNativePerm(){
  const LN=NATIVE.ln; if(!LN) return;
  try{
    const r=await LN.checkPermissions();
    const v=!!(r&&r.display==="granted");
    if(v!==nativeNotifOK){ nativeNotifOK=v; if(S.tab==="settings") render(); }
  }catch(e){}
}

let reminderTimers=[];
function scheduleReminders(){
  reminderTimers.forEach(clearTimeout); reminderTimers=[];
  if(NATIVE.on){ syncNativeReminders(); return; }
  if(!("Notification" in window)||Notification.permission!=="granted") return;
  const now=Date.now();
  for(const t of S.tasks){
    if(t.done||t.deleted) continue;
    const at=LOGIC.remindAt(t); if(!at) continue;
    const ms=new Date(at).getTime()-now;
    if(ms>0&&ms<24*3600*1000) reminderTimers.push(setTimeout(()=>fireReminder(t.id),ms));
  }
}
function fireReminder(id){
  const t=S.tasks.find(x=>x.id===id);
  if(!t||!LOGIC.shouldNotify(t,Date.now(),S.notified)) return;
  const body=(t.time?"Pukul "+t.time:"Hari ini")+(t.notes?" · "+LOGIC.truncate(t.notes,50):"");
  try{
    if(navigator.serviceWorker&&navigator.serviceWorker.ready){
      navigator.serviceWorker.ready
        .then(r=>r.showNotification(t.title,{body,icon:"icon-192.png",badge:"icon-192.png",tag:"kertas-"+t.id}))
        .catch(()=>{ new Notification(t.title,{body,icon:"icon-192.png"}); });
    }else new Notification(t.title,{body,icon:"icon-192.png"});
  }catch(e){ toast("Pengingat: "+t.title); }
  S.notified=[...S.notified,t.id+"@"+(t.updatedAt||"")].slice(-200); save();
}
/* Kalau ada pengingat yang lewat selagi app tertutup, sebutkan sekali —
   jangan pura-pura tidak terjadi apa-apa. */
function catchUpReminders(){
  const now=Date.now(); const late=[];
  for(const t of S.tasks) if(LOGIC.shouldNotify(t,now,S.notified)) late.push(t);
  if(!late.length) return;
  late.forEach(t=>{ S.notified=[...S.notified,t.id+"@"+(t.updatedAt||"")]; });
  S.notified=S.notified.slice(-200); save();
  toast(late.length===1?"Pengingat lewat: "+LOGIC.truncate(late[0].title,32)
    :late.length+" pengingat terlewat selagi app tertutup.");
}
async function askNotify(){
  if(NATIVE.on){
    const LN=NATIVE.ln;
    if(!LN){ toast("Plugin notifikasi tidak termuat."); return false; }
    try{
      const r=await LN.requestPermissions();
      const ok=!!(r&&r.display==="granted");
      nativeNotifOK=ok;
      toast(ok?"Pengingat aktif. Bunyi walau Kertas ditutup."
              :"Izin notifikasi ditolak. Aktifkan di Setelan HP → Aplikasi → Kertas.");
      if(ok) await syncNativeReminders();
      return ok;
    }catch(e){ toast("Gagal meminta izin: "+e.message); return false; }
  }
  if(!("Notification" in window)){ toast("Browser ini tidak mendukung notifikasi."); return false; }
  if(Notification.permission==="granted"){ toast("Notifikasi sudah aktif."); return true; }
  if(Notification.permission==="denied"){ toast("Notifikasi diblokir di pengaturan browser. Aktifkan dulu di sana."); return false; }
  const p=await Notification.requestPermission();
  if(p==="granted"){ scheduleReminders(); toast("Pengingat aktif selama app terbuka."); return true; }
  return false;
}

   dengan animasi, bukan tiba-tiba sudah ada di sana. */

  const late=LOGIC.isOverdue(t,todayKey);
  const hasRemind=(t.remind!==null&&t.remind!==undefined&&t.remind!=="");
  return `<div class="task${justMoved===t.id?" landing":""}" data-id="${t.id}" data-done="${t.done?1:0}">

      aria-checked="${!!t.done}" tabindex="0"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></span>

      ${t.notes?`<div class="rowsnip" style="margin-top:2px">${esc(LOGIC.truncate(t.notes,70))}</div>`:""}
      <div class="rowmeta">
        ${t.due?`<span class="badge ${late?"late":""}">${ICON.cal}${late?"telat · ":""}${esc(LOGIC.dayKey(t.due).slice(5))}${t.time?" "+esc(t.time):""}</span>`:""}

/* Daftar Selesai dibatasi supaya bagian ini tidak tumbuh tanpa henti dan
   supaya tinggi lipatannya bisa dianimasikan. Sisanya tidak hilang — tetap
   ada di localStorage dan di sheet Kertas Tasks — dan jumlahnya disebutkan. */
const DONE_MAX=25;
function doneSection(list,t,label){
  const open=S.doneOpen!==false;
  const hide=list.length?"":';display:none';
  return `<button class="donehead" id="donehead" onclick="K.toggleDone()" aria-expanded="${open}" style="margin:0${hide}">
      <svg class="caret" viewBox="0 0 24 24" data-open="${open?1:0}"><path d="M9 6l6 6-6 6"/></svg>
      <span>${label||"Selesai"}</span><span class="cnt" id="donecount">${list.length}</span></button>
    <div class="list donewrap" id="donelist" data-open="${open&&list.length?1:0}">
      ${doneRows(list,t)}</div>`;
}
function doneRows(list,t){
  return list.slice(0,DONE_MAX).map(x=>taskRow(x,t)).join("")
    +(list.length>DONE_MAX?`<div class="donefoot">+${list.length-DONE_MAX} tugas selesai yang lebih lama —
        tidak ditampilkan di sini, tapi tetap tersimpan di sheet Kertas Tasks.</div>`:"");
}

/* ---------- centang → coret → pindah ke Selesai ----------
   Sengaja tidak lewat render() penuh: render() mengganti seluruh isi <main>,
   jadi elemen yang baru dicentang dibuang sebelum satu frame pun dilukis dan
   animasi centangnya tidak pernah terlihat. Di sini elemennya disentuh di
   tempat dulu, baru daftarnya disusun ulang setelah animasinya selesai. */
const moveTimers=new Map();

function collapseThen(el,after){
  if(!el||!el.parentNode){ after(); return; }
  el.style.height=el.offsetHeight+"px";
  void el.offsetWidth;                    // paksa reflow: tanpa ini tidak ada titik awal untuk transisi
  el.classList.add("leaving");
  setTimeout(after,300);
}

function refreshTaskLists(){
  const a=document.getElementById("activelist"), d=document.getElementById("donelist");
  if(!a||!d||(S.tab!=="today"&&S.tab!=="tasks")){ render(); return; }
  const t=LOGIC.today();
  const isToday=S.tab==="today";
  const active=LOGIC.sortTasks(S.tasks,isToday?"today":S.taskMode,t);
  const done=LOGIC.doneList(S.tasks,t,isToday?"today":"all");

  a.innerHTML=active.map(x=>taskRow(x,t)).join("")||
    (isToday?emptyBox("Tidak ada yang jatuh tempo.","Tambah dari tab Tugas.")
            :emptyBox("Kosong.","Ketik di atas untuk menambah."));
  d.innerHTML=doneRows(done,t);
  d.dataset.open=(S.doneOpen!==false&&done.length)?"1":"0";
  a.classList.add("quiet"); d.classList.add("quiet");

  const head=document.getElementById("donehead"), cnt=document.getElementById("donecount");
  if(cnt) cnt.textContent=done.length;
  if(head) head.style.display=done.length?"":"none";
  const due=document.getElementById("duecount");
  if(due) due.textContent=LOGIC.sortTasks(S.tasks,"today",t).length;
  renderSub();
  justMoved=null;
}

/* ---------- editor blok ---------- */
function renderBlocks(){
  const n=S.notes.find(x=>x.id===editing); if(!n) return;
  const el=document.getElementById("blocks");
  el.innerHTML=n.blocks.map((b,i)=>{
    if(b.type==="divider") return `<div class="blk" data-t="divider" data-i="${i}"><span class="gutter"></span>
      <div class="divider"></div>
      <button class="iconbtn" style="width:26px;height:26px;margin-top:8px" onclick="K.removeBlock(${i})" aria-label="Hapus pemisah">
        <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>`;
    const gut=
      b.type==="todo"?`<span class="box" data-on="${b.checked?1:0}" onclick="K.check(${i})" role="checkbox" aria-checked="${!!b.checked}"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></span>`
      :b.type==="bullet"?`<span style="padding-top:1px;color:var(--pine);font-size:17px">•</span>`
      :b.type==="num"?`<span class="mono" style="font-size:13px;padding-top:2px">${LOGIC.numberOf(n.blocks,i)}.</span>`
      :"";
    const ta=`<textarea class="btext" data-i="${i}" rows="1" placeholder="${i===0?"Mulai menulis…":""}"
        spellcheck="${b.type==="code"?"false":"true"}" autocapitalize="${b.type==="code"?"off":"sentences"}"
        autocorrect="${b.type==="code"?"off":"on"}">${esc(b.text)}</textarea>`;
    return `<div class="blk" data-t="${b.type}" data-i="${i}" data-checked="${b.type==="todo"&&b.checked?1:0}">
      <span class="gutter">${gut}</span>
      ${b.type==="code"?`<div class="wrap">${ta}<button class="copy" onclick="K.copyCode(${i})">salin</button></div>`:ta}
    </div>`;
  }).join("");
  el.querySelectorAll(".btext").forEach(ta=>{
    grow(ta);
    ta.addEventListener("input",onBlockInput);
    ta.addEventListener("keydown",onBlockKey);
    ta.addEventListener("focus",()=>{ focusBlock=Number(ta.dataset.i); });
  });
}
function grow(ta){ ta.style.height="auto"; ta.style.height=ta.scrollHeight+"px"; }
function focusAt(i,caret){
  const put=()=>{
    const ta=document.querySelector('.btext[data-i="'+i+'"]');
    if(!ta) return false;
    ta.focus();
    const p=(caret===undefined)?ta.value.length:caret;
    try{ ta.setSelectionRange(p,p); }catch(e){}
    focusBlock=i; grow(ta);
    return true;
  };
  // Sinkron dulu: masih di dalam gestur, jadi keyboard tetap terbuka.
  if(put()) return;
  requestAnimationFrame(put);
}
function onBlockInput(e){
  const n=S.notes.find(x=>x.id===editing); if(!n) return;
  const i=Number(e.target.dataset.i), b=n.blocks[i]; if(!b) return;
  grow(e.target);
  b.text=e.target.value;
  if(b.type!=="code"){
    const sc=LOGIC.shortcut(b.text);
    if(sc){
      b.type=sc.type; b.text=sc.text;
      if(sc.type==="divider"){
        n.blocks.splice(i+1,0,LOGIC.newBlock("text",""));
        touchNote(n); renderBlocks(); focusAt(i+1,0); return;
      }
      touchNote(n); renderBlocks(); focusAt(i,b.text.length); return;
    }
  }
  touchNote(n);
}
function onBlockKey(e){
  const n=S.notes.find(x=>x.id===editing); if(!n) return;
  const ta=e.target, i=Number(ta.dataset.i), b=n.blocks[i];
  if(!b) return;
  const caret=ta.selectionStart;

  if(e.key==="Enter"&&!e.shiftKey){
    if(b.type==="code"){
      // Di blok kode Enter memang menambah baris. Dua Enter di ujung = keluar.
      if(caret===ta.value.length&&/\n$/.test(ta.value)){
        e.preventDefault();
        b.text=ta.value.replace(/\n$/,"");
        n.blocks.splice(i+1,0,LOGIC.newBlock("text",""));
        touchNote(n); renderBlocks(); focusAt(i+1,0);
      }
      return;
    }
    e.preventDefault();
    // Enter di baris daftar yang kosong = keluar dari daftar
    if(!b.text.trim()&&(b.type==="bullet"||b.type==="num"||b.type==="todo")){
      b.type="text"; b.checked=false; touchNote(n); renderBlocks(); focusAt(i,0); return;
    }
    const parts=LOGIC.splitBlock(b,caret);
    n.blocks[i]=parts.left; n.blocks.splice(i+1,0,parts.right);
    touchNote(n); renderBlocks(); focusAt(i+1,0); return;
  }
  if(e.key==="Backspace"&&caret===0&&ta.selectionEnd===0){
    if(b.type!=="text"){
      e.preventDefault(); b.type="text"; b.checked=false;
      touchNote(n); renderBlocks(); focusAt(i,0); return;
    }
    if(i>0){
      e.preventDefault();
      const prev=n.blocks[i-1];
      if(prev.type==="divider"){ n.blocks.splice(i-1,1); touchNote(n); renderBlocks(); focusAt(i-1,0); return; }
      const at=(prev.text||"").length;
      prev.text=(prev.text||"")+b.text;
      n.blocks.splice(i,1);
      touchNote(n); renderBlocks(); focusAt(i-1,at); return;
    }
  }
  if(e.key==="ArrowUp"&&caret===0&&i>0){ e.preventDefault(); focusAt(i-1); }
  if(e.key==="ArrowDown"&&caret===ta.value.length&&i<n.blocks.length-1){ e.preventDefault(); focusAt(i+1,0); }
}
function touchNote(n){
  n.dirty=true; n.updatedAt=new Date().toISOString();
  queueOp("note",n.id,"update");
  const s=document.getElementById("esave"); if(s) s.textContent="tersimpan di HP";
  saveSoon(); scheduleSync();
}

       <b>Authorized redirect URIs</b> — <b>biarkan kosong</b>. Kertas tidak memakainya.

  el.scrollTop=keep;   // menandai langkah selesai tidak boleh melempar balik ke atas
