/* ================= 9. AKSI ============================================= */

const K={
  go(tab){ S.tab=tab; save(); render(); },
  search(v){
    S.query=v;
    const el=document.getElementById("notelist");
    if(el){
      const notes=LOGIC.filterNotes(S.notes,S.query,S.folder);
      el.innerHTML=notes.map(noteRow).join("")||emptyBox("Tidak ada yang cocok.","Coba kata lain.");
    }
  },
  setFolder(f){ S.folder=f; save(); render(); },
  manageFolders(){
    openSheet(folderSheet());
    setTimeout(()=>{ const e=document.getElementById("fname"); if(e) e.focus(); },80);
  },
  saveFolder(){
    const el=document.getElementById("fname"); if(!el) return;
    const err=LOGIC.folderError(el.value,S.folders);
    if(err){
      const m=document.getElementById("fmsg");
      if(m){ m.textContent=err; m.style.color="var(--brick)"; }
      el.focus(); return;
    }
    const nama=LOGIC.normalizeFolder(el.value);
    S.folders=[...S.folders,nama];
    S.folder=nama;                       // langsung pindah ke section barunya
    save(); closeSheet(); render();
    toast('Section "'+nama+'" dibuat.');
  },
  deleteFolder(f){
    if(S.folders.length<=1){ toast("Section terakhir tidak bisa dihapus."); return; }
    const sisa=S.folders.filter(x=>x!==f);
    const tujuan=sisa[0];
    const pindah=S.notes.filter(n=>n&&!n.deleted&&(n.folder||defaultFolder())===f);
    for(const n of pindah){
      n.folder=tujuan; n.dirty=true; n.updatedAt=new Date().toISOString();
      queueOp("note",n.id,"update");     // section ikut naik ke Drive, jadi HP lain tahu
    }
    S.folders=sisa;
    if(S.folder===f) S.folder="Semua";
    save(); render(); openSheet(folderSheet()); scheduleSync();
    toast(pindah.length?pindah.length+' catatan dipindahkan ke "'+tujuan+'".':'Section "'+f+'" dihapus.');
  },
  pickFolder(){
    const n=S.notes.find(x=>x.id===editing); if(!n) return;
    const kini=n.folder||defaultFolder();
    openSheet(`<div class="grab"></div>
      <div class="h" style="font-size:17px;margin-bottom:10px">Pindahkan ke section</div>
      ${S.folders.map(f=>`<button class="btn" style="display:flex;align-items:center;gap:10px"
          onclick="K.setNoteFolder(${jsArg(f)})">
          <span class="badge fold">${ICON.fold}${esc(f)}</span>
          <span style="margin-left:auto;color:var(--pine)">${f===kini?"✓":""}</span></button>`).join("")}
      <button class="btn" onclick="K.manageFolders()">+ Bikin section baru</button>`);
  },
  setNoteFolder(f){
    const n=S.notes.find(x=>x.id===editing); if(!n) return;
    n.folder=f;
    document.getElementById("efolder").textContent=f;
    closeSheet(); touchNote(n);
  },
  setMode(m){ S.taskMode=m; save(); render(); },
  toggleAuto(){ S.autoSync=!S.autoSync; save(); render(); },
  install(){
    if(!installPrompt){ toast("Browser belum menawarkan pemasangan. Jalankan pemeriksaan di bawah."); return; }
    installPrompt.prompt();
    installPrompt.userChoice.then(r=>{
      if(r&&r.outcome==="accepted") toast("Sedang dipasang…");
      installPrompt=null; render();
    }).catch(()=>{});
  },
  copyAppLink(){
    const url=location.origin+location.pathname;
    (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject())
      .then(()=>toast("Alamat disalin. Tempel di Safari."))
      .catch(()=>toast(url));
  },
  checkInstall(){
    const el=document.getElementById("diagout");
    el.innerHTML=`<div class="card"><div style="font-size:12.5px;color:var(--muted)">Memeriksa…</div></div>`;
    installDiag().then(list=>{
      const bad=list.filter(x=>!x.ok);
      el.innerHTML=`<div class="card">
        <div style="font-size:13.5px;font-weight:600;color:${bad.length?"var(--brick)":"var(--pine)"}">
          ${bad.length?bad.length+" hal perlu dibereskan":"Semua syarat terpenuhi"}</div>
        ${list.map(x=>`<div style="font-size:12px;margin-top:8px;line-height:1.5;color:${x.ok?"var(--ink2)":"var(--brick)"}">
          ${x.ok?"✓":"✗"} ${esc(x.label)}${x.fix?`<div style="color:var(--muted);margin-top:3px">${esc(x.fix)}</div>`:""}</div>`).join("")}
        ${!bad.length&&!ENV.standalone?`<div style="font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.5">
          Syaratnya lengkap. Chrome kadang baru menawarkan pemasangan setelah kamu memakai halamannya sebentar — coba menu titik tiga → Install app.</div>`:""}
      </div>`;
    });
  },
  toggleOffline(){
    S.offlineSim=!S.offlineSim; save();
    toast(S.offlineSim?"Sekarang berlaku seperti tanpa internet.":"Tersambung lagi. Mengirim yang tertunda.");
    render(); if(!S.offlineSim) syncNow();
  },
  toggleCalendar(){
    if(!S.calendarReminders){
      S.calendarReminders=true; save();
      toast("Perlu izin tambahan untuk Google Calendar.");
      // Token lama tetap dipegang: kalau pengguna membatalkan layar izin,
      // sinkronisasi Drive harus tetap jalan seperti semula.
      tokenClient=null;
      if(initAuth()) signIn(true); else openSetup();
    }else{
      S.calendarReminders=false; save();
      toast("Pengingat kalender dimatikan. Acara yang sudah dibuat tetap ada.");
    }
    render();
  },
  askNotify(){ askNotify().then(()=>render()); },

  openSetup(){ openSetup(); },
  closeSetup(){ closeSetup(); },
  stepDone(n){
    n=String(n);
    S.setupDone=S.setupDone.includes(n)?S.setupDone.filter(x=>x!==n):[...S.setupDone,n];
    save(); renderSetup();
  },
  copySetupLink(){
    const url=location.origin+location.pathname+"?cid="+encodeURIComponent(S.clientId);
    (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject())
      .then(()=>toast("Tautan disalin. Buka di HP satunya, lalu tekan Sambungkan."))
      .catch(()=>toast(url));
  },
  copyOrigin(){
    const v=appOrigin();
    (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject())
      .then(()=>toast("Alamat disalin. Tempel di Authorized JavaScript origins."))
      .catch(()=>toast("Salin manual: "+v));
  },
  checkClientId(v){
    S.clientId=v.trim(); save();
    const valid=LOGIC.validClientId(S.clientId);
    const msg=document.getElementById("cidmsg"), btn=document.getElementById("gobtn");
    if(msg){
      msg.textContent=valid?"Formatnya benar. Lanjut ke tombol di bawah."
        :S.clientId?"Belum lengkap — harus berakhiran .apps.googleusercontent.com"
        :"Bentuknya seperti 812345678901-abc123.apps.googleusercontent.com";
      msg.style.color=valid?"var(--pine)":(S.clientId?"var(--brick)":"var(--muted)");
    }
    if(btn) btn.disabled=!valid;
    if(valid){ tokenClient=null; initAuth(); }
  },
  connect(){
    if(!LOGIC.validClientId(S.clientId)){ toast("Tempel Client ID yang lengkap dulu."); openSetup(); return; }
    tokenClient=null;
    if(!initAuth()){ toast("Pustaka Google belum termuat. Periksa koneksi lalu coba lagi."); return; }
    signIn(true);
  },
  signIn(c){ signIn(c); },
  signOut(){ signOut(); },
  syncNow(){ syncNow(true); },

  quickAdd(){
    if(S.tab==="tasks"){ const el=document.getElementById("newtask"); if(el) el.focus(); return; }
    K.newNote();
  },
  newNote(){
    const n={id:"n"+Math.random().toString(36).slice(2,8),title:"",blocks:[LOGIC.newBlock("text","")],
      folder:S.folder==="Semua"?defaultFolder():S.folder,pinned:false,updatedAt:new Date().toISOString(),dirty:true};
    S.notes.unshift(n); save(); K.openNote(n.id); focusAt(0,0);
  },
  openNote(id){
    editing=id; focusBlock=null;
    const n=S.notes.find(x=>x.id===id); if(!n) return;
    if(!n.blocks||!n.blocks.length) n.blocks=[LOGIC.newBlock("text","")];
    document.getElementById("etitle").value=n.title||"";
    document.getElementById("efolder").textContent=n.folder||defaultFolder();
    document.getElementById("emeta").textContent=n.fileId?"tersimpan di Drive":"belum diunggah";
    document.getElementById("esave").textContent=LOGIC.relTime(n.updatedAt);
    renderBlocks();
    document.getElementById("editor").classList.add("on");
  },
  closeEditor(){
    const n=S.notes.find(x=>x.id===editing);
    if(n&&!n.fileId&&!(n.title||"").trim()&&!LOGIC.noteSnippet(n).trim()){
      S.notes=S.notes.filter(x=>x.id!==n.id);
      S.queue=S.queue.filter(o=>!(o.entity==="note"&&o.id===n.id));
      save();
    }
    document.getElementById("editor").classList.remove("on");
    editing=null; render();
  },
  setType(type){
    const n=S.notes.find(x=>x.id===editing); if(!n) return;
    let i=focusBlock;
    if(i===null||i===undefined||!n.blocks[i]) i=n.blocks.length-1;
    if(type==="divider"){
      n.blocks.splice(i+1,0,LOGIC.newBlock("divider",""),LOGIC.newBlock("text",""));
      touchNote(n); renderBlocks(); focusAt(i+2,0); return;
    }
    const b=n.blocks[i];
    b.type=(b.type===type)?"text":type;
    if(b.type!=="todo") b.checked=false;
    touchNote(n); renderBlocks(); focusAt(i);
  },
  check(i){
    const n=S.notes.find(x=>x.id===editing); if(!n||!n.blocks[i]) return;
    const b=n.blocks[i]; b.checked=!b.checked;
    // Sentuh hanya dua atribut. Render ulang seluruh daftar akan menutup
    // keyboard dan melompatkan posisi gulir hanya untuk satu centang.
    const blk=document.querySelector('.blk[data-i="'+i+'"]');
    if(blk){
      blk.dataset.checked=b.checked?"1":"0";
      const box=blk.querySelector('.box');
      if(box){ box.dataset.on=b.checked?"1":"0"; box.setAttribute("aria-checked",String(!!b.checked)); }
    }else renderBlocks();
    touchNote(n);
    if(navigator.vibrate) navigator.vibrate(8);
  },
  removeBlock(i){
    const n=S.notes.find(x=>x.id===editing); if(!n) return;
    n.blocks.splice(i,1);
    if(!n.blocks.length) n.blocks=[LOGIC.newBlock("text","")];
    touchNote(n); renderBlocks();
  },
  copyCode(i){
    const n=S.notes.find(x=>x.id===editing); if(!n||!n.blocks[i]) return;
    (navigator.clipboard?navigator.clipboard.writeText(n.blocks[i].text||""):Promise.reject())
      .then(()=>toast("Kode disalin.")).catch(()=>toast("Browser ini tidak mengizinkan salin otomatis."));
  },
  togglePin(){
    const n=S.notes.find(x=>x.id===editing); if(!n) return;
    n.pinned=!n.pinned; touchNote(n); toast(n.pinned?"Disematkan.":"Lepas sematan.");
  },
  deleteNote(){
    const n=S.notes.find(x=>x.id===editing); if(!n) return;
    n.deleted=true; n.dirty=true; queueOp("note",n.id,"delete"); save();
    document.getElementById("editor").classList.remove("on"); editing=null;
    toast("Dibuang ke sampah Drive. Bisa dipulihkan 30 hari."); render(); scheduleSync();
  },

  addTask(title,el){
    title=(title||"").trim(); if(!title) return;
    const id="t"+Math.random().toString(36).slice(2,8);
    S.tasks.push({id,title,due:S.taskMode==="upcoming"?null:LOGIC.today(),time:null,remind:null,
      done:false,list:"Inbox",priority:"normal",notes:"",updatedAt:new Date().toISOString()});
    queueOp("task",id,"create"); save(); if(el) el.value="";
    render(); scheduleSync();
    setTimeout(()=>{ const e=document.getElementById("newtask"); if(e) e.focus(); },60);
  },
  openTask(id){
    const t=S.tasks.find(x=>x.id===id); if(!t) return;
    openSheet(taskSheet(t));
  },
  saveTask(id){
    const t=S.tasks.find(x=>x.id===id); if(!t) return;
    const g=k=>document.getElementById(k);
    const title=(g("tk_title").value||"").trim();
    if(title) t.title=title;
    t.due=g("tk_due").value||null;
    t.time=g("tk_time").value||null;
    const rv=g("tk_remind").value;
    t.remind=(rv==="")?null:Number(rv);
    t.list=g("tk_list").value;
    t.priority=g("tk_pri").value;
    t.notes=g("tk_notes").value;
    if(t.remind!==null&&!t.due){ t.due=LOGIC.today(); toast("Pengingat butuh tanggal — diisi hari ini."); }
    t.updatedAt=new Date().toISOString();
    queueOp("task",id,"update"); save(); closeSheet(); render(); scheduleReminders(); scheduleSync();
    // Bare `Notification` melempar ReferenceError di browser yang tidak
    // punya API-nya — harus dicek lewat window.
    if(t.remind!==null&&("Notification" in window)&&Notification.permission==="default") askNotify();
  },
  toggleTask(id){
    const t=S.tasks.find(x=>x.id===id); if(!t) return;
    t.done=!t.done; t.updatedAt=new Date().toISOString();
    queueOp("task",id,"update"); save(); scheduleReminders(); scheduleSync();
    if(navigator.vibrate) navigator.vibrate(t.done?[7,45,12]:7);

    const el=document.querySelector('.task[data-id="'+id+'"]');
    if(!el||(S.tab!=="today"&&S.tab!=="tasks")){ render(); return; }

    // 1. Centang menggambar dirinya dan coretan menyapu, di tempat.
    el.dataset.done=t.done?"1":"0";
    const box=el.querySelector(".box");
    if(box){
      box.dataset.on=t.done?"1":"0";
      box.setAttribute("aria-checked",String(!!t.done));
      box.classList.remove("pop"); void box.offsetWidth;
      if(t.done) box.classList.add("pop");
    }

    // 2. Baru pindah bagian. Kalau dibatalkan sebelum jedanya habis, barisnya
    //    memang sudah berada di bagian yang benar — tidak perlu ke mana-mana.
    const prev=moveTimers.get(id); if(prev) clearTimeout(prev);
    if(!!el.closest("#donelist")===!!t.done){ moveTimers.delete(id); return; }
    moveTimers.set(id,setTimeout(()=>{
      moveTimers.delete(id);
      collapseThen(el,()=>{ justMoved=id; refreshTaskLists(); });
    },t.done?600:400));
  },
  toggleDone(){
    S.doneOpen=(S.doneOpen===false); save();
    const d=document.getElementById("donelist"),
          c=document.querySelector("#donehead .caret"),
          h=document.getElementById("donehead");
    if(d) d.dataset.open=(S.doneOpen&&d.children.length)?"1":"0";
    if(c) c.dataset.open=S.doneOpen?"1":"0";
    if(h) h.setAttribute("aria-expanded",String(!!S.doneOpen));
  },
  toggleTheme(){
    S.theme=(LOGIC.resolveTheme(S.theme,systemDark())==="dark")?"light":"dark";
    save(); applyTheme(); paintThemeBtn();
    if(S.tab==="settings") render();
  },
  useSystemTheme(){
    S.theme="auto"; save(); applyTheme(); render();
    toast("Tema ikut HP lagi — sekarang "+(systemDark()?"gelap":"terang")+".");
  },
  deleteTask(id){
    const t=S.tasks.find(x=>x.id===id); if(!t) return;
    t.deleted=true; t.updatedAt=new Date().toISOString();
    queueOp("task",id,"delete"); save(); closeSheet(); render(); scheduleSync();
    toast("Tugas dihapus.");
  },

  resolve(localId,fileId,how){
    closeSheet();
    const n=S.notes.find(x=>x.id===localId); if(!n) return;
    (async()=>{
      try{
        const remote=LOGIC.markdownToNote(await exportFile(fileId,"text/markdown"));
        if(how==="remote"){
          n.title=remote.title; n.blocks=remote.blocks; n.dirty=false;
          S.queue=S.queue.filter(o=>!(o.entity==="note"&&o.id===n.id));
        }else if(how==="both"){
          n.blocks=[...n.blocks,LOGIC.newBlock("divider",""),LOGIC.newBlock("quote","Versi dari Drive"),...remote.blocks];
          n.dirty=true; queueOp("note",n.id,"update");
        }else{ n.dirty=true; queueOp("note",n.id,"update"); }
        const meta=await api(`${DRIVE}/files/${fileId}?fields=modifiedTime`);
        n.driveModified=meta.modifiedTime; n.updatedAt=new Date().toISOString();
        save(); log("konflik diselesaikan: "+how); render(); syncNow();
      }catch(e){ toast("Gagal menyelesaikan konflik: "+e.message); }
    })();
  },
  runTests(){
    const r=selfTest(), pass=r.filter(x=>x.pass).length;
    document.getElementById("testout").innerHTML=
      `<div class="card"><div style="font-size:13.5px;font-weight:600;color:${pass===r.length?"var(--pine)":"var(--brick)"}">${pass}/${r.length} lolos</div>`+
      r.map(x=>`<div style="font-size:11.5px;margin-top:6px;color:${x.pass?"var(--ink2)":"var(--brick)"}">${x.pass?"✓":"✗"} ${esc(x.n)}${x.e?" — "+esc(x.e):""}</div>`).join("")+`</div>`;
  },
  backup(){
    /* Section dan Client ID ikut dibawa: tanpa keduanya, memulihkan di HP baru
       menyisakan catatan tanpa chip dan penyiapan Google yang harus diulang
       dari Cloud Console. Client ID memang bukan rahasia. */
    const data={kertas:1,exportedAt:new Date().toISOString(),clientId:S.clientId||"",
      folders:S.folders,notes:S.notes,tasks:S.tasks};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download="kertas-backup-"+LOGIC.today()+".json"; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    toast(S.notes.length+" catatan & "+S.tasks.length+" tugas diunduh.");
  },
  importPick(){ document.getElementById("importfile").click(); },
  importFile(el){
    const f=el.files&&el.files[0];
    el.value="";        // tanpa ini, memilih berkas yang sama dua kali tidak memicu apa pun
    if(!f) return;
    const rd=new FileReader();
    rd.onerror=()=>toast("Berkas tidak terbaca.");
    rd.onload=()=>{
      const r=LOGIC.readBackup(String(rd.result||""));
      if(!r.ok){ toast(r.error); return; }
      if(!r.notes.length&&!r.tasks.length){ toast("Cadangan ini kosong — tidak ada yang bisa dipulihkan."); return; }
      pendingImport=r;
      openSheet(importSheet(r,f.name));
    };
    rd.readAsText(f);
  },
  importConfirmReplace(){
    const r=pendingImport; if(!r) return;
    openSheet(`<div class="h" style="font-size:16px;margin-bottom:6px">Ganti semua isi HP ini?</div>
      <p style="font-size:12.5px;color:var(--ink2);line-height:1.55;margin:0 0 14px">
        ${S.notes.length} catatan dan ${S.tasks.length} tugas yang sekarang ada di HP ini akan dibuang,
        diganti isi cadangan. Berkas di Google Drive tidak ikut terhapus.
        <br><br>Kalau cuma mau memindahkan isi HP lama, pilih <b>Gabungkan</b> — itu tidak membuang apa pun.</p>
      <button class="btn danger" onclick="K.importApply('replace')">Ya, ganti semua</button>
      <button class="btn" onclick="K.importBack()">Kembali</button>`,true);
  },
  importBack(){
    if(!pendingImport){ closeSheet(); return; }
    openSheet(importSheet(pendingImport,"cadangan"));
  },
  importApply(mode){
    const r=pendingImport; if(!r) return;
    const dn=LOGIC.importDiff(S.notes,r.notes), dt=LOGIC.importDiff(S.tasks,r.tasks);

    if(mode==="replace"){
      S.notes=r.notes.slice(); S.tasks=r.tasks.slice();
    }else{
      S.notes=LOGIC.mergeNotes(S.notes,r.notes);
      S.tasks=LOGIC.mergeTasks(S.tasks,r.tasks);
    }

    // Catatan versi lawas menyimpan isinya sebagai satu teks; ubah seperti saat migrasi biasa.
    for(const n of S.notes){
      if(!n.blocks){ n.blocks=LOGIC.markdownToBlocks(n.body||""); delete n.body; }
      if(!n.blocks.length) n.blocks=[LOGIC.newBlock("text","")];
    }
    for(const t of S.tasks){
      if(t.time===undefined) t.time=null;
      if(t.remind===undefined) t.remind=null;
      if(t.notes===undefined) t.notes="";
    }

    const dasar=(mode==="replace")?(r.folders.length?r.folders:[...DEFAULT_FOLDERS]):S.folders;
    S.folders=LOGIC.mergeFolders(LOGIC.mergeFolders(dasar,r.folders),S.notes.map(n=>n&&n.folder));
    if(!S.folders.some(f=>f===S.folder)&&S.folder!=="Semua") S.folder="Semua";

    if(!LOGIC.validClientId(S.clientId)&&LOGIC.validClientId(r.clientId)) S.clientId=r.clientId.trim();

    // Hanya yang benar-benar masuk yang diantrekan — bukan seluruh isi HP.
    const idsN=(mode==="replace")?r.notes.map(n=>n.id):dn.ids;
    const idsT=(mode==="replace")?r.tasks.map(t=>t.id):dt.ids;
    for(const id of idsN){
      const n=S.notes.find(x=>x.id===id);
      if(n&&!n.deleted){ n.dirty=true; queueOp("note",id,"update"); }
    }
    for(const id of idsT){
      const t=S.tasks.find(x=>x.id===id);
      if(t&&!t.deleted) queueOp("task",id,"update");
    }

    pendingImport=null; save(); closeSheet();
    const n=(mode==="replace")?r.notes.length:dn.baru+dn.timpa;
    const t=(mode==="replace")?r.tasks.length:dt.baru+dt.timpa;
    log("cadangan dipulihkan: "+n+" catatan, "+t+" tugas");
    toast(n+" catatan & "+t+" tugas dipulihkan.");
    render(); scheduleReminders(); scheduleSync();
  },
  wipe(){
    openSheet(`<div class="h" style="font-size:16px;margin-bottom:6px">Hapus data lokal?</div>
      <p style="font-size:12.5px;color:var(--ink2);line-height:1.55;margin:0 0 14px">
        File di Google Drive tidak ikut terhapus. Sambungkan lagi nanti dan semuanya ditarik ulang.</p>
      <button class="btn danger" onclick="K.wipeConfirm()">Ya, hapus data di HP ini</button>
      <button class="btn" onclick="K.closeSheet()">Batal</button>`,true);
  },
  closeSheet(){ closeSheet(); },
  wipeConfirm(){
    const cid=S.clientId;
    try{ localStorage.setItem(STORE_KEY,JSON.stringify({clientId:cid,notes:[],tasks:[],queue:[],ledger:[],
      notified:[],ids:{},lastSync:null,tab:"today",folder:"Semua",taskMode:"today",query:"",autoSync:true,
      everConnected:false})); }catch(e){}
    location.reload();
  }
};

/* ================= 10. SIKLUS HIDUP ==================================== */

let syncTimer=null;
function scheduleSync(){
  if(!S.autoSync) return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>{ if(reachable()&&signedIn()) syncNow(); },5000);
}
document.getElementById("etitle").addEventListener("input",e=>{
  const n=S.notes.find(x=>x.id===editing); if(!n) return;
  n.title=e.target.value; touchNote(n);
});
document.getElementById("scrim").addEventListener("click",e=>{ if(e.target.id==="scrim") closeSheet(); });

window.addEventListener("online",()=>{
  netDown=false; S.syncAttempts=0; S.lastError=null; save();
  log("jaringan pulih");
  toast(S.queue.length?"Kembali online. Mengunggah "+S.queue.length+" perubahan.":"Kembali online.");
  render(); syncNow();
});
window.addEventListener("offline",()=>{
  log("jaringan putus","warn");
  toast("Offline. Semua perubahan tetap tersimpan di HP ini.");
  clearTimeout(retryTimer); render();
});
// Karena penulisan kini ditunda 400ms, ia harus dipaksa selesai sebelum
// sistem membekukan atau mematikan app — kalau tidak, ketikan terakhir hilang.
if(window.matchMedia){
  const mq=window.matchMedia("(prefers-color-scheme: dark)");
  const onChange=()=>{ if(S.theme==="auto"){ applyTheme(); paintThemeBtn(); if(S.tab==="settings") render(); } };
  if(mq.addEventListener) mq.addEventListener("change",onChange);
  else if(mq.addListener) mq.addListener(onChange);
}
window.addEventListener("pagehide",flushSave);
window.addEventListener("blur",flushSave);
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){ flushSave(); return; }
  render(); catchUpReminders(); scheduleReminders();
  if(NATIVE.on) checkNativePerm();
  if(signedIn()&&reachable()&&(S.queue.length||!S.lastSync||Date.now()-Date.parse(S.lastSync)>60000)) syncNow();
});
setInterval(()=>{ if(!document.hidden&&S.queue.length&&reachable()&&signedIn()&&!busy) syncNow(); },60000);

window.addEventListener("load",()=>{
  setTimeout(()=>{
    if(LOGIC.validClientId(S.clientId)&&initAuth()&&S.everConnected) signIn(false);
    else if(!S.clientId&&!S.notes.length&&!S.tasks.length) openSetup();
    render();
  },600);
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
  catchUpReminders(); scheduleReminders();
  if(NATIVE.on) checkNativePerm();
  const p=new URLSearchParams(location.search);
  if(p.get("do")==="note"){ K.go("notes"); K.newNote(); }
  if(p.get("do")==="task"){ K.go("tasks"); }
});

applyTheme();
render();
</script>
