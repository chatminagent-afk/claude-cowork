<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Kertas">
  <title>Kertas</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E7A5A"/>
      <stop offset="1" stop-color="#074A35"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#041E16" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <g filter="url(#lift)">
    <!-- selembar kertas, sudut kanan-atas terpotong miring -->
    <path fill="#F8FBF9" d="M143.39 90.47
      L315.70 90.47 L391.68 166.45
      L391.68 398.46 A23.07 23.07 0 0 1 368.61 421.53
      L143.39 421.53 A23.07 23.07 0 0 1 120.32 398.46
      L120.32 113.54 A23.07 23.07 0 0 1 143.39 90.47 Z"/>
    <!-- sudut yang terlipat -->
    <path fill="#CEE0D6" d="M315.70 90.47 L391.68 166.45 L315.70 166.45 Z"/>
    <path fill="none" stroke="#B0CABD" stroke-width="2.71"
          d="M315.70 90.47 L315.70 166.45 L391.68 166.45"/>
  </g>

  <!-- dua baris tulisan -->
  <rect x="162.38" y="174.89" width="149.25" height="14.92" rx="7.46" fill="#ACCDBE"/>
  <rect x="162.38" y="221.24" width="100.40" height="14.92" rx="7.46" fill="#ACCDBE"/>

  <!-- satu tugas yang beres -->
  <polyline points="162.38,317.25 209.87,364.74 325.20,254.84" fill="none"
            stroke="#0C6B4F" stroke-width="28.49" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
